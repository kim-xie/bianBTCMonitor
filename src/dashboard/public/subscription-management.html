<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订阅管理 - BTC交易监控</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subscription-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .active-subscription {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
        }

        .expired-subscription {
            border-color: #f44336;
            background: rgba(244, 67, 54, 0.1);
        }

        .subscription-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .subscription-title {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .subscription-status {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .status-active {
            background: #4CAF50;
            color: white;
        }

        .status-expired {
            background: #f44336;
            color: white;
        }

        .subscription-details {
            margin-bottom: 1.5rem;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f44336 0%, #da190b 100%);
            color: white;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            border-left: 4px solid;
        }

        .alert-success {
            background: rgba(76, 175, 80, 0.2);
            border-left-color: #4CAF50;
            color: #4CAF50;
        }

        .alert-warning {
            background: rgba(255, 152, 0, 0.2);
            border-left-color: #ff9800;
            color: #ff9800;
        }

        .alert-danger {
            background: rgba(244, 67, 54, 0.2);
            border-left-color: #f44336;
            color: #f44336;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .subscription-header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .detail-row {
                flex-direction: column;
                gap: 0.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-crown"></i> 订阅管理</h1>
            <p>管理您的BTC交易监控服务订阅</p>
        </div>

        <div id="subscriptionInfo">
            <!-- 订阅信息将在这里动态加载 -->
        </div>

        <div id="subscriptionHistory" style="display: none;">
            <h2 style="text-align: center; margin: 2rem 0;">订阅历史</h2>
            <div id="historyList">
                <!-- 历史记录将在这里显示 -->
            </div>
        </div>
    </div>

    <script>
        class SubscriptionManagement {
            constructor() {
                this.token = localStorage.getItem('authToken');
                this.init();
            }

            async init() {
                if (!this.token) {
                    window.location.href = '/login';
                    return;
                }

                await this.loadSubscriptionInfo();
                await this.loadSubscriptionHistory();
            }

            async loadSubscriptionInfo() {
                try {
                    const response = await fetch('/api/subscription/current', {
                        headers: {
                            'Authorization': `Bearer ${this.token}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        this.renderSubscriptionInfo(data);
                    } else {
                        throw new Error('获取订阅信息失败');
                    }

                } catch (error) {
                    console.error('加载订阅信息错误:', error);
                    this.showError('无法加载订阅信息');
                }
            }

            renderSubscriptionInfo(data) {
                const container = document.getElementById('subscriptionInfo');

                if (data.hasActiveSubscription && data.subscription) {
                    const subscription = data.subscription;
                    const now = new Date();
                    const endDate = new Date(subscription.endDate);
                    const timeLeft = endDate.getTime() - now.getTime();
                    const daysLeft = Math.max(0, Math.floor(timeLeft / (1000 * 60 * 60 * 24)));
                    const isExpired = timeLeft <= 0;

                    let statusClass = isExpired ? 'expired-subscription' : 'active-subscription';
                    let statusText = isExpired ? '已过期' : '活跃';

                    container.innerHTML = `
                        <div class="subscription-card ${statusClass}">
                            <div class="subscription-header">
                                <div class="subscription-title">
                                    <i class="fas fa-crown"></i> ${subscription.planId?.name || '未知套餐'}
                                </div>
                                <span class="subscription-status status-${isExpired ? 'expired' : 'active'}">
                                    ${statusText}
                                </span>
                            </div>

                            <div class="subscription-details">
                                <div class="detail-row">
                                    <span>订阅ID:</span>
                                    <span>${subscription._id || 'N/A'}</span>
                                </div>
                                <div class="detail-row">
                                    <span>开始时间:</span>
                                    <span>${subscription.startDate ? new Date(subscription.startDate).toLocaleDateString() : 'N/A'}</span>
                                </div>
                                <div class="detail-row">
                                    <span>到期时间:</span>
                                    <span>${new Date(subscription.endDate).toLocaleDateString()}</span>
                                </div>
                                <div class="detail-row">
                                    <span>状态:</span>
                                    <span>${subscription.status || 'unknown'}</span>
                                </div>
                                ${!isExpired ? `
                                <div class="detail-row">
                                    <span>剩余时间:</span>
                                    <span class="${daysLeft <= 3 ? 'time-critical' : daysLeft <= 7 ? 'time-warning' : ''}">${daysLeft} 天</span>
                                </div>
                                ` : ''}
                            </div>

                            <div style="text-align: center; margin-top: 2rem;">
                                ${!isExpired ? `
                                    <button class="btn btn-danger" onclick="subscriptionService.cancelSubscription()">
                                        <i class="fas fa-times"></i> 取消订阅
                                    </button>
                                ` : `
                                    <button class="btn btn-primary" onclick="window.location.href='/subscription'">
                                        <i class="fas fa-crown"></i> 重新订阅
                                    </button>
                                `}
                            </div>
                        </div>
                    `;

                    // 如果即将过期，显示警告
                    if (daysLeft <= 7 && !isExpired) {
                        this.showExpirationWarning(daysLeft);
                    }

                } else {
                    container.innerHTML = `
                        <div class="subscription-card">
                            <div class="subscription-header">
                                <div class="subscription-title">
                                    <i class="fas fa-info-circle"></i> 无活跃订阅
                                </div>
                                <span class="subscription-status" style="background: #666; color: white;">
                                    基础版本
                                </span>
                            </div>

                            <div style="text-align: center; margin: 2rem 0;">
                                <button class="btn btn-primary" onclick="window.location.href='/subscription'">
                                    <i class="fas fa-crown"></i> 立即订阅
                                </button>
                            </div>
                        </div>
                    `;
                }
            }

            async loadSubscriptionHistory() {
                try {
                    const response = await fetch('/api/subscription/history', {
                        headers: {
                            'Authorization': `Bearer ${this.token}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (response.ok) {
                        const history = await response.json();

                        if (history.length > 0) {
                            document.getElementById('subscriptionHistory').style.display = 'block';
                            this.renderHistory(history);
                        }
                    }
                } catch (error) {
                    console.error('加载订阅历史错误:', error);
                }
            }

            renderHistory(history) {
                const container = document.getElementById('historyList');
                let html = '';

                history.forEach(subscription => {
                    const startDate = new Date(subscription.startDate || subscription.createdAt);
                    const endDate = new Date(subscription.endDate);

                    html += `
                        <div class="subscription-card" style="margin-bottom: 1rem;">
                            <div class="subscription-header">
                                <div class="subscription-title">
                                    <i class="fas fa-history"></i> ${subscription.planId?.name || '未知套餐'}
                                </div>
                                <span class="subscription-status status-${subscription.status === 'active' ? 'active' : subscription.status === 'cancelled' ? 'expired' : 'expired'}">
                                    ${this.getStatusText(subscription.status)}
                                </span>
                            </div>

                            <div class="subscription-details">
                                <div class="detail-row">
                                    <span>创建时间:</span>
                                    <span>${startDate.toLocaleDateString()}</span>
                                </div>
                                <div class="detail-row">
                                    <span>结束时间:</span>
                                    <span>${endDate.toLocaleDateString()}</span>
                                </div>
                                <div class="detail-row">
                                    <span>状态:</span>
                                    <span>${subscription.status}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            }

            getStatusText(status) {
                switch (status) {
                    case 'active': return '活跃';
                    case 'expired': return '已过期';
                    case 'cancelled': return '已取消';
                    default: return status;
                }
            }

            showExpirationWarning(daysLeft) {
                const warningDiv = document.createElement('div');
                warningDiv.className = 'alert alert-warning';
                warningDiv.innerHTML = `
                    <i class="fas fa-exclamation-triangle"></i>
                    <strong>订阅将在 ${daysLeft} 天后到期</strong>
                    <p>请及时续费以避免服务中断。</p>
                    <button onclick="window.location.href='/subscription'" class="btn btn-primary" style="margin-top: 1rem;">
                        <i class="fas fa-crown"></i> 立即续费
                    </button>
                `;

                document.querySelector('.container').insertBefore(warningDiv, document.getElementById('subscriptionInfo'));
            }

            cancelSubscription() {
                if (confirm('确定要取消当前订阅吗？此操作不可撤销！')) {
                    fetch('/api/subscription/cancel', {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${this.token}`,
                            'Content-Type': 'application/json'
                        }
                    }).then(response => {
                        if (response.ok) {
                            alert('订阅已成功取消');
                            location.reload();
                        } else {
                            response.json().then(data => {
                                alert(`取消订阅失败: ${data.error}`);
                            });
                        }
                    });
                }
            }

            showError(message) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'alert alert-danger';
                errorDiv.textContent = message;

                document.querySelector('.container').prepend(errorDiv);

                // 3秒后自动消失
                setTimeout(() => {
                    errorDiv.remove();
                }, 3000);
            }
        }

        const subscriptionService = new SubscriptionManagement();
    </script>
</body>
</html>
