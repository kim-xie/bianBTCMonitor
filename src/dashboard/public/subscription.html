<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC交易监控 - 订阅套餐</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .plans-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .plan-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .plan-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .plan-card.featured {
            border: 2px solid #ff6b6b;
            transform: scale(1.05);
        }

        .plan-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .plan-name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .plan-price {
            font-size: 3rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .plan-duration {
            color: #666;
            font-size: 1.1rem;
        }

        .plan-description {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .features-list {
            list-style: none;
            margin-bottom: 2rem;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.8rem;
            color: #555;
        }

        .feature-item i {
            color: #4CAF50;
            margin-right: 0.8rem;
            font-size: 1.1rem;
        }

        .select-plan-btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .select-plan-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .popular-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #ff6b6b;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .payment-section {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            margin-top: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .payment-methods {
            display: flex;
            justify-content: space-around;
            margin: 2rem 0;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .payment-method {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            border: 2px solid #eee;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .payment-method:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .payment-method.selected {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .payment-method i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #667eea;
        }

        .payment-method span {
            font-weight: bold;
            color: #333;
        }

        .auto-renewal {
            margin: 1rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .auto-renewal input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }

        .checkout-btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #666;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            border-left: 4px solid #c62828;
        }

        .success-message {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            border-left: 4px solid #2e7d32;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .plans-container {
                grid-template-columns: 1fr;
            }

            .plan-card.featured {
                transform: none;
            }

            .payment-methods {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-crown"></i> BTC交易监控系统</h1>
            <p>选择最适合您的订阅套餐，开始专业的比特币交易监控之旅</p>
            <div id="authPrompt" style="margin-top: 1rem; display: none;">
                <button onclick="window.location.href='/login'" style="padding: 0.8rem 2rem; background: #ff9800; color: white; border: none; border-radius: 25px; font-size: 1rem; cursor: pointer;">
                    <i class="fas fa-sign-in-alt"></i> 登录后购买套餐
                </button>
            </div>
        </div>

        <div class="plans-container" id="plansContainer">
            <!-- 套餐将通过JavaScript动态加载 -->
        </div>

        <div class="payment-section" id="paymentSection" style="display: none;">
            <h2 style="text-align: center; margin-bottom: 1rem;">选择支付方式</h2>

            <div class="payment-methods" id="paymentMethods">
                <div class="payment-method" data-method="stripe">
                    <i class="fab fa-cc-stripe"></i>
                    <span>信用卡/借记卡</span>
                </div>
                <div class="payment-method" data-method="paypal">
                    <i class="fab fa-paypal"></i>
                    <span>PayPal</span>
                </div>
                <div class="payment-method" data-method="crypto">
                    <i class="fas fa-bitcoin"></i>
                    <span>加密货币</span>
                </div>
            </div>

            <div class="auto-renewal">
                <input type="checkbox" id="autoRenewal">
                <label for="autoRenewal">自动续费（到期前3天提醒）</label>
            </div>

            <button class="checkout-btn" id="checkoutBtn" style="display: none;">
                <i class="fas fa-lock"></i> 安全支付
            </button>
        </div>
    </div>

    <script>
        class SubscriptionService {
            constructor() {
                this.selectedPlan = null;
                this.selectedPaymentMethod = null;
                this.token = localStorage.getItem('authToken');
                this.isDevelopment = false;
                this.init();
            }

            async init() {
                // 检查环境
                this.checkEnvironment();
                
                // 允许访客查看套餐信息，不需要立即登录
                await this.loadPlans();

                // 更新认证提示状态
                this.updateAuthPrompt();

                // 如果用户已登录，检查订阅状态
                if (this.token) {
                    await this.checkSubscriptionStatus();
                }
            }

            checkEnvironment() {
                // 检查是否为开发环境
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    this.isDevelopment = true;
                    console.log('检测到开发环境，启用模拟订阅功能');
                }
            }

            updateAuthPrompt() {
                const authPrompt = document.getElementById('authPrompt');
                const paymentSection = document.getElementById('paymentSection');

                if (!this.token) {
                    authPrompt.style.display = 'block';
                    paymentSection.style.display = 'none';

                    // 为访客添加直接登录选项
                    const loginButton = document.querySelector('#authPrompt button');
                    if (loginButton) {
                        loginButton.onclick = () => {
                            window.location.href = '/login?redirect=subscription';
                        };
                    }
                } else {
                    authPrompt.style.display = 'none';
                }
            }

            async loadPlans() {
                try {
                    // 不要求认证即可查看套餐信息
                    const response = await fetch('/api/subscription/plans');

                    if (!response.ok) {
                        throw new Error('获取套餐失败');
                    }

                    const plans = await response.json();
                    this.renderPlans(plans);

                } catch (error) {
                    console.error('加载套餐错误:', error);
                    document.getElementById('plansContainer').innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-triangle"></i>
                            加载套餐失败，请刷新页面重试
                        </div>
                    `;
                }
            }

            async checkSubscriptionStatus() {
                try {
                    // 获取用户信息（包含订阅状态）
                    const userResponse = await fetch('/api/auth/me', {
                        headers: {
                            'Authorization': `Bearer ${this.token}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (userResponse.ok) {
                        const result = await userResponse.json();
                        if (result.user?.hasActiveSubscription) {
                            // 用户已有活跃订阅，显示成功消息
                            this.showSubscriptionActive(result.user);
                        } else {
                            // 用户未订阅，同步订阅状态
                            await this.syncSubscriptionStatus();
                        }
                    }
                } catch (error) {
                    console.error('检查订阅状态失败:', error);
                }
            }

            async syncSubscriptionStatus() {
                try {
                    const response = await fetch('/api/subscription/sync-status', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${this.token}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (response.ok) {
                        const result = await response.json();
                        if (result.hasActiveSubscription) {
                            this.showSubscriptionActive(result);
                        }
                    }
                } catch (error) {
                    console.error('同步订阅状态失败:', error);
                }
            }

            async syncSubscriptionStatus(subscription) {
                // 同步订阅状态到用户模型
                try {
                    // 这里应该调用后端API来更新用户订阅状态
                    console.log('同步订阅状态:', subscription);
                } catch (error) {
                    console.error('同步订阅状态失败:', error);
                }
            }

            renderPlans(plans) {
                const container = document.getElementById('plansContainer');
                let html = '';

                plans.forEach((plan, index) => {
                    const isFeatured = plan.duration === 'monthly' || plan.price === 280;
                    html += `
                        <div class="plan-card${isFeatured ? ' featured' : ''}">
                            ${isFeatured ? '<div class="popular-badge">最受欢迎</div>' : ''}
                            <div class="plan-header">
                                <div class="plan-name">${plan.name}</div>
                                <div class="plan-price">$${plan.price}</div>
                                <div class="plan-duration">/${this.getDurationText(plan.duration)}</div>
                            </div>
                            <div class="plan-description">
                                ${plan.description}
                            </div>
                            <ul class="features-list">
                                ${plan.features.map(feature => `
                                    <li class="feature-item">
                                        <i class="fas fa-check"></i>
                                        ${feature}
                                    </li>
                                `).join('')}
                            </ul>
                            <button class="select-plan-btn" onclick="subscriptionService.selectPlan(${index})">
                                <i class="fas fa-crown"></i> 选择此套餐
                            </button>
                        </div>
                    `;
                });

                container.innerHTML = html;
            }

            getDurationText(duration) {
                switch (duration) {
                    case 'weekly': return '周';
                    case 'monthly': return '月';
                    case 'quarterly': return '季度';
                    default: return '期';
                }
            }

            selectPlan(index) {
                this.selectedPlan = index;

                // 如果用户已登录，显示支付选项
                if (this.token) {
                    document.querySelectorAll('.plan-card').forEach((card, i) => {
                        card.style.borderColor = i === index ? '#667eea' : '#ddd';
                        card.querySelector('.select-plan-btn').style.background =
                            i === index ? 'linear-gradient(135deg, #4CAF50 0%, #45a049 100%)' :
                            'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                    });

                    document.getElementById('paymentSection').style.display = 'block';
                    
                    // 根据环境显示不同的按钮
                    if (this.isDevelopment) {
                        document.getElementById('checkoutBtn').innerHTML = '<i class="fas fa-magic"></i> 模拟订阅（开发环境）';
                        document.getElementById('checkoutBtn').style.background = 'linear-gradient(135deg, #ff9800 0%, #f57c00 100%)';
                    } else {
                        document.getElementById('checkoutBtn').innerHTML = '<i class="fas fa-lock"></i> 安全支付';
                        document.getElementById('checkoutBtn').style.background = 'linear-gradient(135deg, #4CAF50 0%, #45a049 100%)';
                    }
                    
                    document.getElementById('checkoutBtn').style.display = 'block';

                    // 预选中第一个支付方式
                    document.querySelector('.payment-method[data-method="stripe"]').classList.add('selected');
                    this.selectedPaymentMethod = 'stripe';
                } else {
                    // 未登录用户只能查看套餐信息
                    alert('请先登录后再购买订阅套餐');
                    return;
                }
            }

            selectPaymentMethod(method) {
                this.selectedPaymentMethod = method;
                document.querySelectorAll('.payment-method').forEach(pm => {
                    pm.classList.remove('selected');
                });
                event.currentTarget.classList.add('selected');
            }

            async checkout() {
                if (!this.token) {
                    alert('请先登录后再购买订阅套餐');
                    window.location.href = '/login';
                    return;
                }

                // 检查用户是否已有活跃订阅
                const userResponse = await fetch('/api/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${this.token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (userResponse.ok) {
                    const result = await userResponse.json();
                    if (result.user?.hasActiveSubscription) {
                        alert('您已经有一个活跃的订阅！如需更换套餐请联系客服。');
                        return;
                    }
                }

                if (!this.selectedPlan) {
                    alert('请选择套餐');
                    return;
                }

                // 保存选择的套餐信息
                localStorage.setItem('selectedPlan', JSON.stringify(this.selectedPlan));

                // 根据环境选择不同的处理方式
                if (this.isDevelopment) {
                    // 开发环境使用模拟订阅
                    await this.createMockSubscription();
                } else {
                    // 生产环境使用真实支付
                    if (!this.selectedPaymentMethod) {
                        alert('请选择支付方式');
                        return;
                    }

                    const plan = JSON.parse(localStorage.getItem('selectedPlan') || 'null');
                    const paymentMethod = this.selectedPaymentMethod;

                    try {
                        document.getElementById('checkoutBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> 处理中...';
                        document.getElementById('checkoutBtn').disabled = true;

                        // 根据选择的支付方式调用不同的API
                        let result;
                        switch (paymentMethod) {
                            case 'stripe':
                                result = await this.createStripePayment(plan);
                                break;
                            case 'paypal':
                                result = await this.createPayPalOrder(plan);
                                break;
                            case 'crypto':
                                result = await this.generateCryptoAddress(plan);
                                break;
                            default:
                                throw new Error('不支持的支付方式');
                        }

                        // 模拟支付成功
                        setTimeout(() => {
                            this.handlePaymentSuccess(result);
                        }, 2000);

                    } catch (error) {
                        console.error('支付处理错误:', error);
                        alert('支付处理失败，请重试');
                    } finally {
                        document.getElementById('checkoutBtn').innerHTML = '<i class="fas fa-lock"></i> 安全支付';
                        document.getElementById('checkoutBtn').disabled = false;
                    }
                }
            }

            async createStripePayment(plan) {
                const response = await fetch('/api/payment/stripe/create-intent', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${this.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        planId: plan._id,
                        amount: plan.price,
                        paymentMethodId: 'pm_card_visa' // 测试用
                    })
                });

                return await response.json();
            }

            async createPayPalOrder(plan) {
                const response = await fetch('/api/payment/paypal/create-order', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${this.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        planId: plan._id,
                        amount: plan.price
                    })
                });

                return await response.json();
            }

            async generateCryptoAddress(plan) {
                const response = await fetch('/api/payment/crypto/generate-address', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${this.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        planId: plan._id,
                        amount: plan.price,
                        cryptoCurrency: 'BTC'
                    })
                });

                return await response.json();
            }

            handlePaymentSuccess(result) {
                // 保存选择的套餐信息
                localStorage.setItem('selectedPlan', JSON.stringify(this.selectedPlan));

                // 创建订阅
                this.createSubscription();

                // 显示成功消息
                document.getElementById('paymentSection').innerHTML = `
                    <div class="success-message">
                        <i class="fas fa-check-circle"></i>
                        <h3>支付成功！</h3>
                        <p>您的订阅已成功激活。我们将发送确认邮件到您的邮箱。</p>
                        <button onclick="window.location.href='/dashboard'" class="checkout-btn" style="margin-top: 1rem;">
                            <i class="fas fa-home"></i> 返回仪表板
                        </button>
                    </div>
                `;
            }

            showSubscriptionActive(userInfo) {
                const container = document.getElementById('plansContainer');
                const message = `
                    <div class="success-message" style="text-align: center; margin: 2rem auto;">
                        <i class="fas fa-crown" style="font-size: 3rem; color: #4CAF50; margin-bottom: 1rem;"></i>
                        <h2>🎉 您已订阅高级服务！</h2>
                        <p>欢迎回来，<strong>${userInfo.username}</strong>！</p>
                        ${userInfo.subscription ? `
                            <p>当前套餐：<strong>${userInfo.subscription.planName || '高级套餐'}</strong></p>
                            <p>到期时间：<strong>${userInfo.subscription.endDate ? new Date(userInfo.subscription.endDate).toLocaleDateString() : '长期有效'}</strong></p>
                        ` : ''}
                        <p>状态：<span style="color: #4CAF50; font-weight: bold;">活跃</span></p>
                        <div style="margin-top: 2rem;">
                            <button onclick="window.location.href='/dashboard'" class="checkout-btn" style="background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);">
                                <i class="fas fa-home"></i> 进入仪表板
                            </button>
                            <button onclick="location.reload()" style="margin-left: 1rem; padding: 1rem; border: 2px solid #667eea; background: white; color: #667eea; border-radius: 8px; cursor: pointer;">
                                <i class="fas fa-sync-alt"></i> 刷新页面
                            </button>
                        </div>
                    </div>
                `;

                container.innerHTML = message;
                document.getElementById('paymentSection').style.display = 'none';
            }

            async createSubscription() {
                try {
                    const selectedPlan = JSON.parse(localStorage.getItem('selectedPlan'));
                    const plan = await fetch('/api/subscription/plans', {
                        headers: {
                            'Authorization': `Bearer ${this.token}`,
                            'Content-Type': 'application/json'
                        }
                    }).then(res => res.json()).then(plans => plans[selectedPlan]);

                    const response = await fetch('/api/subscription/create', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${this.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            planId: plan._id,
                            paymentMethod: this.selectedPaymentMethod,
                            autoRenewal: document.getElementById('autoRenewal').checked
                        })
                    });

                    if (!response.ok) {
                        throw new Error('创建订阅失败');
                    }

                    const subscriptionResult = await response.json();
                    console.log('订阅创建成功:', subscriptionResult);

                } catch (error) {
                    console.error('创建订阅错误:', error);
                }
            }

            async createMockSubscription() {
                try {
                    const selectedPlan = JSON.parse(localStorage.getItem('selectedPlan'));
                    const plan = await fetch('/api/subscription/plans', {
                        headers: {
                            'Authorization': `Bearer ${this.token}`,
                            'Content-Type': 'application/json'
                        }
                    }).then(res => res.json()).then(plans => plans[selectedPlan]);

                    document.getElementById('checkoutBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> 处理中...';
                    document.getElementById('checkoutBtn').disabled = true;

                    const response = await fetch('/api/subscription/create-mock', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${this.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            planId: plan._id
                        })
                    });

                    if (!response.ok) {
                        throw new Error('创建模拟订阅失败');
                    }

                    const subscriptionResult = await response.json();
                    console.log('模拟订阅创建成功:', subscriptionResult);

                    // 显示成功消息
                    document.getElementById('paymentSection').innerHTML = `
                        <div class="success-message">
                            <i class="fas fa-check-circle"></i>
                            <h3>模拟订阅成功！</h3>
                            <p>您的模拟订阅已成功激活，有效期3天。</p>
                            <p>此功能仅在开发环境可用。</p>
                            <button onclick="window.location.href='/dashboard'" class="checkout-btn" style="margin-top: 1rem;">
                                <i class="fas fa-home"></i> 进入仪表板
                            </button>
                        </div>
                    `;

                } catch (error) {
                    console.error('创建模拟订阅错误:', error);
                    alert('创建模拟订阅失败，请重试');
                } finally {
                    document.getElementById('checkoutBtn').innerHTML = '<i class="fas fa-lock"></i> 安全支付';
                    document.getElementById('checkoutBtn').disabled = false;
                }
            }
        }

        // 全局函数用于在HTML中调用
        function selectPaymentMethod(method) {
            subscriptionService.selectPaymentMethod(method);
        }

        // 初始化订阅服务
        const subscriptionService = new SubscriptionService();

        // 监听认证状态变化
        window.addEventListener('storage', (event) => {
            if (event.key === 'authToken') {
                // 刷新页面以重新加载认证状态
                location.reload();
            }
        });

        // 检查URL中的登录成功参数
        if (window.location.search.includes('login=success')) {
            alert('登录成功！现在可以购买订阅套餐了');
        }

        // 添加事件监听器
        document.addEventListener('DOMContentLoaded', () => {
            const checkoutBtn = document.getElementById('checkoutBtn');
            if (checkoutBtn) {
                checkoutBtn.addEventListener('click', () => subscriptionService.checkout());
            }

            // 为支付方式添加点击事件
            document.querySelectorAll('.payment-method').forEach(method => {
                method.addEventListener('click', function() {
                    selectPaymentMethod(this.dataset.method);
                });
            });

            // 自动续费复选框
            const autoRenewalCheckbox = document.getElementById('autoRenewal');
            if (autoRenewalCheckbox) {
                autoRenewalCheckbox.addEventListener('change', function() {
                    if (this.checked) {
                        if (confirm('开启自动续费后，将在订阅到期前3天自动扣费并续订。确定要开启吗？')) {
                            this.checked = true;
                        } else {
                            this.checked = false;
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
