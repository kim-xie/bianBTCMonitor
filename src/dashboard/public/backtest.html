<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC Oracle // 指数全自动规则平仓回测实验室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 前端基础运行库 (React 18 + TailwindCSS + Lightweight-Charts) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #04070b;
      color: #f1f5f9;
      font-family: 'JetBrains Mono', 'Share Tech Mono', monospace;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #04070b;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #10b981;
    }

    .font-terminal {
      font-family: 'JetBrains Mono', 'Share Tech Mono', monospace;
    }

    .terminal-panel {
      background: #080d14;
      border: 1px solid rgba(6, 182, 212, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), inset 0 0 30px rgba(6, 182, 212, 0.02);
    }

    /* 让所有日期、时间原生选择器的图标在暗黑主题下变白且清晰可见 */
    input[type="date"],
    input[type="time"],
    input[type="datetime-local"] {
      color-scheme: dark;
    }

    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator,
    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(1) brightness(1.6);
      cursor: pointer;
      opacity: 0.85;
      padding: 2px;
    }

    input[type="date"]::-webkit-calendar-picker-indicator:hover,
    input[type="time"]::-webkit-calendar-picker-indicator:hover,
    input[type="datetime-local"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
      filter: invert(1) brightness(2) drop-shadow(0 0 4px #06b6d4);
    }

    /* 荧光特效 */
    .glow-green {
      text-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }
    .glow-red {
      text-shadow: 0 0 10px rgba(244, 63, 94, 0.6);
    }
    .glow-cyan {
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.6);
    }
    .glow-amber {
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
    }

    /* 范围滑动条自定义 */
    input[type=range] {
      accent-color: #06b6d4;
    }

    .num-tabular {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // 工具函数：格式化金额
    const formatU = (num, digits = 2) => {
      if (num === null || num === undefined || isNaN(num)) return '0.00';
      return Number(num).toLocaleString('zh-CN', {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      });
    };

    // 工具函数：数字补零
    const pad = (n) => String(n).padStart(2, '0');

    // 工具函数：格式化时间戳为北京时间 YYYY-MM-DD HH:mm:ss
    const formatBeijingTime = (ts) => {
      if (!ts) return '--';
      const d = new Date(Number(ts));
      if (isNaN(d.getTime())) return '--';
      const utc = d.getTime() + d.getTimezoneOffset() * 60000;
      const bj = new Date(utc + 8 * 3600000);
      const Y = bj.getFullYear();
      const M = pad(bj.getMonth() + 1);
      const D = pad(bj.getDate());
      const h = pad(bj.getHours());
      const m = pad(bj.getMinutes());
      const s = pad(bj.getSeconds());
      return `${Y}-${M}-${D} ${h}:${m}:${s}`;
    };

    // 工具函数：获取 YYYY-MM-DD 字符串
    const toDateStr = (date) => {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    };

    // 工具函数：获取 HH:mm 字符串
    const toTimeStr = (date) => {
      return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
    };

    // 周期毫秒数映射
    const INTERVAL_TO_MS = {
      '1m': 60 * 1000,
      '3m': 3 * 60 * 1000,
      '5m': 5 * 60 * 1000,
      '15m': 15 * 60 * 1000,
      '30m': 30 * 60 * 1000,
      '1h': 3600 * 1000,
      '4h': 4 * 3600 * 1000,
      '1d': 24 * 3600 * 1000
    };

    // ==============================================================
    // 交互式可视化日历范围选择器弹窗 (Calendar Range Picker Modal)
    // ==============================================================
    const CalendarModal = ({ isOpen, onClose, initialStartDate, initialEndDate, onApply }) => {
      const [viewDate, setViewDate] = useState(() => new Date());
      const [selStart, setSelStart] = useState(initialStartDate);
      const [selEnd, setSelEnd] = useState(initialEndDate);
      const [tempStartTime, setTempStartTime] = useState('00:00');
      const [tempEndTime, setTempEndTime] = useState('23:59');

      useEffect(() => {
        if (isOpen) {
          setSelStart(initialStartDate);
          setSelEnd(initialEndDate);
          if (initialStartDate) {
            const [y, m] = initialStartDate.split('-').map(Number);
            setViewDate(new Date(y, m - 1, 1));
          }
        }
      }, [isOpen, initialStartDate, initialEndDate]);

      if (!isOpen) return null;

      const year = viewDate.getFullYear();
      const month = viewDate.getMonth(); // 0-indexed

      // 计算当月日历网格
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysCount = lastDay.getDate();
      // 星期几 (0: 周日, 1: 周一, ... 6: 周六)，转为周一为第0天
      let startDayOfWeek = firstDay.getDay() - 1;
      if (startDayOfWeek === -1) startDayOfWeek = 6;

      const calendarDays = [];
      for (let i = 0; i < startDayOfWeek; i++) {
        calendarDays.push(null);
      }
      for (let d = 1; d <= daysCount; d++) {
        calendarDays.push(`${year}-${pad(month + 1)}-${pad(d)}`);
      }

      const handleDayClick = (dateStr) => {
        if (!selStart || (selStart && selEnd)) {
          setSelStart(dateStr);
          setSelEnd('');
        } else {
          if (dateStr < selStart) {
            setSelEnd(selStart);
            setSelStart(dateStr);
          } else {
            setSelEnd(dateStr);
          }
        }
      };

      const prevMonth = () => setViewDate(new Date(year, month - 1, 1));
      const nextMonth = () => setViewDate(new Date(year, month + 1, 1));

      // 快捷预设设置
      const applyPreset = (type) => {
        const now = new Date();
        const todayStr = toDateStr(now);

        if (type === 'today') {
          setSelStart(todayStr);
          setSelEnd(todayStr);
          setTempStartTime('00:00');
          setTempEndTime(toTimeStr(now));
        } else if (type === 'yesterday') {
          const yest = new Date(now.getTime() - 86400000);
          const yestStr = toDateStr(yest);
          setSelStart(yestStr);
          setSelEnd(yestStr);
          setTempStartTime('00:00');
          setTempEndTime('23:59');
        } else if (type === '3d') {
          const s = new Date(now.getTime() - 3 * 86400000);
          setSelStart(toDateStr(s));
          setSelEnd(todayStr);
          setTempStartTime('00:00');
          setTempEndTime(toTimeStr(now));
        } else if (type === '7d') {
          const s = new Date(now.getTime() - 7 * 86400000);
          setSelStart(toDateStr(s));
          setSelEnd(todayStr);
          setTempStartTime('00:00');
          setTempEndTime(toTimeStr(now));
        } else if (type === '15d') {
          const s = new Date(now.getTime() - 15 * 86400000);
          setSelStart(toDateStr(s));
          setSelEnd(todayStr);
          setTempStartTime('00:00');
          setTempEndTime(toTimeStr(now));
        } else if (type === '30d') {
          const s = new Date(now.getTime() - 30 * 86400000);
          setSelStart(toDateStr(s));
          setSelEnd(todayStr);
          setTempStartTime('00:00');
          setTempEndTime(toTimeStr(now));
        } else if (type === 'thisMonth') {
          const s = new Date(year, month, 1);
          setSelStart(toDateStr(s));
          setSelEnd(todayStr);
          setTempStartTime('00:00');
          setTempEndTime(toTimeStr(now));
        } else if (type === 'lastMonth') {
          const s = new Date(year, month - 1, 1);
          const e = new Date(year, month, 0);
          setSelStart(toDateStr(s));
          setSelEnd(toDateStr(e));
          setTempStartTime('00:00');
          setTempEndTime('23:59');
          setViewDate(s);
        }
      };

      const handleConfirm = () => {
        if (!selStart) {
          alert('请先选择开始日期');
          return;
        }
        const finalEnd = selEnd || selStart;
        onApply(selStart, tempStartTime, finalEnd, tempEndTime);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 font-terminal">
          <div className="bg-[#080d14] border border-cyan-500/50 rounded-xl shadow-2xl max-w-lg w-full p-4 relative text-slate-100">
            {/* 顶栏 */}
            <div className="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
              <div className="flex items-center gap-2">
                <i className="fa-solid fa-calendar-days text-cyan-400"></i>
                <h3 className="font-bold text-sm text-cyan-300 uppercase tracking-wider">
                  自定义选择回测时间区间 (CALENDAR PICKER)
                </h3>
              </div>
              <button
                onClick={onClose}
                className="text-slate-400 hover:text-white px-2 py-1 rounded hover:bg-slate-800 text-sm"
              >
                ✕
              </button>
            </div>

            {/* 快捷选择标签 */}
            <div className="flex items-center gap-1.5 flex-wrap mb-3 text-xs">
              <span className="text-slate-500 text-[11px]">快捷范围:</span>
              {[
                { id: 'today', label: '今天' },
                { id: 'yesterday', label: '昨天' },
                { id: '3d', label: '近3天' },
                { id: '7d', label: '近7天' },
                { id: '15d', label: '近15天' },
                { id: '30d', label: '近30天' },
                { id: 'thisMonth', label: '本月' },
                { id: 'lastMonth', label: '上个月' }
              ].map((p) => (
                <button
                  key={p.id}
                  onClick={() => applyPreset(p.id)}
                  className="px-2 py-0.5 rounded bg-slate-900 hover:bg-slate-800 text-cyan-300 border border-slate-800 text-[11px] font-mono transition-all"
                >
                  {p.label}
                </button>
              ))}
            </div>

            {/* 日历导航 */}
            <div className="flex items-center justify-between px-2 py-1.5 bg-slate-950 rounded border border-slate-800 mb-2 font-mono text-xs font-bold">
              <button
                onClick={prevMonth}
                className="px-2 py-1 rounded bg-slate-900 hover:bg-slate-800 text-cyan-400 border border-slate-800"
              >
                ◀ 上个月
              </button>
              <span className="text-slate-200">
                {year} 年 {pad(month + 1)} 月
              </span>
              <button
                onClick={nextMonth}
                className="px-2 py-1 rounded bg-slate-900 hover:bg-slate-800 text-cyan-400 border border-slate-800"
              >
                下个月 ▶
              </button>
            </div>

            {/* 日历星期表头 */}
            <div className="grid grid-cols-7 gap-1 text-center text-[11px] text-slate-500 mb-1 font-mono font-bold">
              <span>一</span>
              <span>二</span>
              <span>三</span>
              <span>四</span>
              <span>五</span>
              <span className="text-amber-500">六</span>
              <span className="text-rose-500">日</span>
            </div>

            {/* 日历网格 */}
            <div className="grid grid-cols-7 gap-1 text-center text-xs font-mono mb-3">
              {calendarDays.map((dStr, idx) => {
                if (!dStr) {
                  return <div key={`empty-${idx}`} className="h-8"></div>;
                }
                const dayNum = parseInt(dStr.split('-')[2], 10);
                const isStart = dStr === selStart;
                const isEnd = dStr === selEnd;
                const inRange = selStart && selEnd && dStr > selStart && dStr < selEnd;

                let cls = 'bg-slate-900/60 text-slate-300 hover:bg-slate-800 hover:text-white border-transparent';
                if (isStart) {
                  cls = 'bg-emerald-500 text-slate-950 font-bold border-emerald-400 shadow-md shadow-emerald-500/30';
                } else if (isEnd) {
                  cls = 'bg-cyan-500 text-slate-950 font-bold border-cyan-400 shadow-md shadow-cyan-500/30';
                } else if (inRange) {
                  cls = 'bg-cyan-950/60 text-cyan-300 border-cyan-800/60';
                }

                return (
                  <button
                    key={dStr}
                    onClick={() => handleDayClick(dStr)}
                    className={`h-8 rounded flex items-center justify-center border transition-all ${cls}`}
                  >
                    {dayNum}
                  </button>
                );
              })}
            </div>

            {/* 时刻选择与已选显示 */}
            <div className="bg-slate-950 p-2.5 rounded border border-slate-800 mb-3 space-y-2 text-xs font-mono">
              <div className="flex items-center justify-between flex-wrap gap-2">
                <div className="flex items-center gap-1.5">
                  <span className="text-slate-400">开始时间:</span>
                  <span className="text-emerald-400 font-bold">{selStart || '--'}</span>
                  <input
                    type="time"
                    value={tempStartTime}
                    onChange={(e) => setTempStartTime(e.target.value)}
                    className="px-1.5 py-0.5 rounded bg-slate-900 border border-slate-700 text-slate-200 text-xs"
                  />
                </div>
                <div className="flex items-center gap-1.5">
                  <span className="text-slate-400">结束时间:</span>
                  <span className="text-cyan-400 font-bold">{selEnd || selStart || '--'}</span>
                  <input
                    type="time"
                    value={tempEndTime}
                    onChange={(e) => setTempEndTime(e.target.value)}
                    className="px-1.5 py-0.5 rounded bg-slate-900 border border-slate-700 text-slate-200 text-xs"
                  />
                </div>
              </div>
              <div className="text-[11px] text-slate-500">
                提示: 点击第一个日期设为开始日期，点击第二个日期设为结束日期。
              </div>
            </div>

            {/* 底部按钮 */}
            <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
              <button
                onClick={onClose}
                className="px-3 py-1.5 rounded bg-slate-900 hover:bg-slate-800 text-slate-400 border border-slate-800 text-xs"
              >
                取消
              </button>
              <button
                onClick={handleConfirm}
                className="px-4 py-1.5 rounded bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold border border-cyan-400 text-xs shadow-md shadow-cyan-900/40"
              >
                确认应用所选时间
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ==============================================================
    // 主应用组件
    // ==============================================================
    const BacktestApp = () => {
      // 1. 回测参数与自定义起止时间配置
      const [symbol, setSymbol] = useState('BTCUSDT');
      const [interval, setIntervalVal] = useState('5m');

      // 自定义开始与结束日期、时分
      const [startDate, setStartDate] = useState(() => {
        const d = new Date(Date.now() - 3 * 24 * 3600 * 1000); // 默认3天前
        return toDateStr(d);
      });
      const [startTime, setStartTime] = useState('00:00');

      const [endDate, setEndDate] = useState(() => {
        return toDateStr(new Date());
      });
      const [endTime, setEndTime] = useState(() => {
        return toTimeStr(new Date());
      });

      // 日历弹窗开关
      const [showCalendarModal, setShowCalendarModal] = useState(false);

      // 自动平仓规则配置：
      const [autoCloseMinutes, setAutoCloseMinutes] = useState(10);
      const [tradeRule, setTradeRule] = useState('event');
      const [initialCapital, setInitialCapital] = useState(1000);
      const [tradeAmount, setTradeAmount] = useState(100);

      // 可选自动止盈止损保护规则
      const [enableTpSl, setEnableTpSl] = useState(false);
      const [takeProfitPrice, setTakeProfitPrice] = useState('');
      const [stopLossPrice, setStopLossPrice] = useState('');

      // 2. 指数K线数据与状态
      const [allKlines, setAllKlines] = useState([]);
      const [dataSource, setDataSource] = useState('');
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [noticeMsg, setNoticeMsg] = useState('');
      const [isConfigCollapsed, setIsConfigCollapsed] = useState(false);

      // 3. 回放/推演引擎状态
      const [isReplayMode, setIsReplayMode] = useState(true);
      const [replayIndex, setReplayIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [playSpeed, setPlaySpeed] = useState(1);

      // 4. 当前持仓与交易记录
      const [activePosition, setActivePosition] = useState(null);
      const [trades, setTrades] = useState(() => {
        try {
          const saved = localStorage.getItem('btc_oracle_manual_backtest_trades');
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      // 5. 过滤与选中高亮
      const [tradeFilter, setTradeFilter] = useState('ALL');
      const [selectedTradeId, setSelectedTradeId] = useState(null);

      // 图表 DOM 容器引用
      const chartContainerRef = useRef(null);
      const chartWrapRef = useRef(null);
      const tradeOverlayCanvasRef = useRef(null);
      const [showTradeOverlay, setShowTradeOverlay] = useState(true);
      const drawTradeOverlayRef = useRef(null);
      const equityChartContainerRef = useRef(null);
      const chartRef = useRef(null);
      const candleSeriesRef = useRef(null);
      const ema50SeriesRef = useRef(null);
      const ema200SeriesRef = useRef(null);
      const equityChartRef = useRef(null);
      const equitySeriesRef = useRef(null);

      // 自动播放定时器
      const playTimerRef = useRef(null);

      // 当前周期毫秒数
      const curIntervalMs = useMemo(() => {
        return INTERVAL_TO_MS[interval] || 5 * 60 * 1000;
      }, [interval]);

      // 当前设置的自动平仓所需持有K线数量
      const holdBarsRequired = useMemo(() => {
        return Math.max(1, Math.round((autoCloseMinutes * 60 * 1000) / curIntervalMs));
      }, [autoCloseMinutes, curIntervalMs]);

      // 解析时间戳 (本地时间)
      const startMs = useMemo(() => {
        if (!startDate) return 0;
        const [y, m, d] = startDate.split('-').map(Number);
        const [hh, mm] = (startTime || '00:00').split(':').map(Number);
        return new Date(y, m - 1, d, hh || 0, mm || 0, 0).getTime();
      }, [startDate, startTime]);

      const endMs = useMemo(() => {
        if (!endDate) return 0;
        const [y, m, d] = endDate.split('-').map(Number);
        const [hh, mm] = (endTime || '23:59').split(':').map(Number);
        return new Date(y, m - 1, d, hh || 23, mm || 59, 59).getTime();
      }, [endDate, endTime]);

      // 计算跨度统计
      const timeSpanInfo = useMemo(() => {
        if (!startMs || !endMs || startMs >= endMs) return null;
        const diffMs = endMs - startMs;
        const totalMinutes = Math.floor(diffMs / 60000);
        const days = Math.floor(totalMinutes / 1440);
        const hours = Math.floor((totalMinutes % 1440) / 60);
        const mins = totalMinutes % 60;
        const estimatedBars = Math.floor(diffMs / curIntervalMs);
        return {
          spanText: `${days > 0 ? days + '天 ' : ''}${hours}小时 ${mins}分`,
          estimatedBars
        };
      }, [startMs, endMs, curIntervalMs]);

      // 自动保存交易记录到 localStorage
      useEffect(() => {
        try {
          localStorage.setItem('btc_oracle_manual_backtest_trades', JSON.stringify(trades));
        } catch (e) {
          console.warn('保存到localStorage失败:', e);
        }
      }, [trades]);

      // 当前可见K线列表
      const visibleKlines = useMemo(() => {
        if (!allKlines || allKlines.length === 0) return [];
        if (!isReplayMode) return allKlines;
        const count = Math.min(Math.max(replayIndex + 1, 1), allKlines.length);
        return allKlines.slice(0, count);
      }, [allKlines, isReplayMode, replayIndex]);

      // 当前K线数据
      const currentBar = useMemo(() => {
        if (visibleKlines.length === 0) return null;
        return visibleKlines[visibleKlines.length - 1];
      }, [visibleKlines]);

      // 当前指数价格
      const currentPrice = useMemo(() => {
        if (!currentBar) return 0;
        return Number(currentBar.close);
      }, [currentBar]);

      // 快捷设置预设起止时间
      const setQuickPresetHours = (hours) => {
        const end = new Date();
        const start = new Date(end.getTime() - hours * 3600 * 1000);
        setStartDate(toDateStr(start));
        setStartTime(toTimeStr(start));
        setEndDate(toDateStr(end));
        setEndTime(toTimeStr(end));
      };

      const setPresetDays = (days) => {
        const end = new Date();
        const start = new Date(end.getTime() - days * 24 * 3600 * 1000);
        setStartDate(toDateStr(start));
        setStartTime('00:00');
        setEndDate(toDateStr(end));
        setEndTime(toTimeStr(end));
      };

      // 从后端加载指数K线数据 (支持传入指定的时间戳覆盖或使用当前状态)
      const fetchIndexData = async (overrideStartMs, overrideEndMs) => {
        setLoading(true);
        setErrorMsg('');
        try {
          const sMs = overrideStartMs !== undefined ? overrideStartMs : startMs;
          const eMs = overrideEndMs !== undefined ? overrideEndMs : endMs;

          if (!sMs || !eMs || sMs >= eMs) {
            setErrorMsg('请选择有效的起止时间区间（开始时间需早于结束时间）');
            setLoading(false);
            return;
          }

          const res = await fetch(`/api/backtest/index-klines?symbol=${symbol}&interval=${interval}&start=${sMs}&end=${eMs}&limit=2500`);
          const data = await res.json();

          if (!data.success || !data.klines || data.klines.length === 0) {
            setErrorMsg(data.error || '未获取到对应时间段的指数数据');
            setLoading(false);
            return;
          }

          setAllKlines(data.klines);
          setDataSource(data.source || 'index');
          const initialReplay = Math.min(Math.max(20, Math.floor(data.klines.length * 0.1)), data.klines.length - 1);
          setReplayIndex(initialReplay);
          setIsPlaying(false);
          setNoticeMsg(`成功载入 ${data.klines.length} 根币安标的指数K线数据！`);
          setTimeout(() => setNoticeMsg(''), 4000);
        } catch (err) {
          console.error('加载指数数据失败:', err);
          setErrorMsg('网络请求异常，无法加载指数数据: ' + (err.message || err));
        } finally {
          setLoading(false);
        }
      };

      // 初始加载一次
      useEffect(() => {
        fetchIndexData();
      }, []);

      // 自动播放控制
      useEffect(() => {
        if (!isPlaying) {
          if (playTimerRef.current) clearInterval(playTimerRef.current);
          return;
        }

        const baseInterval = 1000 / playSpeed;
        playTimerRef.current = setInterval(() => {
          setReplayIndex((prev) => {
            if (prev >= allKlines.length - 1) {
              setIsPlaying(false);
              return prev;
            }
            return prev + 1;
          });
        }, Math.max(100, baseInterval));

        return () => {
          if (playTimerRef.current) clearInterval(playTimerRef.current);
        };
      }, [isPlaying, playSpeed, allKlines.length]);

      // 核心平仓逻辑：严格由规则自动触发平仓，不支持任何手动平仓
      const handleAutoClose = useCallback((pos, exitPriceVal, exitTimeVal, reason) => {
        const exitPrice = Number(exitPriceVal);
        const exitTime = Number(exitTimeVal);
        const priceDiff = exitPrice - pos.entryPrice;
        const pricePct = (priceDiff / pos.entryPrice) * 100;

        let profitLoss = 0;
        let isCorrect = false;

        if (tradeRule === 'event') {
          const isWin = pos.type === 'LONG' ? (exitPrice > pos.entryPrice) : (exitPrice < pos.entryPrice);
          isCorrect = isWin;
          if (isWin) {
            profitLoss = pos.amount * 0.8;
          } else {
            profitLoss = -pos.amount;
          }
        } else {
          const returnRate = pos.type === 'LONG' ? (priceDiff / pos.entryPrice) : (-priceDiff / pos.entryPrice);
          profitLoss = pos.amount * returnRate;
          isCorrect = profitLoss > 0;
        }

        const closedTrade = {
          id: pos.id,
          type: pos.type,
          entryIndex: pos.entryIndex,
          exitIndex: replayIndex,
          entryTime: pos.entryTime,
          exitTime: exitTime,
          entryPrice: pos.entryPrice,
          exitPrice: exitPrice,
          amount: pos.amount,
          profitLoss: Math.round(profitLoss * 100) / 100,
          returnRate: Math.round((profitLoss / pos.amount) * 10000) / 100,
          pricePct: Math.round(pricePct * 100) / 100,
          barsHeld: Math.max(1, replayIndex - pos.entryIndex),
          reason: reason,
          isCorrect: isCorrect,
          settledAt: Date.now()
        };

        setTrades((prev) => [closedTrade, ...prev]);
        setActivePosition(null);

        setNoticeMsg(`【规则自动平仓完成】${reason}，平仓价: $${formatU(exitPrice, 1)}，盈亏: ${profitLoss >= 0 ? '+' : ''}${formatU(profitLoss)}U`);
        setTimeout(() => setNoticeMsg(''), 5000);

        if (isCorrect && typeof confetti === 'function') {
          confetti({
            particleCount: 50,
            spread: 60,
            origin: { y: 0.8 }
          });
        }
      }, [tradeRule, replayIndex]);

      // 自动检查持仓：单步推演中，达到规则要求的时间或触及止盈止损时自动平仓
      useEffect(() => {
        if (!activePosition || !currentBar) return;

        const pos = activePosition;
        const curBarTime = Number(currentBar.openTime);
        const curClose = Number(currentBar.close);
        const curHigh = Number(currentBar.high);
        const curLow = Number(currentBar.low);

        if (pos.takeProfit && pos.takeProfit > 0) {
          const hitTP = pos.type === 'LONG' ? curHigh >= pos.takeProfit : curLow <= pos.takeProfit;
          if (hitTP) {
            handleAutoClose(pos, pos.takeProfit, curBarTime, '止盈价自动触发平仓 (TAKE_PROFIT_AUTO)');
            return;
          }
        }
        if (pos.stopLoss && pos.stopLoss > 0) {
          const hitSL = pos.type === 'LONG' ? curLow <= pos.stopLoss : curHigh >= pos.stopLoss;
          if (hitSL) {
            handleAutoClose(pos, pos.stopLoss, curBarTime, '止损价自动触发平仓 (STOP_LOSS_AUTO)');
            return;
          }
        }

        const isBarsExpired = replayIndex >= pos.targetExitIndex;
        const isTimeExpired = curBarTime >= pos.expectedExitTime;

        if (isBarsExpired || isTimeExpired) {
          handleAutoClose(
            pos,
            curClose,
            curBarTime,
            `规则到期自动平仓 (满${pos.autoCloseMinutes}分钟 / ${pos.holdBars}根K线)`
          );
        }
      }, [replayIndex, activePosition, currentBar, handleAutoClose]);

      // 执行开仓
      const executeOpenPosition = (type) => {
        if (!currentBar) {
          alert('请先加载指数K线数据');
          return;
        }

        if (activePosition) {
          const remainingBars = Math.max(1, activePosition.targetExitIndex - replayIndex);
          alert(
            `【交易已被规则锁定】\n\n当前已有持仓正在按规则运行中（剩余 ${remainingBars} 根 K 线自动平仓结算）。\n` +
            `本系统严格执行【按规则自动平仓，不支持手动平仓】的纪律要求，请推进 K 线至到期自动平仓后再开新仓。`
          );
          return;
        }

        const price = Number(currentBar.close);
        const entryTime = Number(currentBar.openTime);
        const holdBars = holdBarsRequired;
        const targetExitIndex = replayIndex + holdBars;
        const expectedExitTime = entryTime + autoCloseMinutes * 60 * 1000;

        if (!isReplayMode) {
          const exitIdx = Math.min(targetExitIndex, allKlines.length - 1);
          const exitBar = allKlines[exitIdx];
          const exitClose = Number(exitBar.close);
          const exitTime = Number(exitBar.openTime);

          const tempPos = {
            id: 'pos_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            type,
            entryIndex: replayIndex,
            targetExitIndex: exitIdx,
            entryPrice: price,
            entryTime: entryTime,
            amount: Number(tradeAmount) || 100,
            autoCloseMinutes: autoCloseMinutes,
            holdBars: holdBars
          };

          handleAutoClose(
            tempPos,
            exitClose,
            exitTime,
            `全景规则自动平仓 (满${autoCloseMinutes}分钟 / ${holdBars}根K线)`
          );
          return;
        }

        const newPos = {
          id: 'pos_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
          type,
          entryIndex: replayIndex,
          targetExitIndex: targetExitIndex,
          entryPrice: price,
          entryTime: entryTime,
          expectedExitTime: expectedExitTime,
          expectedExitTimeStr: formatBeijingTime(expectedExitTime),
          amount: Number(tradeAmount) || 100,
          autoCloseMinutes: autoCloseMinutes,
          holdBars: holdBars,
          takeProfit: (enableTpSl && takeProfitPrice) ? Number(takeProfitPrice) : null,
          stopLoss: (enableTpSl && stopLossPrice) ? Number(stopLossPrice) : null
        };

        setActivePosition(newPos);
        setNoticeMsg(`【已按规则开仓】方向: ${type === 'LONG' ? '做多' : '做空'}，价格: $${formatU(price, 1)}。系统将在持满 ${autoCloseMinutes} 分钟(${holdBars}根K线)后自动平仓结算。`);
        setTimeout(() => setNoticeMsg(''), 5000);
      };

      // 快捷键支持 (方便键盘单手高效推演与交易: 空格=播放/暂停, →=单步+1, ←=后退-1, B=开多, S=开空)
      const executeOpenPositionRef = useRef(executeOpenPosition);
      executeOpenPositionRef.current = executeOpenPosition;

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;

          if (e.code === 'Space') {
            e.preventDefault();
            setIsPlaying((prev) => !prev);
          } else if (e.code === 'ArrowRight') {
            e.preventDefault();
            setIsPlaying(false);
            setReplayIndex((prev) => Math.min(prev + 1, allKlines.length - 1));
          } else if (e.code === 'ArrowLeft') {
            e.preventDefault();
            setIsPlaying(false);
            setReplayIndex((prev) => Math.max(0, prev - 1));
          } else if (e.key === 'b' || e.key === 'B' || e.code === 'ArrowUp') {
            e.preventDefault();
            executeOpenPositionRef.current('LONG');
          } else if (e.key === 's' || e.key === 'S' || e.code === 'ArrowDown') {
            e.preventDefault();
            executeOpenPositionRef.current('SHORT');
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [allKlines.length]);

      // 清空回测数据
      const resetBacktest = () => {
        if (confirm('确定要清空当前所有回测交易记录并重置吗？')) {
          setTrades([]);
          setActivePosition(null);
          localStorage.removeItem('btc_oracle_manual_backtest_trades');
        }
      };

      // 导出 CSV 交易明细
      const exportCSV = () => {
        if (trades.length === 0) {
          alert('暂无交易记录可供导出');
          return;
        }

        const headers = [
          '交易序号',
          '方向',
          '开仓时间(北京)',
          '平仓时间(北京)',
          '开仓指数价',
          '平仓指数价',
          '本金(USDT)',
          '盈亏(USDT)',
          '收益率(%)',
          '持仓K线数',
          '自动平仓规则与原因'
        ];

        const rows = trades.map((t, idx) => [
          trades.length - idx,
          t.type === 'LONG' ? '做多' : '做空',
          formatBeijingTime(t.entryTime),
          formatBeijingTime(t.exitTime),
          t.entryPrice,
          t.exitPrice,
          t.amount,
          t.profitLoss,
          t.returnRate + '%',
          t.barsHeld,
          t.reason
        ]);

        const csvContent = '\uFEFF' + [headers, ...rows].map(e => e.join(',')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `BTC_Index_Auto_Backtest_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      // 数据统计计算
      const stats = useMemo(() => {
        const totalTrades = trades.length;
        if (totalTrades === 0) {
          return {
            totalTrades: 0,
            winTrades: 0,
            lossTrades: 0,
            winRate: 0,
            totalProfitLoss: 0,
            roi: 0,
            currentBalance: initialCapital,
            profitFactor: 0,
            avgTradePnL: 0,
            avgWin: 0,
            avgLoss: 0,
            maxWin: 0,
            maxLoss: 0,
            maxConsecutiveWins: 0,
            maxConsecutiveLosses: 0,
            maxDrawdown: 0,
            maxDrawdownPct: 0,
            longTrades: 0,
            longWinRate: 0,
            shortTrades: 0,
            shortWinRate: 0,
            equityHistory: [{ time: Date.now(), balance: initialCapital }]
          };
        }

        let winTrades = 0;
        let lossTrades = 0;
        let grossProfit = 0;
        let grossLoss = 0;
        let totalPnL = 0;
        let maxWin = 0;
        let maxLoss = 0;

        let longTrades = 0;
        let longWins = 0;
        let shortTrades = 0;
        let shortWins = 0;

        let curConsecWins = 0;
        let maxConsecWins = 0;
        let curConsecLosses = 0;
        let maxConsecLosses = 0;

        const chronTrades = [...trades].reverse();
        let runningBalance = initialCapital;
        let peakBalance = initialCapital;
        let maxDrawdown = 0;
        let maxDrawdownPct = 0;

        const equityHistory = [
          { time: (chronTrades[0]?.entryTime || Date.now()) - 300000, balance: initialCapital }
        ];

        chronTrades.forEach((t) => {
          totalPnL += t.profitLoss;
          runningBalance += t.profitLoss;
          equityHistory.push({ time: t.exitTime, balance: runningBalance });

          if (runningBalance > peakBalance) {
            peakBalance = runningBalance;
          }
          const dd = peakBalance - runningBalance;
          const ddPct = peakBalance > 0 ? (dd / peakBalance) * 100 : 0;
          if (dd > maxDrawdown) maxDrawdown = dd;
          if (ddPct > maxDrawdownPct) maxDrawdownPct = ddPct;

          if (t.profitLoss > 0) {
            winTrades++;
            grossProfit += t.profitLoss;
            if (t.profitLoss > maxWin) maxWin = t.profitLoss;

            curConsecWins++;
            curConsecLosses = 0;
            if (curConsecWins > maxConsecWins) maxConsecWins = curConsecWins;
          } else {
            lossTrades++;
            grossLoss += Math.abs(t.profitLoss);
            if (t.profitLoss < maxLoss) maxLoss = t.profitLoss;

            curConsecLosses++;
            curConsecWins = 0;
            if (curConsecLosses > maxConsecLosses) maxConsecLosses = curConsecLosses;
          }

          if (t.type === 'LONG') {
            longTrades++;
            if (t.profitLoss > 0) longWins++;
          } else {
            shortTrades++;
            if (t.profitLoss > 0) shortWins++;
          }
        });

        const winRate = (winTrades / totalTrades) * 100;
        const roi = (totalPnL / initialCapital) * 100;
        const profitFactor = grossLoss > 0 ? grossProfit / grossLoss : (grossProfit > 0 ? 99.9 : 0);
        const avgTradePnL = totalPnL / totalTrades;
        const avgWin = winTrades > 0 ? grossProfit / winTrades : 0;
        const avgLoss = lossTrades > 0 ? grossLoss / lossTrades : 0;

        return {
          totalTrades,
          winTrades,
          lossTrades,
          winRate: Math.round(winRate * 10) / 10,
          totalProfitLoss: Math.round(totalPnL * 100) / 100,
          roi: Math.round(roi * 10) / 10,
          currentBalance: Math.round(runningBalance * 100) / 100,
          profitFactor: Math.round(profitFactor * 100) / 100,
          avgTradePnL: Math.round(avgTradePnL * 100) / 100,
          avgWin: Math.round(avgWin * 100) / 100,
          avgLoss: Math.round(avgLoss * 100) / 100,
          maxWin: Math.round(maxWin * 100) / 100,
          maxLoss: Math.round(maxLoss * 100) / 100,
          maxConsecutiveWins: maxConsecWins,
          maxConsecutiveLosses: maxConsecLosses,
          maxDrawdown: Math.round(maxDrawdown * 100) / 100,
          maxDrawdownPct: Math.round(maxDrawdownPct * 10) / 10,
          longTrades,
          longWinRate: longTrades > 0 ? Math.round((longWins / longTrades) * 1000) / 10 : 0,
          shortTrades,
          shortWinRate: shortTrades > 0 ? Math.round((shortWins / shortTrades) * 1000) / 10 : 0,
          equityHistory
        };
      }, [trades, initialCapital]);

      // 倒V (Inverted V) 开平仓标记画布叠加层 (与监控面板保持一致：开仓价/平仓价细虚线连成倒V，顶点标注 W/L 及盈亏)
      const drawTradeOverlay = useCallback(() => {
        const canvas = tradeOverlayCanvasRef.current;
        const wrap = chartWrapRef.current;
        const chart = chartRef.current;
        const series = candleSeriesRef.current;
        if (!canvas || !wrap || !chart || !series) return;

        const width = wrap.clientWidth || 0;
        const height = wrap.clientHeight || 0;
        if (width <= 0 || height <= 0) return;

        const dpr = window.devicePixelRatio || 1;
        if (canvas.width !== Math.floor(width * dpr) || canvas.height !== Math.floor(height * dpr)) {
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
        }

        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);

        if (!showTradeOverlay) return;

        const candles = (visibleKlines || []).map((k) => ({
          time: Math.floor(Number(k.openTime) / 1000),
          open: Number(k.open),
          high: Number(k.high),
          low: Number(k.low),
          close: Number(k.close)
        }));
        if (candles.length === 0) return;

        const intervalSec = (curIntervalMs || 300000) / 1000;
        const findBarTime = (sec) => {
          if (!candles || candles.length === 0 || sec == null || isNaN(sec)) return null;
          const hit = candles.find((c) => c.time <= sec && sec < c.time + intervalSec);
          if (hit) return hit.time;
          const last = candles[candles.length - 1];
          if (sec >= last.time && sec < last.time + intervalSec) return last.time;
          return null;
        };

        // 计算 EMA50 供倒V顶点尖朝上/朝下判定 (相对EMA50：上方朝上尖，下方朝下尖)
        const kEma = 2 / (50 + 1);
        const ema50Map = new Map();
        if (candles.length >= 50) {
          let sum = 0;
          for (let i = 0; i < 50; i++) sum += candles[i].close;
          let prev = sum / 50;
          ema50Map.set(candles[49].time, prev);
          for (let i = 50; i < candles.length; i++) {
            prev = candles[i].close * kEma + prev * (1 - kEma);
            ema50Map.set(candles[i].time, prev);
          }
        }

        const lookupEma50 = (sec) => {
          const bar = findBarTime(sec);
          if (bar != null && ema50Map.has(bar)) return ema50Map.get(bar);
          for (let i = candles.length - 1; i >= 0; i--) {
            if (candles[i].time <= sec && ema50Map.has(candles[i].time)) return ema50Map.get(candles[i].time);
          }
          return null;
        };

        const timeScale = chart.timeScale();
        const lastCandleSec = candles[candles.length - 1].time;

        // 1. 绘制历史交易的倒V
        (trades || []).forEach((t) => {
          const entrySec = Math.floor(t.entryTime / 1000);
          const exitSec = Math.floor(t.exitTime / 1000);
          if (entrySec > lastCandleSec) return;

          const entryBar = findBarTime(entrySec);
          const exitBar = findBarTime(exitSec);
          if (entryBar == null || exitBar == null) return;

          const x1 = timeScale.timeToCoordinate(entryBar);
          const x2 = timeScale.timeToCoordinate(exitBar);
          const y1 = series.priceToCoordinate(t.entryPrice);
          const y2 = series.priceToCoordinate(t.exitPrice);
          if (x1 == null || x2 == null || y1 == null || y2 == null) return;

          let rangeHigh = Math.max(t.entryPrice, t.exitPrice);
          let rangeLow = Math.min(t.entryPrice, t.exitPrice);
          for (const c of candles) {
            if (c.time + intervalSec <= entrySec) continue;
            if (c.time >= exitSec) break;
            if (c.high > rangeHigh) rangeHigh = c.high;
            if (c.low < rangeLow) rangeLow = c.low;
          }

          const midSec = Math.floor((entrySec + exitSec) / 2);
          const midPrice = (t.entryPrice + t.exitPrice) / 2;
          const emaVal = lookupEma50(midSec);
          const peakDown = emaVal != null ? midPrice < emaVal : (t.type === 'SHORT');
          const peakBase = peakDown ? rangeLow : rangeHigh;
          const peakOffset = Math.max(peakBase * 0.0018, Math.abs(t.exitPrice - t.entryPrice) * 0.45, 12);
          const peakPrice = peakDown ? peakBase - peakOffset : peakBase + peakOffset;
          const yPeak = series.priceToCoordinate(peakPrice);
          if (yPeak == null) return;

          const xMid = (x1 + x2) / 2;
          const isWin = t.profitLoss >= 0;
          const stroke = isWin ? 'rgba(16, 185, 129, 0.9)' : 'rgba(244, 63, 94, 0.9)';
          const fill = isWin ? '#10b981' : '#f43f5e';

          ctx.save();
          // 细虚线倒V
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 3]);
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(xMid, yPeak);
          ctx.lineTo(x2, y2);
          ctx.stroke();

          // 两端点小实心圆点
          ctx.setLineDash([]);
          ctx.fillStyle = fill;
          ctx.beginPath();
          ctx.arc(x1, y1, 2.5, 0, Math.PI * 2);
          ctx.arc(x2, y2, 2.5, 0, Math.PI * 2);
          ctx.fill();

          // 顶点小实心圆点
          ctx.beginPath();
          ctx.arc(xMid, yPeak, 3.5, 0, Math.PI * 2);
          ctx.fill();

          // 顶点标注 W / L (如监控面板)
          const label = isWin ? 'W' : 'L';
          const labelY = peakDown ? yPeak + 5 : yPeak - 5;
          ctx.font = '900 13px JetBrains Mono, monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = peakDown ? 'top' : 'bottom';
          ctx.lineWidth = 3;
          ctx.strokeStyle = 'rgba(5, 8, 12, 0.9)';
          ctx.strokeText(label, xMid, labelY);
          ctx.fillStyle = fill;
          ctx.fillText(label, xMid, labelY);

          // 顶点下方/上方小字标注盈亏 (+80U / -100U)
          const pnlText = `${t.profitLoss >= 0 ? '+' : ''}${formatU(t.profitLoss)}U`;
          const pnlY = peakDown ? labelY + 13 : labelY - 13;
          ctx.font = 'bold 9px JetBrains Mono, monospace';
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = 'rgba(5, 8, 12, 0.9)';
          ctx.strokeText(pnlText, xMid, pnlY);
          ctx.fillStyle = isWin ? '#34d399' : '#fb7185';
          ctx.fillText(pnlText, xMid, pnlY);

          ctx.restore();
        });

        // 2. 绘制当前持仓中的标引 (青色细虚线延伸至最新当前K线)
        if (activePosition) {
          const entrySec = Math.floor(activePosition.entryTime / 1000);
          const entryBar = findBarTime(entrySec);
          const curBar = candles[candles.length - 1];
          if (entryBar != null && curBar) {
            const x1 = timeScale.timeToCoordinate(entryBar);
            const xCur = timeScale.timeToCoordinate(curBar.time);
            const y1 = series.priceToCoordinate(activePosition.entryPrice);
            if (x1 != null && xCur != null && y1 != null) {
              ctx.save();
              ctx.strokeStyle = '#06b6d4';
              ctx.lineWidth = 1.5;
              ctx.setLineDash([5, 4]);
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(xCur, y1);
              ctx.stroke();

              ctx.setLineDash([]);
              ctx.fillStyle = '#06b6d4';
              ctx.beginPath();

              ctx.textAlign = 'left';
              ctx.textBaseline = 'bottom';
              ctx.lineWidth = 3;
              ctx.strokeStyle = 'rgba(5, 8, 12, 0.9)';
              ctx.strokeText(posLabel, x1 + 6, y1 - 4);
              ctx.fillStyle = '#22d3ee';
              ctx.fillText(posLabel, x1 + 6, y1 - 4);
              ctx.restore();
            }
          }

            time: Math.floor(Number(k.openTime) / 1000),
            open: Number(k.open),
            high: Number(k.high),
            low: Number(k.low),
            close: Number(k.close)
          }));

          candleSeriesRef.current.setData(chartCandles);

          const calculateEMA = (period) => {
            if (chartCandles.length < period) return [];
            const k = 2 / (period + 1);
            let sum = 0;
            for (let i = 0; i < period; i++) sum += chartCandles[i].close;
            let prev = sum / period;
            const res = [{ time: chartCandles[period - 1].time, value: prev }];
            for (let i = period; i < chartCandles.length; i++) {
              prev = chartCandles[i].close * k + prev * (1 - k);
              res.push({ time: chartCandles[i].time, value: prev });
            }
            return res;
          };

          ema50SeriesRef.current.setData(calculateEMA(50));
          ema200SeriesRef.current.setData(calculateEMA(200));

              {/* 卡片 5: 均赢 vs 均亏 */}
              <div className="p-3 rounded-lg bg-slate-950/80 border border-slate-800 font-mono">
                <div className="text-[11px] text-slate-400 mb-1">平均盈利 / 亏损</div>
                <div className="text-sm font-bold text-slate-200 num-tabular">
                  <span className="text-emerald-400">+${formatU(stats.avgWin, 1)}</span>
                  <span className="text-slate-600 mx-1">/</span>
                  <span className="text-rose-400">-${formatU(stats.avgLoss, 1)}</span>
                </div>
                <div className="text-[10px] text-slate-500 mt-1">
                  连胜: {stats.maxConsecutiveWins} | 连亏: {stats.maxConsecutiveLosses}
                </div>
              </div>

              {/* 卡片 6: 最大回撤 */}
              <div className="p-3 rounded-lg bg-slate-950/80 border border-slate-800 font-mono">
                <div className="text-[11px] text-slate-400 mb-1">最大回撤 (Max DD)</div>
                <div className="text-lg sm:text-xl font-bold text-rose-400 num-tabular">
                  -{stats.maxDrawdownPct}%
                </div>
                <div className="text-[10px] text-slate-500 mt-1">金额: -${formatU(stats.maxDrawdown)}</div>
              </div>
            </div>

            {/* 多空胜率分布与资金净值曲线走势 */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
              {/* 多空分解比例条 */}
              <div className="p-3 rounded-lg bg-slate-950/80 border border-slate-800 font-mono flex flex-col justify-between">
                <div>
                  <div className="text-xs font-bold text-slate-300 mb-2">多空方向策略表现对比</div>
                  <div className="space-y-3">
                    <div>
                      <div className="flex justify-between text-xs mb-1">
                        <span className="text-emerald-400">多单胜率 ({stats.longTrades}笔)</span>
                        <span className="font-bold text-emerald-300">{stats.longWinRate}%</span>
                      </div>
                      <div className="w-full h-2 rounded bg-slate-900 overflow-hidden">
                        <div
                          className="h-full bg-emerald-500 transition-all duration-300"
                          style={{ width: `${Math.min(100, stats.longWinRate)}%` }}
                        ></div>
                      </div>
                    </div>

                    <div>
                      <div className="flex justify-between text-xs mb-1">
                        <span className="text-rose-400">空单胜率 ({stats.shortTrades}笔)</span>
                        <span className="font-bold text-rose-300">{stats.shortWinRate}%</span>
                      </div>
                      <div className="w-full h-2 rounded bg-slate-900 overflow-hidden">
                        <div
                          className="h-full bg-rose-500 transition-all duration-300"
                          style={{ width: `${Math.min(100, stats.shortWinRate)}%` }}
                        ></div>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="text-[11px] text-slate-500 pt-3 border-t border-slate-900 mt-3">
                  最大单笔收益: <span className="text-emerald-400">+${formatU(stats.maxWin)}</span> | 最大单笔亏损: <span className="text-rose-400">${formatU(stats.maxLoss)}</span>
                </div>
              </div>

              {/* 资金净值走势折线图 */}
              <div className="lg:col-span-2 p-3 rounded-lg bg-slate-950/80 border border-slate-800 font-mono">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-bold text-slate-300">
                    资金净值走势曲线 (EQUITY CURVE)
                  </span>
                  <span className="text-[11px] text-slate-500">
                    基准本金: ${formatU(initialCapital)}
                  </span>
                </div>
                <div
                  ref={equityChartContainerRef}
                  className="w-full rounded bg-[#05080c] relative"
                  style={{ minHeight: '200px' }}
                ></div>
              </div>
            </div>
          </section>

          {/* 6. 回测交易明细流水表 */}
          <section className="terminal-panel p-4 rounded-xl border border-cyan-500/25">
            <div className="flex items-center justify-between pb-3 mb-3 border-b border-slate-800 flex-wrap gap-2">
              <div className="flex items-center gap-2">
                <i className="fa-solid fa-list-check text-cyan-400 text-sm"></i>
                <span className="text-xs font-bold uppercase tracking-wider text-cyan-300">
                  05_TRADE_HISTORY // 回测交易流水明细 (全自动平仓)
                </span>
                <span className="text-xs text-slate-500 font-mono">({filteredTrades.length} 条记录)</span>
              </div>

              {/* 筛选标签 */}
              <div className="flex items-center gap-1 text-xs font-mono">
                {[
                  { id: 'ALL', label: '全部' },
                  { id: 'LONG', label: '仅看多单' },
                  { id: 'SHORT', label: '仅看空单' },
                  { id: 'WIN', label: '盈利单' },
                  { id: 'LOSS', label: '亏损单' }
                ].map((f) => (
                  <button
                    key={f.id}
                    onClick={() => setTradeFilter(f.id)}
                    className={`px-2.5 py-1 rounded transition-all ${
                      tradeFilter === f.id
                        ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500 font-bold'
                        : 'bg-slate-900 text-slate-400 hover:text-slate-200 border border-transparent'
                    }`}
                  >
                    {f.label}
                  </button>
                ))}
              </div>
            </div>

            {/* 表格 */}
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs font-mono border-collapse">
                <thead>
                  <tr className="border-b border-slate-800 text-slate-400 bg-slate-950/60">
                    <th className="p-2.5">#</th>
                    <th className="p-2.5">方向</th>
                    <th className="p-2.5">开仓时间</th>
                    <th className="p-2.5">平仓时间</th>
                    <th className="p-2.5 text-right">开仓指数价</th>
                    <th className="p-2.5 text-right">平仓指数价</th>
                    <th className="p-2.5 text-right">投入本金</th>
                    <th className="p-2.5 text-right">净盈亏</th>
                    <th className="p-2.5 text-right">收益率</th>
                    <th className="p-2.5 text-center">持仓K线</th>
                    <th className="p-2.5">自动平仓规则与原因</th>
                    <th className="p-2.5 text-center">操作</th>
                  </tr>
                </thead>
                <tbody>
                  {filteredTrades.length === 0 ? (
                    <tr>
                      <td colSpan="12" className="p-8 text-center text-slate-500">
                        -- 暂无匹配的回测交易记录 --
                      </td>
                    </tr>
                  ) : (
                    filteredTrades.map((t, idx) => {
                      const isWin = t.profitLoss > 0;
                      const isSelected = selectedTradeId === t.id;

                      return (
                        <tr
                          key={t.id}
                          className={`border-b border-slate-900 hover:bg-slate-900/50 transition-all ${
                            isSelected ? 'bg-cyan-950/40 border-l-2 border-l-cyan-400' : ''
                          }`}
                        >
                          <td className="p-2.5 text-slate-500">{trades.length - idx}</td>
                          <td className="p-2.5 font-bold">
                            {t.type === 'LONG' ? (
                              <span className="text-emerald-400 flex items-center gap-1">
                                <span>▲</span> 做多
                              </span>
                            ) : (
                              <span className="text-rose-400 flex items-center gap-1">
                                <span>▼</span> 做空
                              </span>
                            )}
                          </td>
                          <td className="p-2.5 text-slate-300">{formatBeijingTime(t.entryTime)}</td>
                          <td className="p-2.5 text-slate-300">{formatBeijingTime(t.exitTime)}</td>
                          <td className="p-2.5 text-right font-bold text-slate-200">
                            ${formatU(t.entryPrice, 1)}
                          </td>
                          <td className="p-2.5 text-right font-bold text-slate-200">
                            ${formatU(t.exitPrice, 1)}
                          </td>
                          <td className="p-2.5 text-right text-slate-300">${formatU(t.amount)}</td>
                          <td
                            className={`p-2.5 text-right font-bold num-tabular ${
                              isWin ? 'text-emerald-400' : 'text-rose-400'
                            }`}
                          >
                            {isWin ? '+' : ''}${formatU(t.profitLoss)}
                          </td>
                          <td
                            className={`p-2.5 text-right font-bold num-tabular ${
                              isWin ? 'text-emerald-400' : 'text-rose-400'
                            }`}
                          >
                            {isWin ? '+' : ''}{t.returnRate}%
                          </td>
                          <td className="p-2.5 text-center text-slate-400">{t.barsHeld} 根</td>
                          <td className="p-2.5 text-amber-300/90 text-[11px] font-mono flex items-center gap-1">
                            <i className="fa-solid fa-robot text-cyan-400 text-[10px]"></i>
                            <span>{t.reason}</span>
                          </td>
                          <td className="p-2.5 text-center">
                            <div className="flex items-center justify-center gap-2">
                              <button
                                onClick={() => focusOnTrade(t)}
                                className="text-cyan-400 hover:text-cyan-300"
                                title="在图表上聚焦定位此交易"
                              >
                                <i className="fa-solid fa-magnifying-glass"></i>
                              </button>
                              <button
                                onClick={() => deleteTrade(t.id)}
                                className="text-slate-600 hover:text-rose-400"
                                title="删除该笔交易"
                              >
                                <i className="fa-solid fa-trash"></i>
                              </button>
                            </div>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </section>

          {/* 7. 交互式日历范围选择器弹窗 */}
          <CalendarModal
            isOpen={showCalendarModal}
            onClose={() => setShowCalendarModal(false)}
            initialStartDate={startDate}
            initialEndDate={endDate}
            onApply={(sDate, sTime, eDate, eTime) => {
              setStartDate(sDate);
              setStartTime(sTime || '00:00');
              setEndDate(eDate);
              setEndTime(eTime || '23:59');

              const [sy, sm, sd] = sDate.split('-').map(Number);
              const [sh, smin] = (sTime || '00:00').split(':').map(Number);
              const sTimestamp = new Date(sy, sm - 1, sd, sh, smin, 0).getTime();

              const [ey, em, ed] = eDate.split('-').map(Number);
              const [eh, emin] = (eTime || '23:59').split(':').map(Number);
              const eTimestamp = new Date(ey, em - 1, ed, eh, emin, 59).getTime();

              fetchIndexData(sTimestamp, eTimestamp);
            }}
          />
        </div>
      );
    };

    ReactDOM.render(<BacktestApp />, document.getElementById('root'));
  </script>
</body>
</html>
