# Render Blueprint 配置
# 参考项目 tradeZella 的部署方式：使用平台注入环境变量 + 托管数据库
# 部署方式：在 Render 控制台 New -> Blueprint -> 选择本仓库
# 文档：https://render.com/docs/blueprint-spec

services:
  # BTC 交易监控面板（包含交易信号生成循环 + 前端 UI + API）
  - type: web
    name: btc-trading-dashboard
    runtime: node
    region: singapore            # 币安 API 对新加坡节点友好，避免美国节点被限制
    plan: starter                # 免费计划会休眠，交易系统建议使用 starter 及以上
    # 关键：显式安装 devDependencies（@types/* 在 devDependencies 中，tsc 编译必需）
    # 即使 NODE_ENV=production 被 Render 默认设置，--include=dev 也会强制安装 devDependencies
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /           # 访问根路径返回 index.html 即视为健康
    autoDeploy: true
    envVars:
      # 注意：不要设置 NODE_ENV=production，否则 npm install 会跳过 devDependencies（@types/*），
      # 导致 tsc 找不到类型定义而构建失败
      # MongoDB Atlas 连接串（等价于 tradeZella 使用的 Neon 托管数据库）
      # 在 Render 控制台手动填入，不要提交到代码仓库
      - key: MONGODB_URI
        sync: false
      # JWT 密钥，可让 Render 自动生成
      - key: JWT_SECRET
        generateValue: true
      # 飞书机器人 Webhook（可选，用于推送交易信号通知）
      - key: FEISHU_WEBHOOK_URL
        sync: false
      # 币安 API 代理配置（可选，若服务器可直连币安则留空）
      - key: PROXY_HOST
        sync: false
      - key: PROXY_PORT
        sync: false
      - key: PROXY_USER
        sync: false
      - key: PROXY_PASS
        sync: false
