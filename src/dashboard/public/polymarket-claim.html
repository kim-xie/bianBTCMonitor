<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket风格Claim - BTC交易监控</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .claim-container {
            text-align: center;
            color: white;
            z-index: 10;
        }

        .claim-header {
            margin-bottom: 2rem;
        }

        .claim-title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        .claim-subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .success-badge {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            padding: 1rem 2rem;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 2rem;
            animation: badgePop 0.5s ease-out;
        }

        .badge-text {
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .profit-display {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.6s ease-out;
        }

        .profit-amount {
            font-size: 4rem;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 10px rgba(76, 175, 80, 0.5);
        }

        .profit-label {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: cardFloat 0.8s ease-out;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
        }

        .btn-success {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* 背景动画元素 */
        .floating-element {
            position: absolute;
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
        }

        .floating-element:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
        .floating-element:nth-child(2) { right: 15%; top: 30%; animation-delay: 2s; }
        .floating-element:nth-child(3) { left: 5%; bottom: 25%; animation-delay: 4s; }
        .floating-element:nth-child(4) { right: 8%; bottom: 35%; animation-delay: 1s; }

        @keyframes glow {
            from { text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.5); }
            to { text-shadow: 2px 2px 20px rgba(255, 255, 255, 0.8); }
        }

        @keyframes badgePop {
            0% { transform: scale(0); }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes cardFloat {
            0% { transform: translateY(30px) rotateY(-90deg); opacity: 0; }
            100% { transform: translateY(0) rotateY(0); opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .claim-title {
                font-size: 2rem;
            }

            .profit-amount {
                font-size: 3rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }

            .action-buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- 浮动装饰元素 -->
    <div class="floating-element" style="font-size: 2rem;">✨</div>
    <div class="floating-element" style="font-size: 1.5rem;">🎉</div>
    <div class="floating-element" style="font-size: 2.5rem;">💰</div>
    <div class="floating-element" style="font-size: 1.8rem;">🚀</div>

    <div class="claim-container">
        <div class="claim-header">
            <h1 class="claim-title">🎯 Claim Success!</h1>
            <p class="claim-subtitle">您的预测获得了成功验证</p>
        </div>

        <div class="success-badge">
            <div class="badge-text">
                <i class="fas fa-trophy"></i>
                预测准确！
            </div>
        </div>

        <div class="profit-display">
            <div class="profit-amount">+¥1,250.50</div>
            <div class="profit-label">本次盈利金额</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">75%</div>
                <div class="stat-label">当前胜率</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">85%</div>
                <div class="stat-label">预测准确率</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">¥12,500</div>
                <div class="stat-label">累计收益</div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-success" onclick="goToDashboard()">
                <i class="fas fa-chart-line"></i> 继续监控
            </button>
            <button class="btn btn-primary" onclick="viewAnalysis()">
                <i class="fas fa-analytics"></i> 查看详细分析
            </button>
            <button class="btn btn-primary" onclick="shareResults()">
                <i class="fas fa-share-alt"></i> 分享成果
            </button>
        </div>
    </div>

    <script>
        // Polymarket风格的特效增强
        class PolymarketClaim {
            constructor() {
                this.init();
            }

            init() {
                this.createParticleSystem();
                this.playSuccessSequence();
                this.setupInteractiveElements();
            }

            createParticleSystem() {
                // 创建彩色粒子背景
                const colors = ['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4'];
                const particleCount = 30;

                for (let i = 0; i < particleCount; i++) {
                    setTimeout(() => {
                        this.createParticle(i, colors[i % colors.length]);
                    }, i * 100);
                }
            }

            createParticle(index, color) {
                const particle = document.createElement('div');
                particle.style.cssText = `
                    position: fixed;
                    width: ${2 + Math.random() * 4}px;
                    height: ${2 + Math.random() * 4}px;
                    background-color: ${color};
                    border-radius: 50%;
                    top: ${Math.random() * 100}%;
                    left: ${Math.random() * 100}%;
                    opacity: 0.7;
                    pointer-events: none;
                    z-index: 5;
                    animation: polymarketFloat ${3 + Math.random() * 4}s ease-in-out infinite;
                    animation-delay: ${index * 0.1}s;
                `;

                document.body.appendChild(particle);

                // 3秒后移除粒子
                setTimeout(() => {
                    if (particle.parentNode) {
                        particle.parentNode.removeChild(particle);
                    }
                }, 3000);
            }

            playSuccessSequence() {
                // 分阶段播放成功序列
                setTimeout(() => this.showTitleGlow(), 500);
                setTimeout(() => this.badgeAnimation(), 1000);
                setTimeout(() => this.profitReveal(), 1500);
                setTimeout(() => this.statsReveal(), 2000);
                setTimeout(() => this.buttonReveal(), 2500);
            }

            showTitleGlow() {
                const title = document.querySelector('.claim-title');
                title.style.animation = 'glow 1s ease-in-out';
            }

            badgeAnimation() {
                const badge = document.querySelector('.success-badge');
                badge.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    badge.style.transform = 'scale(1)';
                }, 300);
            }

            profitReveal() {
                const amount = document.querySelector('.profit-amount');
                const original = amount.textContent;
                let current = 0;
                const increment = parseInt(original.replace(/[^\d]/g, '')) / 60;

                const timer = setInterval(() => {
                    current += increment;
                    if (current >= parseInt(original.replace(/[^\d]/g, ''))) {
                        clearInterval(timer);
                        current = parseInt(original.replace(/[^\d]/g, ''));
                    }
                    amount.textContent = `+¥${current.toFixed(1)}`;
                }, 16);
            }

            statsReveal() {
                const cards = document.querySelectorAll('.stat-card');
                cards.forEach((card, index) => {
                    setTimeout(() => {
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0) rotateY(0)';
                    }, index * 200);
                });
            }

            buttonReveal() {
                const buttons = document.querySelectorAll('.btn');
                buttons.forEach((button, index) => {
                    setTimeout(() => {
                        button.style.opacity = '1';
                        button.style.transform = 'translateY(0)';
                    }, index * 150);
                });
            }

            setupInteractiveElements() {
                // 为按钮添加悬停效果
                document.querySelectorAll('.btn').forEach(button => {
                    button.addEventListener('mouseenter', () => {
                        button.style.transform = 'translateY(-3px) scale(1.05)';
                    });

                    button.addEventListener('mouseleave', () => {
                        button.style.transform = 'translateY(0) scale(1)';
                    });
                });
            }
        }

        // 全局函数
        function goToDashboard() {
            window.location.href = '/dashboard';
        }

        function viewAnalysis() {
            alert('查看详细交易分析和预测报告');
        }

        function shareResults() {
            if (navigator.share) {
                navigator.share({
                    title: 'BTC预测成功！',
                    text: '我在BTC交易中获得了成功预测，盈利+¥1,250.50',
                    url: window.location.href
                });
            } else {
                // 复制到剪贴板
                const text = '我在BTC交易中获得了成功预测，盈利+¥1,250.50';
                navigator.clipboard.writeText(text).then(() => {
                    alert('结果已复制到剪贴板！');
                });
            }
        }

        // 页面加载完成后初始化Polymarket风格效果
        document.addEventListener('DOMContentLoaded', () => {
            new PolymarketClaim();
        });

        // 导出函数供其他模块使用
        window.goToDashboard = goToDashboard;
        window.viewAnalysis = viewAnalysis;
        window.shareResults = shareResults;
    </script>
</body>
</html>
