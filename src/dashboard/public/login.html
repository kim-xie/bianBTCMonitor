<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - BTC交易监控</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .login-header {
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            width: 100%;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .form-links {
            margin-top: 1rem;
            display: flex;
            justify-content: space-between;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            border-left: 4px solid;
        }

        .alert-error {
            background: rgba(244, 67, 54, 0.2);
            border-left-color: #f44336;
            color: #f44336;
        }

        .alert-success {
            background: rgba(76, 175, 80, 0.2);
            border-left-color: #4CAF50;
            color: #4CAF50;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 1rem;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1><i class="fas fa-crown"></i> BTC交易监控</h1>
            <p>登录您的账户以管理订阅</p>
        </div>

        <div id="loginForm">
            <form onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> 用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" required>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> 密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> 登录
                </button>

                <div class="form-links">
                    <button type="button" onclick="window.location.href='/subscription'" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> 返回
                    </button>
                    <button type="button" onclick="showRegisterModal()" class="btn btn-secondary">
                        <i class="fas fa-user-plus"></i> 注册
                    </button>
                </div>
            </form>
        </div>

        <div id="registerModal" style="display: none;">
            <div class="form-group">
                <label for="reg-username"><i class="fas fa-user"></i> 用户名</label>
                <input type="text" id="reg-username" placeholder="请输入用户名" required>
            </div>

            <div class="form-group">
                <label for="reg-email"><i class="fas fa-envelope"></i> 邮箱</label>
                <input type="email" id="reg-email" placeholder="请输入邮箱" required>
            </div>

            <div class="form-group">
                <label for="reg-password"><i class="fas fa-lock"></i> 密码</label>
                <input type="password" id="reg-password" placeholder="请输入密码" required>
            </div>

            <button onclick="handleRegisterSubmit()" class="btn btn-primary">
                <i class="fas fa-user-plus"></i> 注册
            </button>

            <div style="margin-top: 1rem; text-align: center;">
                <button onclick="hideRegisterModal()" class="btn btn-secondary">
                    <i class="fas fa-times"></i> 取消
                </button>
            </div>
        </div>
    </div>

    <script>
        async function handleLoginSubmit(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // 保存token
                    localStorage.setItem('authToken', data.token);

                    // 检查是否有重定向参数
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirect = urlParams.get('redirect');

                    let targetUrl = '/subscription'; // 默认跳转到订阅页面
                    if (redirect === 'dashboard') {
                        targetUrl = '/dashboard';
                    }

                    alert(response.ok ? '登录成功！' : response.data?.message || '登录成功！');
                    window.location.href = targetUrl;
                } else {
                    showError(data.error || '登录失败');
                }
            } catch (error) {
                console.error('登录错误:', error);
                showError('网络错误，请重试');
            }
        }

        async function handleRegisterSubmit() {
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // 保存token并跳转到订阅页面
                    localStorage.setItem('authToken', data.token);
                    alert('注册成功！已为您开通免费试用');
                    window.location.href = '/subscription';
                } else {
                    showError(data.error || '注册失败');
                }
            } catch (error) {
                console.error('注册错误:', error);
                showError('网络错误，请重试');
            }
        }

        function showRegisterModal() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerModal').style.display = 'block';
        }

        function hideRegisterModal() {
            document.getElementById('registerModal').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'alert alert-error';
            errorDiv.textContent = message;

            document.querySelector('.login-container').prepend(errorDiv);

            // 3秒后自动消失
            setTimeout(() => {
                errorDiv.remove();
            }, 3000);
        }
    </script>
</body>
</html>
