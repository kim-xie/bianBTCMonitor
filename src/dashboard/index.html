<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC Radar</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .header {
      background: rgba(10, 10, 26, 0.8);
      padding: 0;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;


    const CalendarStats = ({ trades }) => {
      const [currentMonth, setCurrentMonth] = useState(new Date());

      const calculateDailyStats = () => {
        const stats = {};
        trades.forEach(trade => {
          if (trade.isCorrect !== undefined) {
            const tradeDate = new Date(trade.timestamp);
            const date = `${tradeDate.getFullYear()}-${String(tradeDate.getMonth() + 1).padStart(2, '0')}-${String(tradeDate.getDate()).padStart(2, '0')}`;
            if (!stats[date]) {
              stats[date] = {
                date,
                tradeCount: 0,
                winCount: 0,
                lossCount: 0,
                totalProfitLoss: 0,
                totalInvestment: 0
              };
            }
            stats[date].tradeCount++;
            stats[date].totalInvestment += trade.investmentAmount || 5;
            if (trade.isCorrect) {
              stats[date].winCount++;
            } else {
              stats[date].lossCount++;
            }
            // 使用实际的盈利亏损值
            if (trade.profitLoss !== undefined) {
              stats[date].totalProfitLoss += trade.profitLoss;
            }
            stats[date].winRate = (stats[date].winCount / stats[date].tradeCount) * 100;
          }
        });
        return Object.values(stats);
      };

      const dailyStats = calculateDailyStats();

      const getDaysInMonth = (date) => {
        const year = date.getFullYear();
        const month = date.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startingDayOfWeek = firstDay.getDay();
        const days = [];
        for (let i = 0; i < startingDayOfWeek; i++) {
          days.push(null);
        }
        for (let day = 1; day <= daysInMonth; day++) {
          days.push(new Date(year, month, day));
        }
        return days;
      };

      const getDailyStat = (date) => {
        const dateStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        return dailyStats.find(stat => stat.date === dateStr);
      };

      const navigateMonth = (direction) => {
        setCurrentMonth(prev => {
          const newMonth = new Date(prev);
          if (direction === 'prev') {
            newMonth.setMonth(prev.getMonth() - 1);
          } else {
            newMonth.setMonth(prev.getMonth() + 1);
          }
          return newMonth;
        });
      };

      const days = getDaysInMonth(currentMonth);
      const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];

      return (
        <div className="calendar-stats">
          <div className="calendar-header">
            <button
              className="calendar-nav"
              onClick={() => navigateMonth('prev')}
            >
              ←
            </button>
            <h3>{currentMonth.getFullYear()}年{monthNames[currentMonth.getMonth()]}</h3>
            <button
              className="calendar-nav"
              onClick={() => navigateMonth('next')}
            >
              →
            </button>
          </div>

          <div className="calendar-grid">
            {['日', '一', '二', '三', '四', '五', '六'].map(day => (
              <div key={day} className="calendar-day-header">{day}</div>
            ))}

            {days.map((day, index) => {
              if (!day) {
                return <div key={index} className="calendar-day empty"></div>;
              }
              const dayStat = getDailyStat(day);
              const isToday = day.toDateString() === new Date().toDateString();

              return (
                <div
                  key={index}
                  className={`calendar-day ${dayStat ? (dayStat.totalProfitLoss >= 0 ? 'profit-day' : 'loss-day') : ''}`}
                  style={{
                    border: isToday ? '2px solid #00d4ff' : 'none'
                  }}
                >
                  <div className="day-number">{day.getDate()}</div>
                  {dayStat && (
                    <div className="day-stats">
                      <div className="trade-count">{dayStat.tradeCount}笔</div>
                      <div className={`win-rate ${dayStat.winRate >= 50 ? 'profit' : 'loss'}`}>
                        {dayStat.winRate.toFixed(1)}%
                      </div>
                      <div className={`profit-loss ${dayStat.totalProfitLoss >= 0 ? 'positive' : 'negative'}`}>
                        {dayStat.totalProfitLoss >= 0 ? '+' : ''}{dayStat.totalProfitLoss}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          <div className="stats-summary">
            {(() => {
              const monthStats = dailyStats.filter(stat => {
                const statDate = new Date(stat.date);
                return statDate.getMonth() === currentMonth.getMonth() &&
                  statDate.getFullYear() === currentMonth.getFullYear();
              });

              const totalTrades = monthStats.reduce((sum, stat) => sum + stat.tradeCount, 0);
              const totalWins = monthStats.reduce((sum, stat) => sum + stat.winCount, 0);
              const totalProfitLoss = monthStats.reduce((sum, stat) => sum + stat.totalProfitLoss, 0);
              const totalInvestment = monthStats.reduce((sum, stat) => sum + stat.totalInvestment, 0);
              const monthWinRate = totalTrades > 0 ? (totalWins / totalTrades) * 100 : 0;

              return (
                <>
                  <div className="summary-item">
                    <div className="summary-value">{totalTrades}</div>
                    <div className="summary-label">总交易笔数</div>
                  </div>
                  <div className="summary-item">
                    <div className={`summary-value ${monthWinRate >= 50 ? 'profit' : 'loss'}`}>
                      {monthWinRate.toFixed(1)}%
                    </div>
                    <div className="summary-label">月胜率</div>
                  </div>
                  <div className="summary-item">
                    <div className={`summary-value ${totalProfitLoss >= 0 ? 'profit' : 'loss'}`}>
                      {totalProfitLoss >= 0 ? '+' : ''}{totalProfitLoss}
                    </div>
                    <div className="summary-label">月盈亏</div>
                  </div>
                  <div className="summary-item">
                    <div className="summary-value">{totalInvestment}</div>
                    <div className="summary-label">总预测金额</div>
                  </div>
                </>
              );
            })()}
          </div>
        </div>
      );
    };

    const AuthModal = ({ isOpen, onClose, mode, onModeToggle }) => {
      const [formData, setFormData] = useState({ username: '', email: '', password: '' });
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      if (!isOpen) return null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        try {
          const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData),
          });

          const data = await response.json();

          if (response.ok) {
            // Store token and user data
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            window.location.reload(); // Refresh to update dashboard
          } else {
            setError(data.message || 'Authentication failed');
          }
        } catch (err) {
          setError('Network error. Please try again.');
        } finally {
          setLoading(false);
        }
      };

      const handleChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };

      return (
        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
          <div className="bg-gradient-to-br from-slate-800/95 to-slate-900/95 p-8 rounded-2xl w-full max-w-md mx-4 border border-cyan-500/20 backdrop-blur-xl">
            <div className="text-center mb-6">
              <h2 className="text-2xl font-light text-cyan-300 tracking-wider">
                {mode === 'login' ? '登录账户' : '创建账户'}
              </h2>
              <p className="text-gray-400 text-sm mt-2">
                {mode === 'login' ? '欢迎回到 BTC Radar' : '开始您的智能交易之旅'}
              </p>
            </div>

            {error && (
              <div className="bg-red-500/10 border border-red-500/20 text-red-400 px-4 py-3 rounded-lg mb-4 text-sm">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <input
                  type="text"
                  name="username"
                  placeholder="用户名"
                  value={formData.username}
                  onChange={handleChange}
                  className="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-400 focus:border-cyan-400/50 focus:bg-white/10 transition-all duration-200 outline-none"
                  required
                />
              </div>

              {mode === 'register' && (
                <div>
                  <input
                    type="email"
                    name="email"
                    placeholder="邮箱地址"
                    value={formData.email}
                    onChange={handleChange}
                    className="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-400 focus:border-cyan-400/50 focus:bg-white/10 transition-all duration-200 outline-none"
                    required
                  />
                </div>
              )}

              <div>
                <input
                  type="password"
                  name="password"
                  placeholder="密码"
                  value={formData.password}
                  onChange={handleChange}
                  className="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-400 focus:border-cyan-400/50 focus:bg-white/10 transition-all duration-200 outline-none"
                  required
                />
              </div>

              <div className="flex gap-3 pt-4">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-gray-300 hover:bg-white/10 transition-all duration-200"
                >
                  取消
                </button>
                <button
                  type="submit"
                  disabled={loading}
                  className="flex-1 px-4 py-3 bg-gradient-to-r from-cyan-500 to-blue-500 rounded-lg text-white font-medium hover:shadow-lg hover:shadow-cyan-500/25 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  {loading ? '处理中...' : (mode === 'login' ? '登录' : '注册')}
                </button>
              </div>
            </form>

            <div className="text-center mt-6">
              <button
                onClick={onModeToggle}
                className="text-cyan-400 hover:text-cyan-300 text-sm transition-colors duration-200"
              >
                {mode === 'login' ? '还没有账户？立即注册' : '已有账户？立即登录'}
              </button>
            </div>
          </div>
        </div>
      );
    };

    const Dashboard = () => {
      const [currentSignal, setCurrentSignal] = useState(null);
      const [stats, setStats] = useState(null);
      const [recentTrades, setRecentTrades] = useState([]);
      const [allTrades, setAllTrades] = useState([]); // 所有交易数据，用于日历统计
      const [currentBalance, setCurrentBalance] = useState(1000); // 初始资金1000U
      const initialBalance = 1000; // 初始资金常量
      const [balanceHistory, setBalanceHistory] = useState([]);
      const [isConnected, setIsConnected] = useState(false);
      const [activeView, setActiveView] = useState('dashboard');
      const [user, setUser] = useState(null);
      const [subscription, setSubscription] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const confettiTriggeredTradesRef = React.useRef(new Set()); // 使用useRef存储已触发散花的交易ID，避免组件重渲染时丢失
      useEffect(() => {
        // 检查用户登录状态
        const token = localStorage.getItem('token');
        const userData = localStorage.getItem('user');

        if (token && userData) {
          setUser(JSON.parse(userData));
        } else {
          setShowAuthModal(true);
          return;
        }

        // 连接WebSocket（同源，生产环境自动使用当前域名）
        const socket = io({
          auth: { token }
        });

        socket.on('connect', () => {
          setIsConnected(true);
          console.log('已连接到服务器');
        });

        socket.on('disconnect', () => {
          setIsConnected(false);
          console.log('与服务器断开连接');
        });

        socket.on('tradingSignal', (signal) => {
          setCurrentSignal(signal);
        });

        socket.on('balanceUpdate', (data) => {
          console.log('收到资金更新:', data.balance);
          setCurrentBalance(data.balance);
          setBalanceHistory(prev => {
            // 确保始终包含初始资金点
            let newHistory;

            if (prev.length === 0) {
              // 如果历史为空，创建初始资金点
              newHistory = [{
                time: new Date(Date.now() - 10 * 60 * 1000).toISOString(), // 10分钟前作为起点
                balance: 1000
              }];
            } else {
              // 直接使用prev，保留所有历史数据
              newHistory = [...prev];
            }

            // 添加新的资金点
            newHistory.push({
              time: data.timestamp,
              balance: data.balance
            });

            return newHistory;
          });
        });

        socket.on('statsUpdate', (newStats) => {
          setStats(newStats);
        });

        socket.on('tradesUpdate', (trades) => {
          // 检查是否有新的预测正确的交易，且尚未触发过散花效果
          const newCorrectTrades = trades.filter(trade =>
            trade.isCorrect === true &&
            !confettiTriggeredTradesRef.current.has(trade._id)
          );

          // 如果有新的预测正确的交易，触发散花效果
          if (newCorrectTrades.length > 0) {
            triggerConfetti();
            // 记录已触发散花的交易ID到useRef中
            newCorrectTrades.forEach(trade => confettiTriggeredTradesRef.current.add(trade._id));
            console.log('已触发散花效果的交易ID:', Array.from(confettiTriggeredTradesRef.current));
          }

          setRecentTrades(trades);
        });

        // 初始数据加载
        fetchInitialData();
        fetchAllTrades(); // 获取所有交易用于日历统计

        // 定时更新日历统计数据（每分钟更新一次）
        const calendarUpdateInterval = setInterval(() => {
          fetchAllTrades(); // 获取所有交易用于日历统计
          console.log('日历统计数据已更新');
        }, 60000); // 每分钟更新一次

        return () => {
          socket.disconnect();
          clearInterval(calendarUpdateInterval); // 清理定时器
        };
      }, []); // 空依赖数组，只执行一次

      // 散花效果函数
      const triggerConfetti = () => {
        // 创建散花容器
        const confettiContainer = document.createElement('div');
        confettiContainer.id = 'confetti-container';
        document.body.appendChild(confettiContainer);

        // 生成散花
        const colors = ['#4CAF50', '#2196F3', '#FFC107', '#9C27B0', '#FF5722'];
        const confettiCount = 100;

        for (let i = 0; i < confettiCount; i++) {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.left = Math.random() * 100 + '%';
          confetti.style.animationDelay = Math.random() * 3 + 's';
          confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
          confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
          confettiContainer.appendChild(confetti);
        }

        // 3秒后移除散花容器
        setTimeout(() => {
          if (confettiContainer) {
            confettiContainer.remove();
          }
        }, 5000);
      };

      const fetchInitialData = async () => {
        try {
          const token = localStorage.getItem('token');
          const [statsRes, tradesRes] = await Promise.all([
            fetch('/api/stats', {
              headers: { 'Authorization': `Bearer ${token}` }
            }),
            fetch('/api/recent-trades', {
              headers: { 'Authorization': `Bearer ${token}` }
            })
          ]);

          if (statsRes.ok) {
            const statsData = await statsRes.json();
            console.log('API返回统计数据:', statsData);
            setStats(statsData);
            // 使用服务器提供的资金数据
            if (statsData.currentBalance !== undefined) {
              console.log('设置资金为:', statsData.currentBalance);
              setCurrentBalance(statsData.currentBalance);
              // 使用服务端提供的完整资金历史
              if (statsData.balanceHistory && statsData.balanceHistory.length > 0) {
                // 确保资金历史包含初始资金点
                let history = statsData.balanceHistory;
                // 检查是否包含初始资金点
                const hasInitialPoint = history.some(point => point.balance === 1000);
                if (!hasInitialPoint) {
                  // 添加初始资金点
                  history = [{
                    time: new Date(Date.now() - 10 * 60 * 1000).toISOString(), // 10分钟前作为起点
                    balance: 1000
                  }, ...history];
                }
                setBalanceHistory(history);
                console.log('加载资金历史:', history.length, '个数据点');
              } else {
                // 如果没有历史数据，至少显示当前点和初始资金点
                setBalanceHistory([{
                  time: new Date(Date.now() - 10 * 60 * 1000).toISOString(), // 10分钟前作为起点
                  balance: 1000
                }, {
                  time: new Date().toISOString(),
                  balance: statsData.currentBalance
                }]);
              }
            } else {
              console.log('API未返回currentBalance字段');
            }
            // 设置订阅信息
            if (statsData.subscription) {
              setSubscription(statsData.subscription);
              console.log('加载订阅信息:', statsData.subscription);
              // 检查订阅状态，如果未订阅或已过期，重定向到订阅页面
              if (!statsData.subscription.hasActiveSubscription || statsData.subscription.isExpired) {
                console.log('未订阅或订阅已过期，重定向到订阅页面');
                // window.location.href = '/subscription';
              }
            } else {
              // 没有订阅信息，重定向到订阅页面
              console.log('未找到订阅信息，重定向到订阅页面');
              window.location.href = '/subscription';
            }
          }

          if (tradesRes.ok) {
            const tradesData = await tradesRes.json();
            setRecentTrades(tradesData);
          }
        } catch (error) {
          console.error('获取初始数据失败:', error);
        }
      };

      const fetchAllTrades = async () => {
        try {
          const token = localStorage.getItem('token');
          const response = await fetch('/api/all-trades', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (response.ok) {
            const allTradesData = await response.json();
            setAllTrades(allTradesData);
          }
        } catch (error) {
          console.error('获取完整交易数据失败:', error);
        }
      };

      const formatCurrency = (amount) => {
        return new Intl.NumberFormat('zh-CN', {
          style: 'decimal',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(amount);
      };

      const formatPercentage = (value) => {
        return `${value.toFixed(1)}%`;
      };


      const handleChartMouseMove = (e) => {
        if (!balanceHistory || balanceHistory.length === 0) return;

        const containerRect = e.currentTarget.getBoundingClientRect();
        const svg = e.currentTarget.querySelector('svg');
        if (!svg) return;
        const rect = svg.getBoundingClientRect();
        const tooltip = document.getElementById('balance-tooltip');
        if (!tooltip) return;

        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        // 查找最近的数据点
        let closestPoint = null;
        let minDistance = Infinity;

        balanceHistory.forEach((dataPoint, index) => {
          // 计算数据点在图表中的位置
          const x = balanceHistory.length === 1 ? 50 : (index / (balanceHistory.length - 1)) * 100;
          let y;
          if (balanceHistory.length === 1) {
            y = 50;
          } else {
            const minBalance = Math.min(...balanceHistory.map(p => p.balance));
            const maxBalance = Math.max(...balanceHistory.map(p => p.balance));
            y = maxBalance > minBalance ?
              100 - ((dataPoint.balance - minBalance) / (maxBalance - minBalance)) * 100 : 50;
          }

          // 转换为实际像素位置
          const pointX = (x / 100) * rect.width;
          const pointY = (y / 100) * rect.height;

          // 计算鼠标到该点的距离
          const distance = Math.sqrt(
            Math.pow(mouseX - pointX, 2) +
            Math.pow(mouseY - pointY, 2)
          );

          if (distance < minDistance && distance < 50) { // 增加检测范围到50px
            minDistance = distance;
            closestPoint = dataPoint;
          }
        });

        if (closestPoint) {
          tooltip.style.display = 'block';

          const mx = e.clientX - containerRect.left;
          const my = e.clientY - containerRect.top;
          const tooltipWidth = tooltip.offsetWidth || 150;
          const tooltipHeight = tooltip.offsetHeight || 56;
          let left = mx + 12;
          let top = my - tooltipHeight - 8;

          if (left + tooltipWidth > containerRect.width - 4) {
            left = mx - tooltipWidth - 12;
          }
          if (left < 4) {
            left = 4;
          }

          if (top < 4) {
            top = my + 12;
          }
          if (top + tooltipHeight > containerRect.height) {
            top = containerRect.height - tooltipHeight - 4;
          }

          tooltip.style.left = left + 'px';
          tooltip.style.top = top + 'px';
          const timeStr = new Date(closestPoint.time).toLocaleTimeString('zh-CN', {
            hour: '2-digit',
            minute: '2-digit'
          });
          tooltip.innerHTML = `
            <div style="font-size: 12px; margin-bottom: 4px;">时间: ${timeStr}</div>
            <div style="font-size: 14px; font-weight: bold; color: #00d4ff;">资金: ${closestPoint.balance.toFixed(2)}U</div>
          `;
        } else {
          tooltip.style.display = 'none';
        }
      };

      const handleChartMouseLeave = () => {
        const tooltip = document.getElementById('balance-tooltip');
        if (tooltip) tooltip.style.display = 'none';
      };

      // 计算总交易额（所有开仓金额的总和）
      const calculateTotalInvestment = (trades) => {
        return trades.reduce((total, trade) => total + (trade.investmentAmount || 0), 0);
      };

      return (
        <div className="dashboard">
          <style>{`
                .dashboard {
                  background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);
                  color: #fff;
                  min-height: 100vh;
                  padding: 20px;
                  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                  position: relative;
                  overflow: hidden;
                }

                .dashboard::before {
                  content: '';
                  position: absolute;
                  top: 0;
                  left: 0;
                  right: 0;
                  bottom: 0;
                  background:

                      </div>
                    </div>

                    <div className="panel">
                      <h3>统计概览</h3>
                      {stats ? (
                        <>
                          <div style={{ fontSize: '13px', fontWeight: 'bold', color: '#fff', marginBottom: '12px', padding: '10px 12px', backgroundColor: 'rgba(0,212,255,0.15)', borderRadius: '8px', border: '1px solid rgba(0,212,255,0.3)', display: 'flex', justifyContent: 'space-around', textAlign: 'center' }}>
                            <div><span style={{ color: 'rgba(255,255,255,0.6)' }}>今日交易</span><br /><span style={{ color: '#00d4ff', fontSize: '16px' }}>{stats.todayStats?.totalTrades || 0}</span>笔</div>
                            <div style={{ borderLeft: '1px solid rgba(255,255,255,0.2)' }} /><div><span style={{ color: 'rgba(255,255,255,0.6)' }}>胜率</span><br /><span style={{ color: stats.todayStats?.winRate >= 50 ? '#4CAF50' : '#f44336', fontSize: '16px' }}>{formatPercentage(stats.todayStats?.winRate || 0)}</span></div>
                            <div style={{ borderLeft: '1px solid rgba(255,255,255,0.2)' }} /><div><span style={{ color: 'rgba(255,255,255,0.6)' }}>今日盈亏</span><br /><span style={{ color: stats.todayStats?.totalProfitLoss >= 0 ? '#4CAF50' : '#f44336', fontSize: '16px' }}>{stats.todayStats?.totalProfitLoss >= 0 ? '+' : ''}{stats.todayStats?.totalProfitLoss?.toFixed(2) || '0.00'}</span></div>
                          </div>
                          <div className="stats-grid">
                            <div className="stat-card">
                              <div className="stat-value">{stats.totalTrades}</div>
                              <div className="stat-label">总交易数</div>
                            </div>
                            <div className="stat-card">
                              <div className={`stat-value ${stats.winRate >= 60 ? 'profit' : 'loss'}`}>
                                {formatPercentage(stats.winRate)}
                              </div>
                              <div className="stat-label">胜率</div>
                            </div>
                            <div className="stat-card">
                              <div className="stat-value">{stats.winningTrades}</div>
                              <div className="stat-label">盈利次数</div>
                            </div>
                            <div className="stat-card">
                              <div className="stat-value">{stats.losingTrades}</div>
                              <div className="stat-label">亏损次数</div>
                            </div>
                            <div className="stat-card">
                              <div className="stat-value">{stats.openTrades || 0}</div>
                              <div className="stat-label">持仓中</div>
                            </div>
                            <div className="stat-card">
                              <div className={`stat-value ${stats.totalProfitLoss >= 0 ? 'profit' : 'loss'}`}>
                                {stats.totalProfitLoss >= 0 ? formatCurrency(Math.abs(stats.totalProfitLoss)) : '-' + formatCurrency(Math.abs(stats.totalProfitLoss))}
                              </div>
                              <div className="stat-label">总盈亏</div>
                            </div>
                          </div>
                        </>
                      ) : (
                        <div>加载中...</div>
                      )}
                    </div>
                  </div>

                  <div className="panel">
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px' }}>
                      <h3 style={{ margin: 0 }}>最近交易记录</h3>
                      <button
                        onClick={() => setActiveView('trades')}
                        style={{
                          padding: '6px 12px',
                          backgroundColor: 'rgba(0, 212, 255, 0.2)',
                          border: '1px solid rgba(0, 212, 255, 0.5)',
                          borderRadius: '6px',
                          color: '#00d4ff',
                          fontSize: '12px',
                          cursor: 'pointer',
                          transition: 'all 0.2s'
                        }}
                        onMouseEnter={(e) => {
                          e.target.style.backgroundColor = 'rgba(0, 212, 255, 0.3)';
                          e.target.style.borderColor = '#00d4ff';
                        }}
                        onMouseLeave={(e) => {
                          e.target.style.backgroundColor = 'rgba(0, 212, 255, 0.2)';
                          e.target.style.borderColor = 'rgba(0, 212, 255, 0.5)';
                        }}
                      >
                        查看更多 →
                      </button>
                    </div>
                    <table className="trades-table">
                      <thead>
                        <tr>
                          <th>开仓时间</th>
                          <th>开仓价</th>
                          <th>开仓金额</th>
                          <th>交易方向</th>
                          <th>入场原因</th>
                          <th>平仓价</th>
                          <th>价差</th>
                          <th>平仓时间</th>
                          <th>盈亏</th>
                        </tr>
                      </thead>
                      <tbody>
                        {recentTrades.map((trade) => {
                          const isToday = trade.closeTime ?
                            new Date(trade.closeTime).toDateString() === new Date().toDateString() :
                            new Date(trade.timestamp).toDateString() === new Date().toDateString();
                          return (
                            <tr key={trade._id} style={isToday ? { backgroundColor: 'rgba(0,212,255,0.1)', borderLeft: '3px solid #00d4ff' } : {}}
                              onMouseEnter={(e) => { if (!isToday) e.currentTarget.style.backgroundColor = 'rgba(255,255,255,0.1)'; }}
                              onMouseLeave={(e) => { if (!isToday) e.currentTarget.style.backgroundColor = ''; }}>
                              <td>{new Date(trade.timestamp).toLocaleString('zh-CN')}</td>
                              <td>{formatCurrency(trade.price)}</td>
                              <td>{trade.investmentAmount}</td>
                              <td>
                                <span style={{
                                  padding: '4px 8px',
                                  borderRadius: '12px',
                                  fontSize: '12px',
                                  backgroundColor: trade.tradeType === 'LONG' ? 'rgba(76, 175, 80, 0.2)' : 'rgba(244, 67, 54, 0.2)',
                                  color: trade.tradeType === 'LONG' ? '#4CAF50' : '#f44336'
                                }}>
                                  {trade.tradeType === 'LONG' ? '做多' : '做空'}
                                </span>
                              </td>
                              <td>
                                <div style={{ fontSize: '0.9em' }}>
                                  {trade.reasoning ? trade.reasoning.slice(0, 2).map((reason, index) => (
                                    <div key={index}>• {reason}</div>
                                  )) : '-'}
                                </div>
                              </td>
                              <td>{trade.closePrice ? formatCurrency(trade.closePrice) : '-'}</td>
                              <td>
                                {trade.closePrice ?
                                  `${trade.closePrice > trade.price ? '+' : ''}${formatCurrency(trade.closePrice - trade.price)}`
                                  : '-'}
                              </td>
                              <td>{trade.closeTime ? new Date(trade.closeTime).toLocaleTimeString() : '-'}</td>
                              <td className={trade.profitLoss && trade.profitLoss >= 0 ? 'profit' : 'loss'}>
                                {trade.profitLoss !== undefined ? `${trade.profitLoss > 0 ? '+' : ''}${trade.profitLoss.toFixed(2)}` : '-'}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </>
              ) : activeView === 'calendar' ? (
                <CalendarStats trades={allTrades} />
              ) : (
                <TradesQuery trades={allTrades} />
              )}
            </>
          )}

          {/* 认证模态框 */}
          <AuthModal
            isOpen={showAuthModal}
            onClose={() => setShowAuthModal(false)}
            mode={authMode}
            onModeToggle={() => setAuthMode(authMode === 'login' ? 'register' : 'login')}
          />
        </div>
      );
    };

    const TradesQuery = () => {
      const [trades, setTrades] = useState([]);
      const [allTrades, setAllTrades] = useState([]); // 存储所有交易数据
      const [loading, setLoading] = useState(false);
      const [filters, setFilters] = useState({
        reasoningKeyword: '',    // 新增：入场原因关键词
        signal: '',             // 新增：交易信号
        strategy: '',           // 新增：策略筛选
        confidenceMin: '',      // 新增：最小置信度
        confidenceMax: '',      // 原有：时间范围
        startDate: '',
        endDate: '',
        tradeType: '',
        result: ''
      });

      const fetchAllTrades = async () => {
        try {
          const response = await fetch('/api/all-trades');
          if (response.ok) {
            const tradesData = await response.json();
            setAllTrades(tradesData);
            return tradesData;
          }
        } catch (error) {
          console.error('获取交易记录失败:', error);
        }
        return null;
      };

      const fetchTrades = async () => {
        setLoading(true);
        try {
          // 如果还没有加载全部数据，先获取
          let sourceTrades = allTrades;
          if (sourceTrades.length === 0) {
            const fetched = await fetchAllTrades();
            if (fetched) sourceTrades = fetched;
          }

          // 应用筛选条件并按时间倒序排列（最近时间在前）
          let filteredTrades = sourceTrades.filter(trade => {
            // 入场原因关键词模糊查询
            if (filters.reasoningKeyword) {
              const keyword = filters.reasoningKeyword.toLowerCase();
              const hasMatchingReasoning = trade.reasoning && trade.reasoning.some(reason =>
                reason.toLowerCase().includes(keyword)
              );
              if (!hasMatchingReasoning) return false;
            }

            // 交易信号筛选
            if (filters.signal) {
              if (filters.signal === 'BUY' && trade.signal !== 'BUY') return false;
              if (filters.signal === 'SELL' && trade.signal !== 'SELL') return false;
            }

            // 策略筛选（按入场原因前缀匹配策略类型）
            if (filters.strategy) {
              const hasStrategy = trade.reasoning && trade.reasoning.some(reason =>
                reason.startsWith(filters.strategy)
              );
              if (!hasStrategy) return false;
            }

            // 置信度范围筛选
            if (filters.confidenceMin) {
              const minConfidence = parseFloat(filters.confidenceMin);
              if (trade.confidence < minConfidence) return false;
            }

            if (filters.confidenceMax) {
              const maxConfidence = parseFloat(filters.confidenceMax);
              if (trade.confidence > maxConfidence) return false;
            }

            // 时间范围筛选
            if (filters.startDate) {
              const tradeDate = new Date(trade.timestamp);
              const startDate = new Date(filters.startDate);
              if (tradeDate < startDate) return false;
            }

            if (filters.endDate) {
              const tradeDate = new Date(trade.timestamp);
              const endDate = new Date(filters.endDate);
              endDate.setHours(23, 59, 59, 999);
              if (tradeDate > endDate) return false;
            }

            // 交易方向筛选
            if (filters.tradeType && trade.tradeType !== filters.tradeType) {
              return false;
            }

            // 预测结果筛选
            if (filters.result) {
              if (filters.result === 'correct' && trade.isCorrect !== true) return false;
              if (filters.result === 'incorrect' && trade.isCorrect !== false) return false;
              if (filters.result === 'pending' && trade.isCorrect !== undefined) return false;
            }

            return true;
          });

          // 按时间倒序排列，最近的时间在最前面
          filteredTrades.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

          setTrades(filteredTrades);
        } catch (error) {
          console.error('筛选交易记录失败:', error);
        } finally {
          setLoading(false);
        }
      };

      const handleFilterChange = (key, value) => {
        setFilters(prev => ({ ...prev, [key]: value }));
      };

      const resetFilters = () => {
        setFilters({
          reasoningKeyword: '',    // 重置入场原因关键词
          signal: '',             // 重置交易信号
          strategy: '',           // 重置策略筛选
          confidenceMin: '',      // 重置置信度范围
          confidenceMax: '',
          startDate: '',
          endDate: '',
          tradeType: '',
          result: ''
        });
      };

      const formatCurrency = (amount) => {
        return new Intl.NumberFormat('zh-CN', {
          style: 'decimal',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(amount);
      };

      return (
        <div className="trades-query">

          {/* 筛选条件 - 简洁现代风格 */}
          <div className="bg-white/5 backdrop-blur-sm rounded-xl p-4 mb-6 border border-white/10">
            <h4 className="text-cyan-300 text-sm font-medium mb-4 tracking-wide">筛选条件</h4>

            <div className="grid grid-cols-1 md:grid-cols-12 gap-4 mb-4">
              {/* 入场原因关键词 - 核心功能 */}
              <div className="md:col-span-3">
                <label className="block text-xs text-gray-400 mb-2">入场原因关键词</label>
                <input
                  type="text"
                  value={filters.reasoningKeyword}
                  onChange={(e) => handleFilterChange('reasoningKeyword', e.target.value)}
                  placeholder="输入关键词进行模糊搜索..."
                  className="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-lg text-gray-200 text-sm focus:border-cyan-400/50 focus:bg-white/10 transition-all duration-200 outline-none"
                />
              </div>

              {/* 策略 */}
              <div className="md:col-span-2">
                <label className="block text-xs text-gray-400 mb-2">策略</label>
                <select
                  value={filters.strategy}
                  onChange={(e) => handleFilterChange('strategy', e.target.value)}
                  className="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-lg text-gray-200 text-sm focus:border-cyan-400/50 focus:bg-white/10 transition-all duration-200 outline-none cursor-pointer"
                >
                  <option value="" className="bg-gray-900 text-white">全部策略</option>
                  <option value="趋势策略" className="bg-gray-900 text-cyan-400">趋势策略</option>
                  <option value="反转策略" className="bg-gray-900 text-orange-400">反转策略</option>
                </select>
              </div>

              {/* 时间范围 */}
              <div className="md:col-span-3">
                <label className="block text-xs text-gray-400 mb-2">时间范围</label>
                <div className="flex items-center gap-2">
                  <input
                    type="date"
                    value={filters.startDate}
                    onChange={(e) => handleFilterChange('startDate', e.target.value)}
                    className="flex-1 px-3 py-2 bg-white/5 border border-white/10 rounded-lg text-gray-200 text-sm focus:border-cyan-400/50 focus:bg-white/10 transition-all duration-200 outline-none"
                  />
                  <span className="text-gray-500 text-xs">至</span>
                  <input
                    type="date"
                    value={filters.endDate}
                    onChange={(e) => handleFilterChange('endDate', e.target.value)}
                    className="flex-1 px-3 py-2 bg-white/5 border border-white/10 rounded-lg text-gray-200 text-sm focus:border-cyan-400/50 focus:bg-white/10 transition-all duration-200 outline-none"
                  />
                </div>
              </div>

              {/* 交易方向 */}
              <div className="md:col-span-2">
                <label className="block text-xs text-gray-400 mb-2">交易方向</label>
                <select
                  value={filters.tradeType}
                  onChange={(e) => handleFilterChange('tradeType', e.target.value)}
                  className="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-lg text-gray-200 text-sm focus:border-cyan-400/50 focus:bg-white/10 transition-all duration-200 outline-none cursor-pointer"
                >
                  <option value="" className="bg-gray-900 text-white">全部方向</option>
                  <option value="LONG" className="bg-gray-900 text-green-400">做多</option>
                  <option value="SHORT" className="bg-gray-900 text-red-400">做空</option>
                </select>
              </div>

              {/* 预测结果 */}
              <div className="md:col-span-2">
                <label className="block text-xs text-gray-400 mb-2">预测结果</label>
                <select
                  value={filters.result}
                  onChange={(e) => handleFilterChange('result', e.target.value)}
                  className="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-lg text-gray-200 text-sm focus:border-cyan-400/50 focus:bg-white/10 transition-all duration-200 outline-none cursor-pointer"
                >
                  <option value="" className="bg-gray-900 text-white">全部结果</option>
                  <option value="correct" className="bg-gray-900 text-green-400">预测正确</option>
                  <option value="incorrect" className="bg-gray-900 text-red-400">预测错误</option>
                  <option value="pending" className="bg-gray-900 text-yellow-400">持仓中</option>
                </select>
              </div>
            </div>

            {/* 操作按钮 */}
            <div className="flex gap-2 justify-end">
              <button
                onClick={(e) => {
                  e.preventDefault();
                  resetFilters();
                }}
                className="px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-gray-300 text-sm hover:bg-white/10 transition-all duration-200"
              >
                重置
              </button>

              <button
                onClick={(e) => {
                  e.preventDefault();
                  fetchTrades();
                }}
                disabled={loading}
                className="px-4 py-2 bg-cyan-500/20 border border-cyan-500/30 rounded-lg text-cyan-300 text-sm hover:bg-cyan-500/30 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
              >
                {loading ? (
                  <>
                    <div className="w-3 h-3 border-2 border-cyan-300/30 border-t-cyan-300 rounded-full animate-spin"></div>
                    查询中...
                  </>
                ) : '查询'}
              </button>
            </div>
          </div>

          {/* 统计信息 */}
          <div style={{ marginBottom: '20px', fontSize: '14px', color: '#ccc' }}>
            {(() => {
              const activeFilters = [];
              if (filters.reasoningKeyword) activeFilters.push(`关键词: "${filters.reasoningKeyword}"`);
              if (filters.strategy) activeFilters.push(`策略: ${filters.strategy}`);
              if (filters.signal) activeFilters.push(`信号: ${filters.signal === 'BUY' ? '买入' : '卖出'}`);
              if (filters.confidenceMin) activeFilters.push(`置信度≥${filters.confidenceMin}%`);
              if (filters.confidenceMax) activeFilters.push(`置信度≤${filters.confidenceMax}%`);
              if (filters.startDate) activeFilters.push(`起始: ${filters.startDate}`);
              if (filters.endDate) activeFilters.push(`截止: ${filters.endDate}`);
              if (filters.tradeType) activeFilters.push(`方向: ${filters.tradeType === 'LONG' ? '做多' : '做空'}`);
              if (filters.result) activeFilters.push(`结果: ${filters.result === 'correct' ? '正确' : filters.result === 'incorrect' ? '错误' : '持仓中'}`);
              return `共找到 ${trades.length} 条交易记录${activeFilters.length ? ' | ' + activeFilters.join(' | ') : ''}`;
            })()}
          </div>

          {/* 交易记录表格 */}
          <div style={{ overflowX: 'auto' }}>
            <table className="trades-table" style={{ width: '100%', minWidth: '800px' }}>
              <thead>
                <tr>
                  <th>开仓时间</th>
                  <th>开仓价</th>
                  <th>开仓金额</th>
                  <th>交易方向</th>
                  <th>入场原因</th>
                  <th>平仓价</th>
                  <th>价差</th>
                  <th>平仓时间</th>
                  <th>盈亏</th>
                </tr>
              </thead>
              <tbody>
                {trades.map((trade) => (
                  <tr key={trade._id}>
                    <td>{new Date(trade.timestamp).toLocaleString('zh-CN')}</td>
                    <td>{formatCurrency(trade.price)}</td>
                    <td>{trade.investmentAmount}</td>
                    <td>
                      <span style={{
                        padding: '4px 8px',
                        borderRadius: '12px',
                        fontSize: '12px',
                        backgroundColor: trade.tradeType === 'LONG' ? 'rgba(76, 175, 80, 0.2)' : 'rgba(244, 67, 54, 0.2)',
                        color: trade.tradeType === 'LONG' ? '#4CAF50' : '#f44336'
                      }}>
                        {trade.tradeType === 'LONG' ? '做多' : '做空'}
                      </span>
                    </td>
                    <td>
                      <div style={{ fontSize: '0.9em' }}>
                        {trade.reasoning ? trade.reasoning.slice(0, 2).map((reason, index) => (
                          <div key={index}>• {reason}</div>
                        )) : '-'}
                      </div>
                    </td>
                    <td>{trade.closePrice ? formatCurrency(trade.closePrice) : '-'}</td>
                    <td>
                      {trade.closePrice ?
                        `${trade.closePrice > trade.price ? '+' : ''}${formatCurrency(trade.closePrice - trade.price)}`
                        : '-'}
                    </td>
                    <td>{trade.closeTime ? new Date(trade.closeTime).toLocaleTimeString() : '-'}</td>
                    <td className={trade.profitLoss && trade.profitLoss >= 0 ? 'profit' : 'loss'}>
                      {trade.profitLoss !== undefined ? `${trade.profitLoss > 0 ? '+' : ''}${trade.profitLoss.toFixed(2)}` : '-'}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>

            {trades.length === 0 && !loading && (
              <div style={{ textAlign: 'center', padding: '40px', color: '#ccc' }}>
                暂无符合条件的交易记录
              </div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.render(<Dashboard />, document.getElementById('root'));
  </script>
</body>

</html>
</script>
</body>

</html>
