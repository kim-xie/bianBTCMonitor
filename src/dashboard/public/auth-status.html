<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>认证状态 - BTC交易监控</title>
    <style>
        .auth-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .auth-button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-login {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }

        .btn-logout {
            background: linear-gradient(135deg, #f44336 0%, #da190b 100%);
            color: white;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="auth-container" id="authContainer">
        <!-- 认证状态将在这里动态显示 -->
    </div>

    <script>
        class AuthStatus {
            constructor() {
                this.token = localStorage.getItem('authToken');
                this.init();
            }

            init() {
                this.renderAuthUI();
                this.setupEventListeners();
            }

            renderAuthUI() {
                const container = document.getElementById('authContainer');

                if (!this.token) {
                    // 未登录状态
                    container.innerHTML = `
                        <button class="auth-button btn-login" onclick="openLoginModal()">
                            <i class="fas fa-sign-in-alt"></i> 登录
                        </button>
                    `;
                } else {
                    // 已登录状态
                    this.checkUserStatus().then(userInfo => {
                        container.innerHTML = `
                            <div class="user-info">
                                <i class="fas fa-user-circle"></i>
                                <span>${userInfo.username}</span>
                                <button class="auth-button btn-logout" onclick="logout()" style="margin-left: 1rem;">
                                    <i class="fas fa-sign-out-alt"></i> 退出
                                </button>
                            </div>
                        `;
                    });
                }
            }

            async checkUserStatus() {
                try {
                    const response = await fetch('/api/auth/me', {
                        headers: {
                            'Authorization': `Bearer ${this.token}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        return data.user;
                    } else {
                        // Token无效，清除本地存储
                        this.clearToken();
                        return null;
                    }
                } catch (error) {
                    console.error('检查用户状态失败:', error);
                    this.clearToken();
                    return null;
                }
            }

            setupEventListeners() {
                // 监听storage事件（其他标签页的token变化）
                window.addEventListener('storage', (event) => {
                    if (event.key === 'authToken') {
                        this.token = localStorage.getItem('authToken');
                        this.renderAuthUI();
                    }
                });
            }

            clearToken() {
                localStorage.removeItem('authToken');
                this.token = null;
                this.renderAuthUI();
            }
        }

        // 全局函数
        function openLoginModal() {
            // 这里可以打开弹窗或者跳转到登录页面
            window.location.href = '/login';
        }

        function logout() {
            if (confirm('确定要退出登录吗？')) {
                fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('authToken')}`,
                        'Content-Type': 'application/json'
                    }
                }).then(() => {
                    localStorage.removeItem('authToken');
                    location.reload();
                });
            }
        }

        // 初始化认证状态管理器
        const authStatus = new AuthStatus();

        // 导出函数供其他页面使用
        window.openLoginModal = openLoginModal;
        window.logout = logout;
    </script>
</body>
</html>
