<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>烟花庆祝 - BTC交易监控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .firework-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: firework 2s ease-out forwards;
        }

        .firework::before,
        .firework::after {
            content: '';
            position: absolute;
            width: inherit;
            height: inherit;
            border-radius: inherit;
        }

        .firework::before {
            transform: translateX(-50%);
        }

        .firework::after {
            transform: translateY(-50%);
        }

        /* 彩色烟花粒子 */
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            animation: particle 1.5s ease-out forwards;
        }

        @keyframes firework {
            0% {
                opacity: 1;
                transform: scale(0);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: scale(1);
            }
        }

        @keyframes particle {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        /* 庆祝文字 */
        .celebration-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 10000;
            font-family: 'Arial', sans-serif;
        }

        .main-title {
            font-size: 4rem;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 1rem;
            animation: titlePulse 2s ease-in-out infinite alternate;
        }

        .subtitle {
            font-size: 1.5rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .btn-group {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        @keyframes titlePulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }

            .btn-group {
                flex-direction: column;
                align-items: center;
            }
        }

        /* 背景粒子效果 */
        .background-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .bg-particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 10s linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- 背景粒子 -->
    <div class="background-particles" id="backgroundParticles"></div>

    <!-- 烟花容器 -->
    <div class="firework-container" id="fireworkContainer"></div>

    <!-- 庆祝内容 -->
    <div class="celebration-text" id="celebrationContent">
        <h1 class="main-title">🎉 预测成功！</h1>
        <p class="subtitle">恭喜您做出了正确的交易决策</p>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-value" id="profitValue">+125.50</div>
                <div class="stat-label">盈利金额 (U)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="winRateValue">75%</div>
                <div class="stat-label">当前胜率</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="accuracyValue">85%</div>
                <div class="stat-label">预测准确率</div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="goToDashboard()">
                <i class="fas fa-chart-line"></i> 查看监控面板
            </button>
            <button class="btn btn-secondary" onclick="viewDetails()">
                <i class="fas fa-info-circle"></i> 查看详情
            </button>
        </div>
    </div>

    <script>
        class FireworksCelebration {
            constructor() {
                this.fireworks = [];
                this.particleCount = 0;
                this.maxFireworks = 15;
                this.init();
            }

            init() {
                // 创建背景粒子
                this.createBackgroundParticles();

                // 开始烟花表演
                setTimeout(() => {
                    this.startFireworkShow();
                }, 500);

                // 显示统计信息
                this.showStats();

                // 播放庆祝音效（可选）
                this.playCelebrationSound();
            }

            createBackgroundParticles() {
                const container = document.getElementById('backgroundParticles');
                for (let i = 0; i < 50; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'bg-particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.animationDelay = Math.random() * 10 + 's';
                    container.appendChild(particle);
                }
            }

            startFireworkShow() {
                // 在随机位置生成烟花
                const positions = [
                    { x: 20, y: 30 },
                    { x: 80, y: 25 },
                    { x: 15, y: 70 },
                    { x: 85, y: 65 },
                    { x: 50, y: 20 },
                    { x: 50, y: 80 },
                    { x: 35, y: 45 },
                    { x: 65, y: 55 }
                ];

                positions.forEach((pos, index) => {
                    setTimeout(() => {
                        this.createFirework(pos.x, pos.y);
                    }, index * 200);
                });

                // 持续生成烟花
                setInterval(() => {
                    if (this.fireworks.length < this.maxFireworks) {
                        const pos = positions[Math.floor(Math.random() * positions.length)];
                        this.createFirework(pos.x, pos.y);
                    }
                }, 1000);
            }

            createFirework(xPercent, yPercent) {
                const container = document.getElementById('fireworkContainer');
                const firework = document.createElement('div');
                firework.className = 'firework';

                // 随机颜色
                const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD', '#98D8C8'];
                const color = colors[Math.floor(Math.random() * colors.length)];

                firework.style.left = xPercent + '%';
                firework.style.top = yPercent + '%';
                firework.style.backgroundColor = color;

                // 创建粒子效果
                this.createParticles(xPercent, yPercent, color);

                container.appendChild(firework);

                // 移除烟花
                setTimeout(() => {
                    if (firework.parentNode) {
                        firework.parentNode.removeChild(firework);
                    }
                }, 2000);

                this.fireworks.push(firework);
            }

            createParticles(xPercent, yPercent, color) {
                const container = document.getElementById('fireworkContainer');
                const particleCount = 20;

                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = xPercent + '%';
                    particle.style.top = yPercent + '%';
                    particle.style.backgroundColor = color;

                    // 随机方向
                    const angle = (i / particleCount) * 2 * Math.PI;
                    const distance = 50 + Math.random() * 50;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;

                    particle.style.setProperty('--tx', tx + 'px');
                    particle.style.setProperty('--ty', ty + 'px');

                    container.appendChild(particle);

                    // 移除粒子
                    setTimeout(() => {
                        if (particle.parentNode) {
                            particle.parentNode.removeChild(particle);
                        }
                    }, 1500);
                }
            }

            showStats() {
                // 模拟统计数据更新
                document.getElementById('profitValue').textContent = '+125.50';
                document.getElementById('winRateValue').textContent = '75%';
                document.getElementById('accuracyValue').textContent = '85%';

                // 可以连接真实的API数据
                this.fetchRealStats();
            }

            async fetchRealStats() {
                try {
                    const response = await fetch('/api/stats', {
                        headers: {
                            ...(localStorage.getItem('authToken') && {
                                'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                            }),
                            'Content-Type': 'application/json'
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        // 更新真实统计数据
                        document.getElementById('profitValue').textContent =
                            `+${data.currentBalance?.toFixed(2) || '0'} U`;
                        document.getElementById('winRateValue').textContent =
                            `${data.winRate || '0'}%`;
                        document.getElementById('accuracyValue').textContent =
                            `${Math.round((data.correctTrades / data.totalTrades) * 100) || '0'}%`;
                    }
                } catch (error) {
                    console.error('获取统计数据失败:', error);
                }
            }

            playCelebrationSound() {
                // 创建简单的音频反馈
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
                    oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.2); // E5
                    oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.4); // G5

                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1);

                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 1);
                } catch (error) {
                    console.log('音频播放不可用:', error);
                }
            }
        }

        // 全局函数
        function goToDashboard() {
            window.location.href = '/dashboard';
        }

        function viewDetails() {
            // 可以在这里显示更详细的信息
            alert('查看详细交易历史和分析报告');
        }

        // 页面加载完成后初始化烟花庆祝
        document.addEventListener('DOMContentLoaded', () => {
            new FireworksCelebration();
        });
    </script>
</body>
</html>
