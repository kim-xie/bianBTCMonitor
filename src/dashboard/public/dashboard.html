<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC交易监控 - 仪表板</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo h1 {
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .subscription-status {
            text-align: right;
        }

        .subscription-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 1rem 1.5rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
        }

        .subscription-active {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.2);
        }

        .subscription-expired {
            border-color: #f44336;
            background: rgba(244, 67, 54, 0.2);
        }

        .subscription-time {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .time-left {
            font-weight: bold;
            font-size: 1.3rem;
        }

        .time-warning {
            color: #ff9800;
            animation: pulse 2s infinite;
        }

        .time-critical {
            color: #f44336;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-title {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 2rem;
        }

        .chart-title {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .trades-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .trades-table th,
        .trades-table td {
            padding: 0.8rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 搜索输入框样式 */
        input[type="text"],
        input[type="number"],
        select {
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }

        .positive {
            color: #4CAF50 !important;
            font-weight: bold;
        }

        .negative {
            color: #f44336 !important;
            font-weight: bold;
        }

        .trades-table th {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f44336 0%, #da190b 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            border-left: 4px solid;
        }

        .alert-warning {
            background: rgba(255, 152, 0, 0.2);
            border-left-color: #ff9800;
            color: #ff9800;
        }

        .alert-danger {
            background: rgba(244, 67, 54, 0.2);
            border-left-color: #f44336;
            color: #f44336;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: rgba(255, 255, 255, 0.8);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .user-info {
                flex-direction: column;
                gap: 1rem;
            }

            .subscription-status {
                text-align: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页面头部 -->
        <div class="header">
            <div class="logo">
                <h1><i class="fas fa-chart-line"></i> BTC交易监控系统</h1>
                <p>实时监控比特币价格变动和交易信号</p>
            </div>

            <div class="user-info">
                <div class="subscription-status">
                    <div id="subscriptionCard" class="subscription-card">
                        <!-- 订阅状态将在这里动态显示 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 统计数据 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">当前资金</div>
                <div class="stat-value" id="currentBalance">--</div>
                <div id="balanceUpdateTime" style="opacity: 0.7;">最后更新: --</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">胜率</div>
                <div class="stat-value" id="winRate">--</div>
                <div id="winRateDetails" style="opacity: 0.7;">--</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">总交易次数</div>
                <div class="stat-value" id="totalTrades">--</div>
                <div id="recentTrades" style="opacity: 0.7;">--</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">当前价格</div>
                <div class="stat-value" id="currentPrice">--</div>
                <div id="priceChange" style="opacity: 0.7;">--</div>
            </div>
        </div>

        <!-- 警告提示 -->
        <div id="warningAlert" class="alert" style="display: none;">
            <!-- 到期警告将在这里显示 -->
        </div>

        <!-- 图表区域 -->
        <div class="chart-container">
            <div class="chart-title">
                <i class="fas fa-chart-area"></i> 资金变化历史
            </div>
            <div id="balanceChart" style="height: 300px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 1rem;">
                <!-- 图表数据将在这里显示 -->
            </div>
        </div>

        <!-- 搜索过滤器 -->
        <div class="chart-container" style="margin-bottom: 1rem;">
            <div class="chart-title">
                <i class="fas fa-filter"></i> 交易记录搜索
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem;">
                <input type="text" id="reasoningKeywordInput" placeholder="按入场原因模糊查询..."
                       style="padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; backdrop-filter: blur(10px);">

                <select id="signalFilter" style="padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; backdrop-filter: blur(10px);">
                    <option value="">所有信号</option>
                    <option value="BUY">买入信号</option>
                    <option value="SELL">卖出信号</option>
                </select>

                <select id="tradeTypeFilter" style="padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; backdrop-filter: blur(10px);">
                    <option value="">所有类型</option>
                    <option value="LONG">做多</option>
                    <option value="SHORT">做空</option>
                </select>

                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label style="font-size: 0.9rem; opacity: 0.8;">置信度:</label>
                    <input type="number" id="confidenceMinInput" placeholder="最小"
                           style="width: 60px; padding: 0.5rem; border-radius: 5px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white;">
                    <span>-</span>
                    <input type="number" id="confidenceMaxInput" placeholder="最大"
                           style="width: 60px; padding: 0.5rem; border-radius: 5px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white;">
                </div>

                <button onclick="searchTrades()" class="btn btn-primary" style="align-self: end;">
                    <i class="fas fa-search"></i> 搜索
                </button>

                <button onclick="clearFilters()" class="btn" style="align-self: end; background: rgba(255,255,255,0.2); color: white;">
                    <i class="fas fa-times"></i> 清除
                </button>
            </div>
        </div>

        <!-- 最近交易记录 -->
        <div class="chart-container">
            <div class="chart-title">
                <i class="fas fa-history"></i> 交易记录结果
            </div>
            <div id="searchResultsInfo" style="margin-bottom: 1rem; opacity: 0.8; font-size: 0.9rem;"></div>
            <table class="trades-table" id="tradesTable">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>方向</th>
                        <th>类型</th>
                        <th>入场原因</th>
                        <th>开仓价</th>
                        <th>平仓价</th>
                        <th>盈亏</th>
                        <th>结果</th>
                    </tr>
                </thead>
                <tbody id="tradesBody">
                    <!-- 交易记录将在这里动态加载 -->
                </tbody>
            </table>
            <div id="noResultsMessage" style="text-align: center; padding: 2rem; opacity: 0.7; display: none;">
                <i class="fas fa-info-circle"></i> 暂无符合条件的交易记录
            </div>
        </div>

        <!-- 操作按钮 -->
        <!-- 预测成功烟花容器 -->
        <div id="fireworkContainer" style="display: none;"></div>

        <div style="text-align: center; margin-top: 2rem;">
            <button class="btn btn-primary" onclick="location.href='/subscription'">
                <i class="fas fa-crown"></i> 升级订阅套餐
            </button>
            <button class="btn btn-danger" onclick="resetData()" style="margin-left: 1rem;">
                <i class="fas fa-trash"></i> 清空数据
            </button>
        </div>
    </div>

    <script src="prediction-service.js"></script>

    <script>
        class DashboardService {
            constructor() {
                this.token = localStorage.getItem('authToken');
                this.predictionService = new PredictionService();
                this.init();
            }

            init() {
                this.loadStats();
                this.setupRealtimeUpdates();
                this.checkSubscriptionStatus();
            }

            async loadStats() {
                try {
                    const response = await fetch('/api/stats', {
                        headers: {
                            ...(this.token && { 'Authorization': `Bearer ${this.token}` }),
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) {
                        throw new Error('获取统计数据失败');
                    }

                    const data = await response.json();

                    // 更新UI
                    this.updateStats(data);
                    this.updateSubscriptionInfo(data.subscription);

                } catch (error) {
                    console.error('加载统计数据错误:', error);
                    this.showError('无法加载统计数据');
                }
            }

            updateStats(data) {
                // 更新资金
                document.getElementById('currentBalance').textContent =
                    `${data.currentBalance?.toFixed(2) || '--'} U`;

                // 更新胜率
                document.getElementById('winRate').textContent =
                    `${data.winRate || '--'}%`;
                document.getElementById('winRateDetails').textContent =
                    `正确 ${data.correctTrades || 0} / 总计 ${data.totalTrades || 0}`;

                // 更新交易次数
                document.getElementById('totalTrades').textContent =
                    data.totalTrades || '--';

                // 更新最近交易
                document.getElementById('recentTrades').textContent =
                    `最近: ${data.recentTrades?.length || 0} 笔`;

                // 更新价格（如果有）
                if (data.currentPrice) {
                    document.getElementById('currentPrice').textContent =
                        `$${data.currentPrice.toLocaleString()}`;
                }

                // 更新图表
                this.renderBalanceChart(data.balanceHistory || []);
            }

            updateSubscriptionInfo(subscription) {
                const card = document.getElementById('subscriptionCard');
                card.innerHTML = '';

                if (!subscription || !subscription.hasActiveSubscription) {
                    let versionText = '基础版本';
                    let description = '升级到高级版解锁更多功能';

                    if (subscription && subscription.guestMode) {
                        versionText = '访客模式';
                        description = '登录后体验完整功能';
                    }

                    card.className = 'subscription-card';
                    card.innerHTML = `
                        <div style="text-align: center;">
                            <i class="fas fa-crown" style="font-size: 2rem; color: rgba(255,255,255,0.7); margin-bottom: 0.5rem;"></i>
                            <div style="font-size: 1rem; margin-bottom: 0.5rem;">${versionText}</div>
                            <div style="font-size: 0.9rem; opacity: 0.8;">${description}</div>
                            ${subscription?.guestMode ? '<button onclick="login()" style="margin-top: 1rem; padding: 0.5rem 1rem; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">立即登录</button>' : ''}
                        </div>
                    `;
                    return;
                }

                let timeLeftText = '';
                let timeClass = '';

                if (subscription.isExpired) {
                    timeLeftText = '已过期';
                    timeClass = 'time-critical';
                } else if (subscription.timeLeft <= 3) {
                    timeLeftText = `${subscription.timeLeft} 天`;
                    timeClass = 'time-critical';
                } else if (subscription.timeLeft <= 7) {
                    timeLeftText = `${subscription.timeLeft} 天`;
                    timeClass = 'time-warning';
                } else {
                    timeLeftText = `${subscription.timeLeft} 天`;
                    timeClass = '';
                }

                card.className = `subscription-card subscription-${subscription.isExpired ? 'expired' : 'active'}`;

                card.innerHTML = `
                    <div style="text-align: center;">
                        <i class="fas fa-crown" style="font-size: 2rem; color: #4CAF50; margin-bottom: 0.5rem;"></i>
                        <div style="font-size: 1rem; margin-bottom: 0.5rem;">高级版本</div>
                        <div class="subscription-time">
                            到期时间: <strong>${new Date(subscription.endDate).toLocaleDateString()}</strong>
                        </div>
                        <div class="time-left ${timeClass}">
                            剩余: ${timeLeftText}
                        </div>
                    </div>
                `;

                // 如果即将过期，显示警告
                if (subscription.timeLeft <= 7 && !subscription.isExpired) {
                    this.showExpirationWarning(subscription.timeLeft);
                }

                // 如果已过期，限制访问
                if (subscription.isExpired) {
                    this.showExpiredAlert();
                }
            }

            showExpirationWarning(daysLeft) {
                const alertDiv = document.getElementById('warningAlert');
                alertDiv.style.display = 'block';
                alertDiv.className = 'alert alert-warning';

                if (daysLeft === 0) {
                    alertDiv.innerHTML = `
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>订阅今日到期！</strong>
                        <p>请立即续费以避免服务中断。</p>
                        <button onclick="location.href='/subscription'" class="btn btn-primary" style="margin-top: 1rem;">
                            <i class="fas fa-crown"></i> 立即续费
                        </button>
                    `;
                } else {
                    alertDiv.innerHTML = `
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>订阅将在 ${daysLeft} 天后到期</strong>
                        <p>请及时续费以继续享受高级功能。</p>
                        <button onclick="location.href='/subscription'" class="btn btn-primary" style="margin-top: 1rem;">
                            <i class="fas fa-crown"></i> 续费订阅
                        </button>
                    `;
                }
            }

            showExpiredAlert() {
                const alertDiv = document.getElementById('warningAlert');
                alertDiv.style.display = 'block';
                alertDiv.className = 'alert alert-danger';
                alertDiv.innerHTML = `
                    <i class="fas fa-exclamation-circle"></i>
                    <strong>订阅已过期</strong>
                    <p>您的订阅套餐已过期，部分功能可能受限。</p>
                    <button onclick="location.href='/subscription'" class="btn btn-primary" style="margin-top: 1rem;">
                        <i class="fas fa-crown"></i> 重新订阅
                    </button>
                `;

                // 禁用一些高级功能
                this.disablePremiumFeatures();
            }

            disablePremiumFeatures() {
                // 可以添加更多的限制逻辑
                console.log('部分功能已因订阅过期而被限制');
            }

            checkSubscriptionStatus() {
                // 检查是否有活跃的订阅
                if (this.token) {
                    // 用户已登录，订阅信息会在loadStats中处理
                }
            }

            setupRealtimeUpdates() {
                // 每10秒更新一次统计
                setInterval(() => {
                    this.loadStats();
                }, 10000);

                // 每30秒检查一次订阅状态
                setInterval(() => {
                    this.checkSubscriptionStatus();
                }, 30000);
            }

            renderBalanceChart(history) {
                const chartContainer = document.getElementById('balanceChart');

                if (!history || history.length === 0) {
                    chartContainer.innerHTML = '<div style="text-align: center; padding: 2rem; opacity: 0.7;">暂无数据</div>';
                    return;
                }

                // 简单的文本图表展示
                let chartHtml = '<div style="display: flex; flex-direction: column; height: 250px; overflow-y: auto;">';

                history.forEach((point, index) => {
                    const balance = point.balance || 0;
                    const time = new Date(point.time).toLocaleTimeString();

                    chartHtml += `
                        <div style="display: flex; justify-content: space-between; padding: 0.3rem 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.1);">
                            <span style="opacity: 0.8; font-size: 0.9rem;">${time}</span>
                            <span style="font-weight: bold; color: ${balance >= 100 ? '#4CAF50' : '#f44336'};">${balance.toFixed(2)} U</span>
                        </div>
                    `;
                });

                chartHtml += '</div>';
                chartContainer.innerHTML = chartHtml;
            }

            async loadRecentTrades() {
                try {
                    const response = await fetch('/api/recent-trades', {
                        headers: {
                            ...(this.token && { 'Authorization': `Bearer ${this.token}` }),
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) {
                        throw new Error('获取交易记录失败');
                    }

                    const trades = await response.json();

                    this.displayTrades(trades.slice(0, 10));
                    this.updateSearchResultsInfo(trades.length, 'recent');

                } catch (error) {
                    console.error('加载交易记录错误:', error);
                    this.showError('无法加载交易记录');
                }
            }

            async searchTrades() {
                try {
                    const reasoningKeyword = document.getElementById('reasoningKeywordInput').value.trim();
                    const signal = document.getElementById('signalFilter').value;
                    const tradeType = document.getElementById('tradeTypeFilter').value;
                    const confidenceMin = document.getElementById('confidenceMinInput').value;
                    const confidenceMax = document.getElementById('confidenceMaxInput').value;

                    const params = new URLSearchParams();
                    if (reasoningKeyword) params.append('reasoningKeyword', reasoningKeyword);
                    if (signal) params.append('signal', signal);
                    if (tradeType) params.append('tradeType', tradeType);
                    if (confidenceMin) params.append('confidenceMin', confidenceMin);
                    if (confidenceMax) params.append('confidenceMax', confidenceMax);

                    const response = await fetch(`/api/trades/search?${params.toString()}`, {
                        headers: {
                            ...(this.token && { 'Authorization': `Bearer ${this.token}` }),
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) {
                        throw new Error('搜索交易记录失败');
                    }

                    const result = await response.json();

                    if (result.success) {
                        this.displayTrades(result.data);
                        this.updateSearchResultsInfo(result.count, 'search', reasoningKeyword || '条件筛选');
                    } else {
                        throw new Error(result.error || '搜索失败');
                    }

                } catch (error) {
                    console.error('搜索交易记录错误:', error);
                    this.showError('搜索交易记录失败');
                }
            }

            clearFilters() {
                document.getElementById('reasoningKeywordInput').value = '';
                document.getElementById('signalFilter').value = '';
                document.getElementById('tradeTypeFilter').value = '';
                document.getElementById('confidenceMinInput').value = '';
                document.getElementById('confidenceMaxInput').value = '';

                // 重新加载最近交易
                this.loadRecentTrades();
            }

            displayTrades(trades) {
                const tbody = document.getElementById('tradesBody');
                const noResultsMessage = document.getElementById('noResultsMessage');

                if (trades.length === 0) {
                    tbody.innerHTML = '';
                    noResultsMessage.style.display = 'block';
                    return;
                }

                noResultsMessage.style.display = 'none';

                tbody.innerHTML = '';

                trades.forEach(trade => {
                    const profitLoss = trade.profitLoss || 0;
                    const resultClass = profitLoss > 0 ? 'positive' : profitLoss < 0 ? 'negative' : '';
                    const resultText = profitLoss > 0 ? '盈利' : profitLoss < 0 ? '亏损' : '持平';

                    // 格式化入场原因，如果存在的话
                    let reasoningHtml = '';
                    if (trade.reasoning && trade.reasoning.length > 0) {
                        reasoningHtml = trade.reasoning.map(r =>
                            `<div style="font-size: 0.85rem; opacity: 0.9; margin-bottom: 0.2rem;">• ${r}</div>`
                        ).join('');
                    } else {
                        reasoningHtml = '<span style="opacity: 0.6;">--</span>';
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td>${new Date(trade.timestamp).toLocaleString()}</td>
                            <td>${this.formatSignal(trade.signal)}</td>
                            <td>${trade.tradeType || '--'}</td>
                            <td><div style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${reasoningHtml}</div></td>
                            <td>$${trade.price?.toFixed(2) || '--'}</td>
                            <td>$${trade.closePrice?.toFixed(2) || '--'}</td>
                            <td class="${resultClass}">${profitLoss > 0 ? '+' : ''}${profitLoss?.toFixed(2) || '--'} U</td>
                            <td>${resultText}</td>
                        </tr>
                    `;
                });
            }

            formatSignal(signal) {
                return signal === 'BUY' ? '买入' : signal === 'SELL' ? '卖出' : signal;
            }

            updateSearchResultsInfo(count, type, keyword = '') {
                const infoDiv = document.getElementById('searchResultsInfo');
                if (!infoDiv) return;

                if (type === 'search') {
                    const message = `找到 ${count} 条交易记录`;
                    if (keyword) {
                        infoDiv.innerHTML = `<i class="fas fa-search"></i> ${message} - 关键词: "${keyword}"`;
                    } else {
                        infoDiv.innerHTML = `<i class="fas fa-filter"></i> ${message}`;
                    }
                } else {
                    infoDiv.innerHTML = `<i class="fas fa-history"></i> 显示最新的 ${count} 条交易记录`;
                }
            }

            showError(message) {
                const alertDiv = document.getElementById('warningAlert');
                alertDiv.style.display = 'block';
                alertDiv.className = 'alert alert-danger';
                alertDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
            }
        }

        // 全局函数
        function login() {
            window.location.href = '/subscription';
        }

        function resetData() {
            if (confirm('确定要清空所有数据吗？此操作不可撤销！')) {
                fetch('/api/reset-data', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('authToken')}`,
                        'Content-Type': 'application/json'
                    }
                }).then(response => {
                    if (response.ok) {
                        alert('数据已清空');
                        location.reload();
                    } else {
                        alert('清空数据失败');
                    }
                });
            }
        }

        // 初始化仪表板
        const dashboardService = new DashboardService();

        // 定期加载交易记录
        setInterval(() => {
            dashboardService.loadRecentTrades();
        }, 30000);

        // 页面加载完成后加载交易记录
        document.addEventListener('DOMContentLoaded', () => {
            dashboardService.loadRecentTrades();
        });

        // 为搜索按钮添加事件监听器
        document.addEventListener('DOMContentLoaded', () => {
            const searchButton = document.querySelector('button[onclick="searchTrades()"]');
            if (searchButton) {
                searchButton.addEventListener('click', function() {
                    dashboardService.searchTrades();
                });
            }

            const clearButton = document.querySelector('button[onclick="clearFilters()"]');
            if (clearButton) {
                clearButton.addEventListener('click', function() {
                    dashboardService.clearFilters();
                });
            }
        });
    </script>
</body>
</html>
