<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC Oracle</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .header {
      background: rgba(10, 10, 26, 0.8);
      padding: 0;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const formatAmountU = (amount) => {
      const value = Number(amount) || 0;
      if (Math.abs(value) >= 10000) {
        return parseFloat((value / 1000).toFixed(2)) + 'KU';
      }
      return parseFloat(value.toFixed(2)) + 'U';
    };


    const CalendarStats = ({ trades, onQueryRange }) => {
      const [currentMonth, setCurrentMonth] = useState(new Date());

      const calculateDailyStats = () => {
        const stats = {};
        trades.forEach(trade => {
          if (trade.isCorrect !== undefined) {
            const tradeDate = new Date(trade.timestamp);
            const date = `${tradeDate.getFullYear()}-${String(tradeDate.getMonth() + 1).padStart(2, '0')}-${String(tradeDate.getDate()).padStart(2, '0')}`;
            if (!stats[date]) {
              stats[date] = {
                date,
                tradeCount: 0,
                winCount: 0,
                lossCount: 0,
                totalProfitLoss: 0,
                totalInvestment: 0
              };
            }
            stats[date].tradeCount++;
            stats[date].totalInvestment += trade.investmentAmount || 5;
            if (trade.isCorrect) {
              stats[date].winCount++;
            } else {
              stats[date].lossCount++;
            }
            // 使用实际的盈利亏损值
            if (trade.profitLoss !== undefined) {
              stats[date].totalProfitLoss += trade.profitLoss;
            }
            stats[date].winRate = (stats[date].winCount / stats[date].tradeCount) * 100;
          }
        });
        return Object.values(stats);
      };

      const dailyStats = calculateDailyStats();

      const getDaysInMonth = (date) => {
        const year = date.getFullYear();
        const month = date.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startingDayOfWeek = firstDay.getDay();
        const days = [];
        for (let i = 0; i < startingDayOfWeek; i++) {
          days.push(null);
        }
        for (let day = 1; day <= daysInMonth; day++) {
          days.push(new Date(year, month, day));
        }
        return days;
      };

      const getDailyStat = (date) => {
        const dateStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        return dailyStats.find(stat => stat.date === dateStr);
      };

      const getWeekStat = (rowDays) => {
        const validDays = rowDays.filter(Boolean);
        if (!validDays.length) return null;
        const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const startStr = fmt(validDays[0]);
        const endStr = fmt(validDays[validDays.length - 1]);
        let tradeCount = 0;
        let winCount = 0;
        let totalProfitLoss = 0;
        dailyStats.forEach(stat => {
          if (stat.date >= startStr && stat.date <= endStr) {
            tradeCount += stat.tradeCount;
            winCount += stat.winCount;
            totalProfitLoss += stat.totalProfitLoss;
          }
        });
        if (tradeCount === 0) return null;
        return {
          startStr,
          endStr,
          tradeCount,
          winCount,
          totalProfitLoss,
          winRate: (winCount / tradeCount) * 100,
          rangeLabel: `${startStr.slice(5).replace('-', '/')}~${endStr.slice(5).replace('-', '/')}`
        };
      };

      const navigateMonth = (direction) => {
        setCurrentMonth(prev => {
          const newMonth = new Date(prev);
          if (direction === 'prev') {
            newMonth.setMonth(prev.getMonth() - 1);
          } else {
            newMonth.setMonth(prev.getMonth() + 1);
          }
          return newMonth;
        });
      };

      const days = getDaysInMonth(currentMonth);
      const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
      const isViewingCurrentMonth = currentMonth.getFullYear() === new Date().getFullYear() && currentMonth.getMonth() === new Date().getMonth();
      const nowForSpan = new Date();
      const oneYearAgo = new Date(nowForSpan.getFullYear() - 1, nowForSpan.getMonth(), nowForSpan.getDate());
      const oneYearAgoStr = `${oneYearAgo.getFullYear()}-${String(oneYearAgo.getMonth() + 1).padStart(2, '0')}-${String(oneYearAgo.getDate()).padStart(2, '0')}`;
      const earliestDate = dailyStats.length ? dailyStats.reduce((min, s) => s.date < min ? s.date : min, dailyStats[0].date) : null;
      const hasYearSpan = earliestDate !== null && earliestDate < oneYearAgoStr;

      return (
        <>
          <div className="calendar-stats">
            <div className="calendar-header">
              <button
                className="calendar-nav"
                onClick={() => navigateMonth('prev')}
              >
                ←
              </button>
              <h3>{currentMonth.getFullYear()}年{monthNames[currentMonth.getMonth()]}</h3>
              <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                {!isViewingCurrentMonth && (
                  <button
                    className="calendar-today-btn"
                    onClick={() => setCurrentMonth(new Date())}
                  >
                    返回今天
                  </button>
                )}
                <button
                  className="calendar-nav"
                  onClick={() => navigateMonth('next')}
                >
                  →
                </button>
              </div>
            </div>

            <div className="calendar-grid">
              {['日', '一', '二', '三', '四', '五', '六', '周统计'].map(day => (
                <div key={day} className="calendar-day-header">{day}</div>
              ))}

              {(() => {
                const rows = [];
                for (let i = 0; i < days.length; i += 7) rows.push(days.slice(i, i + 7));
                return rows.map((rowDays, rowIdx) => {
                  const weekStat = getWeekStat(rowDays);
                  return (
                    <React.Fragment key={`week-row-${rowIdx}`}>
                      {rowDays.map((day, index) => {
                        if (!day) {
                          return <div key={index} className="calendar-day empty"></div>;
                        }
                        const dayStat = getDailyStat(day);
                        const isToday = day.toDateString() === new Date().toDateString();
                        const dayStr = `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, '0')}-${String(day.getDate()).padStart(2, '0')}`;

                        return (
                          <div
                            key={index}
                            className={`calendar-day ${dayStat ? (dayStat.totalProfitLoss >= 0 ? 'profit-day' : 'loss-day') : 'no-data'}`}
                            style={isToday ? { border: '1px solid #00d4ff' } : undefined}
                            onClick={dayStat ? () => onQueryRange(dayStr, dayStr) : undefined}
                          >
                            <div className="day-number">{day.getDate()}</div>
                            {dayStat && (
                              <>
                                <div className="text-base font-bold" style={{ color: dayStat.totalProfitLoss >= 0 ? '#4CAF50' : '#f44336' }}>
                                  {dayStat.totalProfitLoss >= 0 ? '+' : ''}{formatAmountU(dayStat.totalProfitLoss)}
                                </div>
                                <div className="text-xs text-gray-400">{dayStat.tradeCount}笔·盈{dayStat.winCount}·胜率{dayStat.winRate.toFixed(0)}%</div>
                              </>
                            )}
                          </div>
                        );
                      })}
                      <div
                        className={`calendar-week ${weekStat ? (weekStat.totalProfitLoss >= 0 ? 'profit-day' : 'loss-day') : 'no-data'} ${weekStat ? 'clickable' : ''}`}
                        onClick={weekStat ? () => onQueryRange(weekStat.startStr, weekStat.endStr) : undefined}
                      >
                        {weekStat ? (
                          <>
                            <div className="week-range">{weekStat.rangeLabel}</div>
                            <div className="text-base font-bold" style={{ color: weekStat.totalProfitLoss >= 0 ? '#4CAF50' : '#f44336' }}>
                              {weekStat.totalProfitLoss >= 0 ? '+' : ''}{formatAmountU(weekStat.totalProfitLoss)}
                            </div>
                            <div className="text-xs text-gray-400">{weekStat.tradeCount}笔·盈{weekStat.winCount}·胜率{weekStat.winRate.toFixed(0)}%</div>
                          </>
                        ) : (
                          <div className="week-empty">—</div>
                        )}
                      </div>
                    </React.Fragment>
                  );
                });
              })()}
            </div>

          </div>

          <div className="mt-5">
            {(() => {
              const nowYear = new Date().getFullYear();
              const dataYears = dailyStats.map(stat => new Date(stat.date).getFullYear());
              const earliestYear = dataYears.length ? Math.min(...dataYears) : nowYear;
              const yearsList = Array.from({ length: nowYear - earliestYear + 1 }, (_, i) => earliestYear + i);

              const year = currentMonth.getFullYear();
              const monthsOfYear = Array.from({ length: 12 }, (_, i) =>
                dailyStats.filter(stat => {
                  const d = new Date(stat.date);
                  return d.getFullYear() === year && d.getMonth() === i;
                })
              );

              const aggregate = (list) => {
                const tradeCount = list.reduce((sum, s) => sum + s.tradeCount, 0);
                const winCount = list.reduce((sum, s) => sum + s.winCount, 0);
                const totalProfitLoss = list.reduce((sum, s) => sum + s.totalProfitLoss, 0);
                return {
                  tradeCount,
                  winCount,
                  totalProfitLoss,
                  winRate: tradeCount > 0 ? (winCount / tradeCount) * 100 : 0
                };
              };

              return (
                <>
                  <div className="calendar-stats">
                    <div className="grid grid-cols-7 gap-2">
                      {monthsOfYear.map((list, i) => {
                        const agg = aggregate(list);
                        const positive = agg.totalProfitLoss >= 0;
                        const isSelectedMonth = i === currentMonth.getMonth();
                        return (
                          <React.Fragment key={i}>
                            <div
                              className={`calendar-day ${list.length > 0 ? (positive ? 'profit-day' : 'loss-day') : ''}`}
                              style={isSelectedMonth ? { border: '1px solid #00d4ff', boxShadow: '0 0 10px rgba(0, 212, 255, 0.4)' } : undefined}
                              onClick={() => setCurrentMonth(new Date(year, i, 1))}
                            >
                              <div className="day-number">{i + 1}月</div>
                              {list.length > 0 && (
                                <>
                                  <div className="text-base font-bold" style={{ color: positive ? '#4CAF50' : '#f44336' }}>
                                    {positive ? '+' : ''}{formatAmountU(agg.totalProfitLoss)}
                                  </div>
                                  <div className="text-xs text-gray-400">{agg.tradeCount}笔·盈{agg.winCount}·胜率{agg.winRate.toFixed(0)}%</div>
                                </>
                              )}
                            </div>
                            {(i + 1) % 6 === 0 && (() => {
                              const rowStats = monthsOfYear.slice(i - 5, i + 1).flat();
                              const rowAgg = aggregate(rowStats);
                              const rowPositive = rowAgg.totalProfitLoss >= 0;
                              const rowStartStr = `${year}-${String(i - 4).padStart(2, '0')}-01`;
                              const rowEndDay = new Date(year, i + 1, 0);
                              const rowEndStr = `${year}-${String(i + 1).padStart(2, '0')}-${String(rowEndDay.getDate()).padStart(2, '0')}`;
                              return (
                                <div
                                  className={`calendar-week ${rowStats.length > 0 ? (rowPositive ? 'profit-day' : 'loss-day') : 'no-data'} ${rowStats.length > 0 ? 'clickable' : ''}`}
                                  onClick={rowStats.length > 0 ? () => onQueryRange(rowStartStr, rowEndStr) : undefined}
                                >
                                  <div className="week-range">{i - 4}-{i + 1}月</div>
                                  {rowStats.length > 0 ? (
                                    <>
                                      <div className="text-base font-bold" style={{ color: rowPositive ? '#4CAF50' : '#f44336' }}>
                                        {rowPositive ? '+' : ''}{formatAmountU(rowAgg.totalProfitLoss)}
                                      </div>
                                      <div className="text-xs text-gray-400">{rowAgg.tradeCount}笔·盈{rowAgg.winCount}·胜率{rowAgg.winRate.toFixed(0)}%</div>
                                    </>
                                  ) : (
                                    <div className="week-empty">—</div>
                                  )}
                                </div>
                              );
                            })()}
                          </React.Fragment>
                        );
                      })}
                    </div>
                  </div>
                  <div className="calendar-stats mt-5">
                    <div className="grid grid-cols-6 gap-2">
                      {yearsList.map((y) => {
                        const yearStats = dailyStats.filter(stat => new Date(stat.date).getFullYear() === y);
                        const agg = aggregate(yearStats);
                        const positive = agg.totalProfitLoss >= 0;
                        const isSelectedYear = y === currentMonth.getFullYear();
                        return (
                          <div
                            key={y}
                            className={`calendar-day ${yearStats.length > 0 ? (positive ? 'profit-day' : 'loss-day') : ''}`}
                            style={isSelectedYear ? { border: '1px solid #00d4ff', boxShadow: '0 0 10px rgba(0, 212, 255, 0.4)' } : undefined}
                            onClick={() => setCurrentMonth(new Date(y, currentMonth.getMonth(), 1))}
                          >
                            <div className="day-number">{y}年</div>
                            {yearStats.length > 0 && (
                              <>
                                <div className="text-base font-bold" style={{ color: positive ? '#4CAF50' : '#f44336' }}>
                                  {positive ? '+' : ''}{formatAmountU(agg.totalProfitLoss)}
                                </div>
                                <div className="text-xs text-gray-400">{agg.tradeCount}笔·盈{agg.winCount}·胜率{agg.winRate.toFixed(0)}%</div>
                              </>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </>
              );
            })()}
          </div>
        </>
      );
    };

    const AuthModal = ({ isOpen, onClose, mode, onModeToggle }) => {
      const [formData, setFormData] = useState({ username: '', email: '', password: '' });
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      if (!isOpen) return null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        try {
          const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData),
          });

          const data = await response.json();

          if (response.ok) {
            // Store token and user data
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            window.location.reload(); // Refresh to update dashboard
          } else {
            setError(data.message || 'Authentication failed');
          }
        } catch (err) {
          setError('Network error. Please try again.');
        } finally {
          setLoading(false);
        }
      };

      const handleChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };

      return (
        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
          <div className="bg-gradient-to-br from-slate-800/95 to-slate-900/95 p-8 rounded-2xl w-full max-w-md mx-4 border border-cyan-500/20 backdrop-blur-xl">
            <div className="text-center mb-6">
              <h2 className="text-2xl font-light text-cyan-300 tracking-wider">
                {mode === 'login' ? '登录账户' : '创建账户'}
              </h2>
              <p className="text-gray-400 text-sm mt-2">
                {mode === 'login' ? '欢迎回到 BTC Oracle' : '开始您的智能交易之旅'}
              </p>
            </div>

            {error && (
              <div className="bg-red-500/10 border border-red-500/20 text-red-400 px-4 py-3 rounded-lg mb-4 text-sm">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <input
                  type="text"
                  name="username"
                  placeholder="用户名"
                  value={formData.username}
                  onChange={handleChange}
                  className="form-control w-full px-4 py-3 text-white"
                  required
                />
              </div>

              {mode === 'register' && (
                <div>
                  <input
                    type="email"
                    name="email"
                    placeholder="邮箱地址"
                    value={formData.email}
                    onChange={handleChange}
                    className="form-control w-full px-4 py-3 text-white"
                    required
                  />
                </div>
              )}

              <div>
                <input
                  type="password"
                  name="password"
                  placeholder="密码"
                  value={formData.password}
                  onChange={handleChange}
                  className="form-control w-full px-4 py-3 text-white"
                  required
                />
              </div>

              <div className="flex gap-3 pt-4">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-gray-300 hover:bg-white/10 transition-all duration-200"
                >
                  取消
                </button>
                <button
                  type="submit"
                  disabled={loading}
                  className="flex-1 px-4 py-3 bg-gradient-to-r from-cyan-500 to-blue-500 rounded-lg text-white font-medium hover:shadow-lg hover:shadow-cyan-500/25 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  {loading ? '处理中...' : (mode === 'login' ? '登录' : '注册')}
                </button>
              </div>
            </form>

            <div className="text-center mt-6">
              <button
                onClick={onModeToggle}
                className="text-cyan-400 hover:text-cyan-300 text-sm transition-colors duration-200"
              >
                {mode === 'login' ? '还没有账户？立即注册' : '已有账户？立即登录'}
              </button>
            </div>
          </div>
        </div>
      );
    };

    const Dashboard = () => {
      const [currentSignal, setCurrentSignal] = useState(null);
      const [stats, setStats] = useState(null);
      const [recentTrades, setRecentTrades] = useState([]);
      const [allTrades, setAllTrades] = useState([]); // 所有交易数据，用于日历统计
      const [currentBalance, setCurrentBalance] = useState(100); // 初始资金100U
      const initialBalance = 100; // 初始资金常量
      const [balanceHistory, setBalanceHistory] = useState([]);
      const [isConnected, setIsConnected] = useState(false);
      const [activeView, setActiveView] = useState('dashboard');
      const [tradesQueryRange, setTradesQueryRange] = useState(null); // 日历周统计跳转携带的时间范围
      const [chartTrade, setChartTrade] = useState(null);
      const [user, setUser] = useState(null);
      const [subscription, setSubscription] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const confettiTriggeredTradesRef = React.useRef(new Set()); // 使用useRef存储已触发散花的交易ID，避免组件重渲染时丢失
      const pageLoadTimeRef = React.useRef(Date.now()); // 记录页面加载时刻，仅对加载后结算的交易触发散花
      useEffect(() => {
        // 检查用户登录状态
        const token = localStorage.getItem('token');
        const userData = localStorage.getItem('user');

        if (token && userData) {
          setUser(JSON.parse(userData));
        } else {
          setShowAuthModal(true);
          return;
        }

        // 连接WebSocket（同源，生产环境自动使用当前域名）
        const socket = io({
          auth: { token }
        });

        // 语音播报工具（浏览器原生 Web Speech API，零依赖）
        const speak = (text) => {
          try {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              const utter = new SpeechSynthesisUtterance(text);
              utter.lang = 'zh-CN';
              utter.rate = 1.1;
              // Chrome下cancel后立即speak可能被吞掉，延迟一拍确保播报生效
              setTimeout(() => window.speechSynthesis.speak(utter), 60);
            }
          } catch (e) {
            console.warn('语音播报失败:', e);
          }
        };

        // Chrome要求用户先与页面交互才允许语音合成，首次点击时播一条静音内容解锁
        const primeSpeech = () => {
          try {
            if ('speechSynthesis' in window) {
              const utter = new SpeechSynthesisUtterance(' ');
              utter.volume = 0;
              window.speechSynthesis.speak(utter);
            }
          } catch (e) { /* 忽略 */ }
          document.removeEventListener('click', primeSpeech);
        };
        document.addEventListener('click', primeSpeech);

        socket.on('connect', () => {
          setIsConnected(true);
          console.log('已连接到服务器');
        });

        socket.on('disconnect', () => {
          setIsConnected(false);
          console.log('与服务器断开连接');
        });

        socket.on('tradingSignal', (signal) => {
          setCurrentSignal(signal);
          // 语音播报新信号（修复原三元优先级问题：BUY分支漏拼价格文案）
          speak((signal.signal === 'BUY' ? '做多信号' : '做空信号') + '，价格' + signal.currentPrice.toFixed(0));
        });

        // 持仓结束（平仓）时清除当前信号
        socket.on('signalClear', () => {
          setCurrentSignal(null);
        });

        // 订单结算语音播报
        socket.on('tradeClosed', (result) => {
          const direction = result.tradeType === 'LONG' ? '做多' : '做空';
          const isProfit = result.profitLoss >= 0;
          const action = isProfit ? '到账' : '亏损';
          const amount = formatAmountU(Math.abs(result.profitLoss));
          speak(`您的${direction}订单${action} ${amount}`);
        });

        socket.on('balanceUpdate', (data) => {
          console.log('收到资金更新:', data.balance);
          setCurrentBalance(data.balance);
          setBalanceHistory(prev => {
            // 确保始终包含初始资金点
            let newHistory;

            if (prev.length === 0) {
              // 如果历史为空，创建初始资金点
              newHistory = [{
                time: new Date(Date.now() - 10 * 60 * 1000).toISOString(), // 10分钟前作为起点
                balance: 100
              }];
            } else {
              // 直接使用prev，保留所有历史数据
              newHistory = [...prev];
            }

            // 添加新的资金点
            newHistory.push({
              time: data.timestamp,
              balance: data.balance
            });

            return newHistory;
          });
        });

        socket.on('statsUpdate', (newStats) => {
          setStats(newStats);
        });

        socket.on('tradesUpdate', (trades) => {
          // 检查是否有新的预测正确的交易，且尚未触发过散花效果
          // 仅当平仓时间晚于页面加载时刻才触发，避免刷新页面时历史交易重复弹散花
          const newCorrectTrades = trades.filter(trade =>
            trade.isCorrect === true &&
            trade.closeTime &&

        if (!svg) return;

            y = maxBalance > minBalance ?

          const pointX = (x / 100) * rect.width;
          const pointY = (y / 100) * rect.height;

          const distance = Math.sqrt(
            Math.pow(mouseX - pointX, 2) +
            Math.pow(mouseY - pointY, 2)
          );

        }).format(amount);
      };
      const containerRef = React.useRef(null);
      const [chartError, setChartError] = useState('');

      useEffect(() => {
        let chart = null;
        let disposed = false;
        const onResize = () => { if (chart && containerRef.current) chart.applyOptions({ width: containerRef.current.clientWidth }); };

        const init = async () => {
          try {
            if (typeof LightweightCharts === 'undefined') { setChartError('图表库加载失败，请检查网络后刷新'); return; }
            const entryMs = new Date(trade.timestamp).getTime();
            const exitMs = trade.closeTime ? new Date(trade.closeTime).getTime() : entryMs + 600000;
            const res = await fetch(`/api/klines?interval=5m&start=${entryMs - 220 * 300000}&end=${Math.min(exitMs + 7200000, Date.now() + 600000)}&limit=300`);
            const data = await res.json();
            if (disposed || !containerRef.current) return;
            const candles = (data.klines || []).map(k => ({
              time: Math.floor(k.openTime / 1000),
              open: +k.open, high: +k.high, low: +k.low, close: +k.close
            }));
            if (!candles.length) { setChartError('暂无K线数据'); return; }
            const ema = (period) => {
              const closes = candles.map(c => c.close);
              if (closes.length < period) return [];
              const k = 2 / (period + 1);
              let sum = 0;
              for (let i = 0; i < period; i++) sum += closes[i];
              let prev = sum / period;
              const out = [{ time: candles[period - 1].time, value: prev }];
              for (let i = period; i < closes.length; i++) {
                prev = closes[i] * k + prev * (1 - k);
                out.push({ time: candles[i].time, value: prev });
              }
              return out;
            };
            const ema50Data = ema(50);
            const ema200Data = ema(200);
            const entryTime = Math.floor(new Date(trade.timestamp).getTime() / 1000);
            const exitTime = trade.closeTime ? Math.floor(new Date(trade.closeTime).getTime() / 1000) : null;
            const findBar = (t) => {
              const hit = candles.find(c => c.time <= t && t < c.time + 300);
              return hit ? hit.time : null;
            };
            const entryBar = findBar(entryTime);
            const exitBar = exitTime ? findBar(exitTime) : null;
            const priceLines = [{
              price: Number(trade.price),
              color: trade.tradeType === 'LONG' ? '#4CAF50' : '#f44336',
              lineWidth: 2,
              lineStyle: LightweightCharts.LineStyle.Solid,
              axisLabelVisible: true,
              title: (trade.tradeType === 'LONG' ? '开多 ' : '开空 ') + Number(trade.price).toFixed(0)
            }];
            if (exitTime && trade.closePrice) {
              priceLines.push({
                price: Number(trade.closePrice),
                color: (trade.profitLoss || 0) >= 0 ? '#4CAF50' : '#f44336',
                lineWidth: 2,
                lineStyle: LightweightCharts.LineStyle.Dashed,
                axisLabelVisible: true,
                title: '平 ' + Number(trade.closePrice).toFixed(0) + (trade.profitLoss != null ? ` ${trade.profitLoss >= 0 ? '+' : ''}${formatAmountU(trade.profitLoss)}` : '')
              });
            }
            chart = LightweightCharts.createChart(containerRef.current, {
              width: containerRef.current.clientWidth,
              height: 400,
              layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#d1d4dc' },
              grid: { vertLines: { color: 'rgba(42,46,57,0.4)' }, horzLines: { color: 'rgba(42,46,57,0.4)' } },
              localization: {
                timeFormatter: (t) => {
                  const d = new Date((t + 8 * 3600) * 1000);
                  return d.toISOString().slice(5, 16).replace('T', ' ');
                }
              },
              timeScale: {
                timeVisible: true,
                secondsVisible: false,
                tickMarkFormatter: (t) => {
                  const d = new Date((t + 8 * 3600) * 1000);
                  const iso = d.toISOString();
                  const hm = iso.slice(11, 16);
                  return hm === '00:00' ? iso.slice(5, 10).replace('-', '/') : hm;
                }
              }
            });
            const series = chart.addCandlestickSeries({
              upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
              wickUpColor: '#26a69a', wickDownColor: '#ef5350',
              priceLineVisible: false
            });
            series.setData(candles);
            const ema50Series = chart.addLineSeries({ color: '#f0b90b', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
            ema50Series.setData(ema50Data);
            const ema200Series = chart.addLineSeries({ color: '#a855f7', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
            ema200Series.setData(ema200Data);
            priceLines.forEach(pl => series.createPriceLine(pl));
            if (exitTime && trade.closePrice) {
              const conn = chart.addLineSeries({
                color: (trade.profitLoss || 0) >= 0 ? 'rgba(76,175,80,0.45)' : 'rgba(244,67,54,0.45)',
                lineWidth: 1,
                lineStyle: LightweightCharts.LineStyle.Dotted,
                priceLineVisible: false,
                lastValueVisible: false,
                crosshairMarkerVisible: false
              });
              conn.setData([{ time: entryTime, value: Number(trade.price) }, { time: exitTime, value: Number(trade.closePrice) }]);
            }
            const barSec = 300;
            const hasExit = !!(exitTime && trade.closePrice);
            const t1 = entryBar != null ? entryBar : entryTime;
            const t2 = hasExit ? (exitBar != null ? exitBar : exitTime) : null;
            const mid = t2 != null ? (t1 + t2) / 2 : t1;
            const half = t2 != null ? Math.max((t2 - t1) / 2, 8 * barSec) + 4 * barSec : 12 * barSec;
            const viewFrom = Math.max(candles[0].time, Math.round(mid - half));
            const viewTo = Math.min(candles[candles.length - 1].time + barSec - 1, Math.round(mid + half));
            requestAnimationFrame(() => { if (!disposed && chart) chart.timeScale().setVisibleRange({ from: viewFrom, to: viewTo }); });
            series.setMarkers([
              {
                time: entryBar != null ? entryBar : entryTime,
                position: trade.tradeType === 'LONG' ? 'belowBar' : 'aboveBar',
                color: trade.tradeType === 'LONG' ? '#4CAF50' : '#f44336',
                shape: trade.tradeType === 'LONG' ? 'arrowUp' : 'arrowDown',
                text: '开'
              },
              ...(hasExit ? [{
                time: exitBar != null ? exitBar : exitTime,
                position: trade.tradeType === 'LONG' ? 'aboveBar' : 'belowBar',
                color: (trade.profitLoss || 0) >= 0 ? '#4CAF50' : '#f44336',
                shape: 'circle',
                text: '平'
              }] : [])
            ]);
            window.addEventListener('resize', onResize);
          } catch (err) {
            if (!disposed) setChartError('K线数据加载失败: ' + (err.message || err));
          }
        };
        init();
        return () => {
          disposed = true;
          window.removeEventListener('resize', onResize);
          if (chart) { chart.remove(); chart = null; }
        };
      }, [trade]);

      const pnl = trade.profitLoss;
      return (
        <div onClick={onClose} style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.75)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px' }}>
          <div onClick={(e) => e.stopPropagation()} className="panel" style={{ width: '100%', maxWidth: '760px', maxHeight: '90vh', overflowY: 'auto', position: 'relative' }}>
            <button onClick={onClose} style={{ position: 'absolute', top: '10px', right: '14px', background: 'none', border: 'none', color: '#9aa4b2', fontSize: '22px', cursor: 'pointer' }}>×</button>
            <h3 style={{ paddingRight: '36px', display: 'flex', alignItems: 'center', gap: '10px' }}>
              <span>单笔交易复盘</span>
              <span style={{ padding: '4px 10px', borderRadius: '12px', fontSize: '13px', fontWeight: 600, backgroundColor: trade.tradeType === 'LONG' ? 'rgba(76, 175, 80, 0.2)' : 'rgba(244, 67, 54, 0.2)', color: trade.tradeType === 'LONG' ? '#4CAF50' : '#f44336' }}>
                {trade.tradeType === 'LONG' ? '做多' : '做空'}
              </span>
            </h3>
            <div style={{ display: 'flex', gap: '18px', flexWrap: 'wrap', marginBottom: '10px', fontSize: '14px', justifyContent: 'flex-start', alignItems: 'center', textAlign: 'left' }}>
              <span>开仓: <b>{formatCurrency(trade.price)}</b> <span style={{ color: '#9aa4b2', fontSize: '12px' }}>{new Date(trade.timestamp).toLocaleString('zh-CN')}</span></span>
              <span>平仓: <b>{trade.closePrice ? formatCurrency(trade.closePrice) : '持仓中'}</b> <span style={{ color: '#9aa4b2', fontSize: '12px' }}>{trade.closeTime ? new Date(trade.closeTime).toLocaleString('zh-CN') : ''}</span></span>
              <span>盈亏: <b style={{ color: pnl != null && pnl >= 0 ? '#4CAF50' : '#f44336' }}>{pnl != null ? `${pnl > 0 ? '+' : ''}${formatAmountU(pnl)}` : '-'}</b></span>
              <span>持仓: <b>{trade.holdDuration ? trade.holdDuration + ' 分钟' : '-'}</b></span>
            </div>
            {chartError ? (
              <div style={{ color: '#ef5350', padding: '30px 0' }}>{chartError}</div>
            ) : (
              <div style={{ position: 'relative' }}>
                <div ref={containerRef} style={{ width: '100%', height: '400px' }}></div>
                <div style={{ position: 'absolute', top: '8px', left: '10px', zIndex: 10, pointerEvents: 'none', display: 'flex', gap: '14px', flexWrap: 'wrap', fontSize: '12px', color: '#9aa4b2', textShadow: '0 1px 2px rgba(0,0,0,0.8)' }}>
                  <span>▲ 开仓（<span style={{ color: '#4CAF50' }}>绿=多</span> / <span style={{ color: '#f44336' }}>红=空</span>）</span>
                  <span>● 平仓（<span style={{ color: '#4CAF50' }}>绿=盈</span> / <span style={{ color: '#f44336' }}>红=亏</span>）</span>
                  <span style={{ color: '#f0b90b' }}>— EMA50</span>
                  <span style={{ color: '#a855f7' }}>— EMA200</span>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    const TradesQuery = ({ onChartView, dateRange }) => {
      const [trades, setTrades] = useState([]);
      const [allTrades, setAllTrades] = useState([]); // 存储所有交易数据
      const [loading, setLoading] = useState(false);
      const [filters, setFilters] = useState({
        reasoningKeyword: '',    // 新增：入场原因关键词
        signal: '',             // 新增：交易信号
        strategy: '',           // 新增：策略筛选
        confidenceMin: '',      // 新增：最小置信度
        confidenceMax: '',      // 原有：时间范围
        startDate: dateRange?.startDate || '',
        endDate: dateRange?.endDate || '',
        tradeType: '',
        result: ''
      });

      const fetchAllTrades = async () => {
        try {
          const response = await fetch('/api/all-trades');
          if (response.ok) {
            const tradesData = await response.json();
            setAllTrades(tradesData);
            return tradesData;
          }
        } catch (error) {
          console.error('获取交易记录失败:', error);
        }
        return null;
      };

      const fetchTrades = async (overrideFilters) => {
        const f = overrideFilters || filters;
        setLoading(true);
        try {
          // 如果还没有加载全部数据，先获取
          let sourceTrades = allTrades;
          if (sourceTrades.length === 0) {
            const fetched = await fetchAllTrades();
            if (fetched) sourceTrades = fetched;
          }

          // 应用筛选条件并按时间倒序排列（最近时间在前）
          let filteredTrades = sourceTrades.filter(trade => {
            // 入场原因关键词模糊查询
            if (f.reasoningKeyword) {
              const keyword = f.reasoningKeyword.toLowerCase();
              const hasMatchingReasoning = trade.reasoning && trade.reasoning.some(reason =>
                reason.toLowerCase().includes(keyword)
              );
              if (!hasMatchingReasoning) return false;
            }

            // 交易信号筛选
            if (f.signal) {
              if (f.signal === 'BUY' && trade.signal !== 'BUY') return false;
              if (f.signal === 'SELL' && trade.signal !== 'SELL') return false;
            }

            // 策略筛选（按入场原因前缀匹配策略类型）
            if (f.strategy) {
              const hasStrategy = trade.reasoning && trade.reasoning.some(reason =>
                reason.startsWith(f.strategy)
              );
              if (!hasStrategy) return false;
            }

            // 置信度范围筛选
            if (f.confidenceMin) {
              const minConfidence = parseFloat(f.confidenceMin);
              if (trade.confidence < minConfidence) return false;
            }

            if (f.confidenceMax) {
              const maxConfidence = parseFloat(f.confidenceMax);
              if (trade.confidence > maxConfidence) return false;
            }

            // 时间范围筛选（YYYY-MM-DD必须手动解析为本地零点，直接new Date(string)会按UTC零点解析导致东八区偏移8小时）
            if (f.startDate) {
              const tradeDate = new Date(trade.timestamp);
              const [sy, sm, sd] = f.startDate.split('-').map(Number);
              const startDate = new Date(sy, sm - 1, sd);
              if (tradeDate < startDate) return false;
            }

            if (f.endDate) {
              const tradeDate = new Date(trade.timestamp);
              const [ey, em, ed] = f.endDate.split('-').map(Number);
              const endDate = new Date(ey, em - 1, ed, 23, 59, 59, 999);
              if (tradeDate > endDate) return false;
            }

            // 交易方向筛选
            if (f.tradeType && trade.tradeType !== f.tradeType) {
              return false;
            }

            // 预测结果筛选
            if (f.result) {
              if (f.result === 'correct' && trade.isCorrect !== true) return false;
              if (f.result === 'incorrect' && trade.isCorrect !== false) return false;
              if (f.result === 'pending' && trade.isCorrect !== undefined) return false;
            }

            return true;
          });

          // 按时间倒序排列，最近的时间在最前面
          filteredTrades.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

          setTrades(filteredTrades);
        } catch (error) {
          console.error('筛选交易记录失败:', error);
        } finally {
          setLoading(false);
        }
      };

      const handleFilterChange = (key, value) => {
        setFilters(prev => ({ ...prev, [key]: value }));
      };

      // 清空时间范围筛选并立即重新查询（传入最新筛选对象避免闭包旧值）
      const clearDateFilter = () => {
        const next = { ...filters, startDate: '', endDate: '' };
        setFilters(next);
        fetchTrades(next);
      };

      // 从日历周统计跳转进入时，自动按携带的时间范围执行一次查询
      useEffect(() => {
        if (dateRange) {
          fetchTrades();
        }
      }, []);

      const resetFilters = () => {
        setFilters({
          reasoningKeyword: '',    // 重置入场原因关键词
          signal: '',             // 重置交易信号
          strategy: '',           // 重置策略筛选
          confidenceMin: '',      // 重置置信度范围
          confidenceMax: '',
          startDate: '',
          endDate: '',
          tradeType: '',
          result: ''
        });
      };

      const formatCurrency = (amount) => {
        return new Intl.NumberFormat('zh-CN', {
          style: 'decimal',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(amount);
      };

      return (
        <div className="trades-query">

          {/* 筛选条件 - 简洁现代风格 */}
          <div className="bg-white/5 backdrop-blur-sm rounded-xl p-4 mb-6 border border-white/10">
            <h4 className="text-cyan-300 text-sm font-medium mb-4 tracking-wide">筛选条件</h4>

            <div className="grid grid-cols-1 md:grid-cols-12 gap-4 mb-4">
              {/* 入场原因关键词 - 核心功能 */}
              <div className="md:col-span-3">
                <label className="block text-xs text-gray-400 mb-2">入场原因关键词</label>
                <input
                  type="text"
                  value={filters.reasoningKeyword}
                  onChange={(e) => handleFilterChange('reasoningKeyword', e.target.value)}
                  placeholder="输入关键词进行模糊搜索..."
                  className="form-control w-full px-3 py-2 text-sm"
                />
              </div>

              {/* 策略 */}
              <div className="md:col-span-2">
                <label className="block text-xs text-gray-400 mb-2">策略</label>
                <select
                  value={filters.strategy}
                  onChange={(e) => handleFilterChange('strategy', e.target.value)}
                  className="form-control form-select w-full px-3 py-2 text-sm"
                >
                  <option value="" className="bg-gray-900 text-white">全部策略</option>
                  <option value="趋势策略" className="bg-gray-900 text-cyan-400">趋势策略</option>
                  <option value="反转策略" className="bg-gray-900 text-orange-400">反转策略</option>
                </select>
              </div>

              {/* 时间范围 */}
              <div className="md:col-span-3">
                <label className="block text-xs text-gray-400 mb-2">时间范围</label>
                <div className="flex items-center gap-2">
                  <input
                    type="date"
                    value={filters.startDate}
                    onChange={(e) => handleFilterChange('startDate', e.target.value)}
                    className="form-control form-date flex-1 px-3 py-2 text-sm"
                  />
                  <span className="text-gray-500 text-xs">至</span>
                  <input
                    type="date"
                    value={filters.endDate}
                    onChange={(e) => handleFilterChange('endDate', e.target.value)}
                    className="form-control form-date flex-1 px-3 py-2 text-sm"
                  />
                  {(filters.startDate || filters.endDate) && (
                    <button
                      onClick={clearDateFilter}
                      title="清空时间范围"
                      style={{
                        flexShrink: 0,
                        width: '26px',
                        height: '26px',
                        padding: 0,
                        lineHeight: '1',
                        borderRadius: '50%',
                        border: '1px solid rgba(255,255,255,0.2)',
                        background: 'rgba(255,255,255,0.08)',
                        color: '#ccc',
                        fontSize: '14px',
                        cursor: 'pointer'
                      }}
                    >×</button>
                  )}
                </div>
              </div>

              {/* 交易方向 */}
              <div className="md:col-span-2">
                <label className="block text-xs text-gray-400 mb-2">交易方向</label>
                <select
                  value={filters.tradeType}
                  onChange={(e) => handleFilterChange('tradeType', e.target.value)}
                  className="form-control form-select w-full px-3 py-2 text-sm"
                >
                  <option value="" className="bg-gray-900 text-white">全部方向</option>
                  <option value="LONG" className="bg-gray-900 text-green-400">做多</option>
                  <option value="SHORT" className="bg-gray-900 text-red-400">做空</option>
                </select>
              </div>

              {/* 预测结果 */}
              <div className="md:col-span-2">
                <label className="block text-xs text-gray-400 mb-2">预测结果</label>
                <select
                  value={filters.result}
                  onChange={(e) => handleFilterChange('result', e.target.value)}
                  className="form-control form-select w-full px-3 py-2 text-sm"
                >
                  <option value="" className="bg-gray-900 text-white">全部结果</option>
                  <option value="correct" className="bg-gray-900 text-green-400">预测正确</option>
                  <option value="incorrect" className="bg-gray-900 text-red-400">预测错误</option>
                  <option value="pending" className="bg-gray-900 text-yellow-400">持仓中</option>
                </select>
              </div>
            </div>

            {/* 操作按钮 */}
            <div className="flex gap-2 justify-end">
              <button
                onClick={(e) => {
                  e.preventDefault();
                  resetFilters();
                }}
                className="px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-gray-300 text-sm hover:bg-white/10 transition-all duration-200"
              >
                重置
              </button>

              <button
                onClick={(e) => {
                  e.preventDefault();
                  fetchTrades();
                }}
                disabled={loading}
                className="px-4 py-2 bg-cyan-500/20 border border-cyan-500/30 rounded-lg text-cyan-300 text-sm hover:bg-cyan-500/30 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
              >
                {loading ? (
                  <>
                    <div className="w-3 h-3 border-2 border-cyan-300/30 border-t-cyan-300 rounded-full animate-spin"></div>
                    查询中...
                  </>
                ) : '查询'}
              </button>
            </div>
          </div>

          {/* 统计信息 */}
          <div style={{ marginBottom: '20px', fontSize: '14px', color: '#ccc' }}>
            {(() => {
              const activeFilters = [];
              if (filters.reasoningKeyword) activeFilters.push(`关键词: "${filters.reasoningKeyword}"`);
              if (filters.strategy) activeFilters.push(`策略: ${filters.strategy}`);
              if (filters.signal) activeFilters.push(`信号: ${filters.signal === 'BUY' ? '买入' : '卖出'}`);
              if (filters.confidenceMin) activeFilters.push(`置信度≥${filters.confidenceMin}%`);
              if (filters.confidenceMax) activeFilters.push(`置信度≤${filters.confidenceMax}%`);
              if (filters.startDate) activeFilters.push(`起始: ${filters.startDate}`);
              if (filters.endDate) activeFilters.push(`截止: ${filters.endDate}`);
              if (filters.tradeType) activeFilters.push(`方向: ${filters.tradeType === 'LONG' ? '做多' : '做空'}`);
              if (filters.result) activeFilters.push(`结果: ${filters.result === 'correct' ? '正确' : filters.result === 'incorrect' ? '错误' : '持仓中'}`);
              return `共找到 ${trades.length} 条交易记录${activeFilters.length ? ' | ' + activeFilters.join(' | ') : ''}`;
            })()}
          </div>

          {/* 交易记录表格 */}
          <div style={{ overflowX: 'auto' }}>
            <table className="trades-table" style={{ width: '100%', minWidth: '800px' }}>
              <thead>
                <tr>
                  <th>开仓时间</th>
                  <th>开仓价</th>
                  <th>开仓金额</th>
                  <th>交易方向</th>
                  <th>入场原因</th>
                  <th>平仓价</th>
                  <th>价差</th>
                  <th>平仓时间</th>
                  <th>盈亏</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                {trades.map((trade) => (
                  <tr key={trade._id} style={trade.profitLoss != null && trade.profitLoss < 0 ? { backgroundColor: 'rgba(244, 67, 54, 0.08)' } : undefined}>
                    <td>{new Date(trade.timestamp).toLocaleString('zh-CN')}</td>
                    <td>{formatCurrency(trade.price)}</td>
                    <td>{trade.investmentAmount != null ? formatAmountU(trade.investmentAmount) : '-'}</td>
                    <td>
                      <span style={{
                        padding: '4px 8px',
                        borderRadius: '12px',
                        fontSize: '12px',
                        backgroundColor: trade.tradeType === 'LONG' ? 'rgba(76, 175, 80, 0.2)' : 'rgba(244, 67, 54, 0.2)',
                        color: trade.tradeType === 'LONG' ? '#4CAF50' : '#f44336'
                      }}>
                        {trade.tradeType === 'LONG' ? '做多' : '做空'}
                      </span>
                    </td>
                    <td>
                      <div style={{ fontSize: '0.9em' }}>
                        {trade.reasoning ? trade.reasoning.slice(0, 2).map((reason, index) => (
                          <div key={index}>• {reason}</div>
                        )) : '-'}
                      </div>
                    </td>
                    <td>{trade.closePrice ? formatCurrency(trade.closePrice) : '-'}</td>
                    <td>
                      {trade.closePrice ?
                        `${trade.closePrice > trade.price ? '+' : ''}${formatCurrency(trade.closePrice - trade.price)}`
                        : '-'}
                    </td>
                    <td>{trade.closeTime ? new Date(trade.closeTime).toLocaleTimeString() : '-'}</td>
                    <td className={trade.profitLoss && trade.profitLoss >= 0 ? 'profit' : 'loss'}>
                      {trade.profitLoss !== undefined ? `${trade.profitLoss > 0 ? '+' : ''}${formatAmountU(trade.profitLoss)}` : '-'}
                    </td>
                    <td>
                      <button onClick={() => onChartView(trade)} style={{ padding: '4px 10px', borderRadius: '6px', border: '1px solid rgba(0,212,255,0.4)', backgroundColor: 'rgba(0,212,255,0.08)', color: '#00d4ff', cursor: 'pointer', fontSize: '12px' }}>K线</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>

            {trades.length === 0 && !loading && (
              <div style={{ textAlign: 'center', padding: '40px', color: '#ccc' }}>
                暂无符合条件的交易记录
              </div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.render(<Dashboard />, document.getElementById('root'));
  </script>
</body>

</html>
</script>
</body>

</html>
