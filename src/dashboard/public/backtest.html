<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC Oracle // 指数全自动规则平仓回测实验室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 前端基础运行库 (React 18 + TailwindCSS + Lightweight-Charts) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #04070b;
      color: #f1f5f9;
      font-family: 'JetBrains Mono', 'Share Tech Mono', monospace;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #04070b;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #10b981;
    }

    .font-terminal {
      font-family: 'JetBrains Mono', 'Share Tech Mono', monospace;
    }

    .terminal-panel {
      background: #080d14;
      border: 1px solid rgba(6, 182, 212, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), inset 0 0 30px rgba(6, 182, 212, 0.02);
    }

    /* 荧光特效 */
    .glow-green {
      text-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }
    .glow-red {
      text-shadow: 0 0 10px rgba(244, 63, 94, 0.6);
    }
    .glow-cyan {
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.6);
    }
    .glow-amber {
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
    }

    /* 范围滑动条自定义 */
    input[type=range] {
      accent-color: #06b6d4;
    }

    .num-tabular {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // 工具函数：格式化金额
    const formatU = (num, digits = 2) => {
      if (num === null || num === undefined || isNaN(num)) return '0.00';
      return Number(num).toLocaleString('zh-CN', {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      });
    };

    // 工具函数：格式化时间戳为北京时间 YYYY-MM-DD HH:mm:ss
    const formatBeijingTime = (ts) => {
      if (!ts) return '--';
      const d = new Date(Number(ts));
      if (isNaN(d.getTime())) return '--';
      const utc = d.getTime() + d.getTimezoneOffset() * 60000;
      const bj = new Date(utc + 8 * 3600000);
      const Y = bj.getFullYear();
      const M = String(bj.getMonth() + 1).padStart(2, '0');
      const D = String(bj.getDate()).padStart(2, '0');
      const h = String(bj.getHours()).padStart(2, '0');
      const m = String(bj.getMinutes()).padStart(2, '0');
      const s = String(bj.getSeconds()).padStart(2, '0');
      return `${Y}-${M}-${D} ${h}:${m}:${s}`;
    };

    // 工具函数：格式化 datetime-local 字符串 (YYYY-MM-DDTHH:mm)
    const toDateTimeLocal = (date) => {
      const pad = (n) => String(n).padStart(2, '0');
      const Y = date.getFullYear();
      const M = pad(date.getMonth() + 1);
      const D = pad(date.getDate());
      const h = pad(date.getHours());
      const m = pad(date.getMinutes());
      return `${Y}-${M}-${D}T${h}:${m}`;
    };

    // 周期毫秒数映射
    const INTERVAL_TO_MS = {
      '1m': 60 * 1000,
      '3m': 3 * 60 * 1000,
      '5m': 5 * 60 * 1000,
      '15m': 15 * 60 * 1000,
      '30m': 30 * 60 * 1000,
      '1h': 3600 * 1000,
      '4h': 4 * 3600 * 1000,
      '1d': 24 * 3600 * 1000
    };

    // 主应用组件
    const BacktestApp = () => {
      // 1. 回测参数与时间配置
      const [symbol, setSymbol] = useState('BTCUSDT');
      const [interval, setIntervalVal] = useState('5m');
      const [startDate, setStartDate] = useState(() => {
        const d = new Date(Date.now() - 3 * 24 * 3600 * 1000); // 默认3天前
        return toDateTimeLocal(d);
      });
      const [endDate, setEndDate] = useState(() => {
        return toDateTimeLocal(new Date());
      });

      // 自动平仓规则配置：
      // autoCloseMinutes: 自动平仓持仓时长 (默认10分钟，与系统10分钟事件合约完全一致)
      const [autoCloseMinutes, setAutoCloseMinutes] = useState(10);
      // tradeRule: 'event' (10分钟事件合约，预测正确+80%收益，错误-100%本金) 或 'margin' (标的点差涨跌幅)
      const [tradeRule, setTradeRule] = useState('event');
      // 初始资金与单笔交易仓位 (USDT)
      const [initialCapital, setInitialCapital] = useState(1000);
      const [tradeAmount, setTradeAmount] = useState(100);

      // 可选自动止盈止损保护规则
      const [enableTpSl, setEnableTpSl] = useState(false);
      const [takeProfitPrice, setTakeProfitPrice] = useState('');
      const [stopLossPrice, setStopLossPrice] = useState('');

      // 2. 指数K线数据与状态
      const [allKlines, setAllKlines] = useState([]);
      const [dataSource, setDataSource] = useState('');
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [noticeMsg, setNoticeMsg] = useState('');

      // 3. 回放/推演引擎状态
      const [isReplayMode, setIsReplayMode] = useState(true);
      const [replayIndex, setReplayIndex] = useState(0); // 当前推演到的K线索引 (0 ~ allKlines.length - 1)
      const [isPlaying, setIsPlaying] = useState(false);
      const [playSpeed, setPlaySpeed] = useState(1); // 播放速度倍率

      // 4. 当前持仓与交易记录
      // activePosition: { id, type, entryIndex, targetExitIndex, entryPrice, entryTime, expectedExitTime, amount, autoCloseMinutes, holdBars, takeProfit, stopLoss }
      const [activePosition, setActivePosition] = useState(null);
      const [trades, setTrades] = useState(() => {
        try {
          const saved = localStorage.getItem('btc_oracle_manual_backtest_trades');
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      // 5. 过滤与选中高亮
      const [tradeFilter, setTradeFilter] = useState('ALL'); // ALL, LONG, SHORT, WIN, LOSS
      const [selectedTradeId, setSelectedTradeId] = useState(null);

      // 图表 DOM 容器引用
      const chartContainerRef = useRef(null);
      const equityChartContainerRef = useRef(null);
      const chartRef = useRef(null);
      const candleSeriesRef = useRef(null);
      const ema50SeriesRef = useRef(null);
      const ema200SeriesRef = useRef(null);
      const equityChartRef = useRef(null);
      const equitySeriesRef = useRef(null);

      // 自动播放定时器
      const playTimerRef = useRef(null);

      // 当前周期对应的单根K线毫秒数
      const curIntervalMs = useMemo(() => {
        return INTERVAL_TO_MS[interval] || 5 * 60 * 1000;
      }, [interval]);

      // 当前设置的自动平仓所需持有K线数量 (例如 5m 周期下 10 分钟 = 2 根K线)
      const holdBarsRequired = useMemo(() => {
        return Math.max(1, Math.round((autoCloseMinutes * 60 * 1000) / curIntervalMs));
      }, [autoCloseMinutes, curIntervalMs]);

      // 自动保存交易记录到 localStorage
      useEffect(() => {
        try {
          localStorage.setItem('btc_oracle_manual_backtest_trades', JSON.stringify(trades));
        } catch (e) {
          console.warn('保存到localStorage失败:', e);
        }
      }, [trades]);

      // 当前可见K线列表 (推演模式下仅显示当前进度之前的K线)
      const visibleKlines = useMemo(() => {
        if (!allKlines || allKlines.length === 0) return [];
        if (!isReplayMode) return allKlines;
        const count = Math.min(Math.max(replayIndex + 1, 1), allKlines.length);
        return allKlines.slice(0, count);
      }, [allKlines, isReplayMode, replayIndex]);

      // 当前K线数据
      const currentBar = useMemo(() => {
        if (visibleKlines.length === 0) return null;
        return visibleKlines[visibleKlines.length - 1];
      }, [visibleKlines]);

      // 当前指数价格
      const currentPrice = useMemo(() => {
        if (!currentBar) return 0;
        return Number(currentBar.close);
      }, [currentBar]);

      // 快捷预设时间
      const setQuickPreset = (hours) => {
        const end = new Date();
        const start = new Date(end.getTime() - hours * 3600 * 1000);
        setStartDate(toDateTimeLocal(start));
        setEndDate(toDateTimeLocal(end));
      };

      // 从后端加载指数K线数据
      const fetchIndexData = async () => {
        setLoading(true);
        setErrorMsg('');
        try {
          const startMs = new Date(startDate).getTime();
          const endMs = new Date(endDate).getTime();

          if (isNaN(startMs) || isNaN(endMs) || startMs >= endMs) {
            setErrorMsg('请选择有效的起止时间区间（开始时间需早于结束时间）');
            setLoading(false);
            return;
          }

          const res = await fetch(`/api/backtest/index-klines?symbol=${symbol}&interval=${interval}&start=${startMs}&end=${endMs}&limit=2500`);
          const data = await res.json();

          if (!data.success || !data.klines || data.klines.length === 0) {
            setErrorMsg(data.error || '未获取到对应时间段的指数数据');
            setLoading(false);
            return;
          }

          setAllKlines(data.klines);
          setDataSource(data.source || 'index');
          const initialReplay = Math.min(Math.max(20, Math.floor(data.klines.length * 0.1)), data.klines.length - 1);
          setReplayIndex(initialReplay);
          setIsPlaying(false);
        } catch (err) {
          console.error('加载指数数据失败:', err);
          setErrorMsg('网络请求异常，无法加载指数数据: ' + (err.message || err));
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchIndexData();
      }, []);

      // 自动播放控制
      useEffect(() => {
        if (!isPlaying) {
          if (playTimerRef.current) clearInterval(playTimerRef.current);
          return;
        }

        const baseInterval = 1000 / playSpeed;
        playTimerRef.current = setInterval(() => {
          setReplayIndex((prev) => {
            if (prev >= allKlines.length - 1) {
              setIsPlaying(false);
              return prev;
            }
            return prev + 1;
          });
        }, Math.max(100, baseInterval));

        return () => {
          if (playTimerRef.current) clearInterval(playTimerRef.current);
        };
      }, [isPlaying, playSpeed, allKlines.length]);

      // -------------------------------------------------------------
      // 核心平仓逻辑：严格由规则自动触发平仓，不支持任何手动平仓
      // -------------------------------------------------------------
      const handleAutoClose = useCallback((pos, exitPriceVal, exitTimeVal, reason) => {
        const exitPrice = Number(exitPriceVal);
        const exitTime = Number(exitTimeVal);
        const priceDiff = exitPrice - pos.entryPrice;
        const pricePct = (priceDiff / pos.entryPrice) * 100;

        let profitLoss = 0;
        let isCorrect = false;

        if (tradeRule === 'event') {
          // 事件合约规则：按实际方向判定，胜出固定获得 80% 收益，失败亏损全部本金
          const isWin = pos.type === 'LONG' ? (exitPrice > pos.entryPrice) : (exitPrice < pos.entryPrice);
          isCorrect = isWin;
          if (isWin) {
            profitLoss = pos.amount * 0.8; // +80U
          } else {
            profitLoss = -pos.amount; // -100U
          }
        } else {
          // 标的点差模式：按实际价格涨跌幅计算盈亏
          const returnRate = pos.type === 'LONG' ? (priceDiff / pos.entryPrice) : (-priceDiff / pos.entryPrice);
          profitLoss = pos.amount * returnRate;
          isCorrect = profitLoss > 0;
        }

        const closedTrade = {
          id: pos.id,
          type: pos.type,
          entryIndex: pos.entryIndex,
          exitIndex: replayIndex,
          entryTime: pos.entryTime,
          exitTime: exitTime,
          entryPrice: pos.entryPrice,
          exitPrice: exitPrice,
          amount: pos.amount,
          profitLoss: Math.round(profitLoss * 100) / 100,
          returnRate: Math.round((profitLoss / pos.amount) * 10000) / 100, // %
          pricePct: Math.round(pricePct * 100) / 100,
          barsHeld: Math.max(1, replayIndex - pos.entryIndex),
          reason: reason,
          isCorrect: isCorrect,
          settledAt: Date.now()
        };

        setTrades((prev) => [closedTrade, ...prev]);
        setActivePosition(null);

        // 提示规则自动平仓已执行
        setNoticeMsg(`【规则自动平仓完成】${reason}，平仓价: $${formatU(exitPrice, 1)}，盈亏: ${profitLoss >= 0 ? '+' : ''}${formatU(profitLoss)}U`);
        setTimeout(() => setNoticeMsg(''), 5000);

        if (isCorrect && typeof confetti === 'function') {
          confetti({
            particleCount: 50,
            spread: 60,
            origin: { y: 0.8 }
          });
        }
      }, [tradeRule, replayIndex]);

      // 自动检查持仓：单步推演中，达到规则要求的时间或触及止盈止损时自动平仓
      useEffect(() => {
        if (!activePosition || !currentBar) return;

        const pos = activePosition;
        const curBarTime = Number(currentBar.openTime);
        const curClose = Number(currentBar.close);
        const curHigh = Number(currentBar.high);
        const curLow = Number(currentBar.low);

        // 1. 检查可选止盈止损自动保护
        if (pos.takeProfit && pos.takeProfit > 0) {
          const hitTP = pos.type === 'LONG' ? curHigh >= pos.takeProfit : curLow <= pos.takeProfit;
          if (hitTP) {
            handleAutoClose(pos, pos.takeProfit, curBarTime, '止盈价自动触发平仓 (TAKE_PROFIT_AUTO)');
            return;
          }
        }
        if (pos.stopLoss && pos.stopLoss > 0) {
          const hitSL = pos.type === 'LONG' ? curLow <= pos.stopLoss : curHigh >= pos.stopLoss;
          if (hitSL) {
            handleAutoClose(pos, pos.stopLoss, curBarTime, '止损价自动触发平仓 (STOP_LOSS_AUTO)');
            return;
          }
        }

        // 2. 检查规则到期自动平仓 (满设定持有K线数或时间满额)
        const isBarsExpired = replayIndex >= pos.targetExitIndex;
        const isTimeExpired = curBarTime >= pos.expectedExitTime;

        if (isBarsExpired || isTimeExpired) {
          handleAutoClose(
            pos,
            curClose,
            curBarTime,
            `规则到期自动平仓 (满${pos.autoCloseMinutes}分钟 / ${pos.holdBars}根K线)`
          );
        }
      }, [replayIndex, activePosition, currentBar, handleAutoClose]);

      // 执行开仓 (开多 / 开空)
      const executeOpenPosition = (type) => {
        if (!currentBar) {
          alert('请先加载指数K线数据');
          return;
        }

        // 若当前已有持仓，明确提示用户不可手动平仓，必须按规则等待自动平仓
        if (activePosition) {
          const remainingBars = Math.max(1, activePosition.targetExitIndex - replayIndex);
          alert(
            `【交易已被规则锁定】\n\n当前已有持仓正在按规则运行中（剩余 ${remainingBars} 根 K 线自动平仓结算）。\n` +
            `本系统严格执行【按规则自动平仓，不支持手动平仓】的纪律要求，请通过“单步推进”或“自动播放”推进 K 线至到期自动平仓后再开新仓。`
          );
          return;
        }

        const price = Number(currentBar.close);
        const entryTime = Number(currentBar.openTime);
        const holdBars = holdBarsRequired;
        const targetExitIndex = replayIndex + holdBars;
        const expectedExitTime = entryTime + autoCloseMinutes * 60 * 1000;

        // 全景自由模式下：因为所有未来K线已经加载，系统直接按规则自动寻觅未来对应K线并瞬间自动结算
        if (!isReplayMode) {
          const exitIdx = Math.min(targetExitIndex, allKlines.length - 1);
          const exitBar = allKlines[exitIdx];
          const exitClose = Number(exitBar.close);
          const exitTime = Number(exitBar.openTime);

          // 临时构建持仓对象并直接自动平仓结算
          const tempPos = {
            id: 'pos_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            type,
            entryIndex: replayIndex,
            targetExitIndex: exitIdx,
            entryPrice: price,
            entryTime: entryTime,
            amount: Number(tradeAmount) || 100,
            autoCloseMinutes: autoCloseMinutes,
            holdBars: holdBars
          };

          handleAutoClose(
            tempPos,
            exitClose,
            exitTime,
            `全景规则自动平仓 (满${autoCloseMinutes}分钟 / ${holdBars}根K线)`
          );
          return;
        }

        // 推演模式下：锁定当前持仓，跟随 K 线推演前进自动触发平仓
        const newPos = {
          id: 'pos_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
          type,
          entryIndex: replayIndex,
          targetExitIndex: targetExitIndex,
          entryPrice: price,
          entryTime: entryTime,
          expectedExitTime: expectedExitTime,
          expectedExitTimeStr: formatBeijingTime(expectedExitTime),
          amount: Number(tradeAmount) || 100,
          autoCloseMinutes: autoCloseMinutes,
          holdBars: holdBars,
          takeProfit: (enableTpSl && takeProfitPrice) ? Number(takeProfitPrice) : null,
          stopLoss: (enableTpSl && stopLossPrice) ? Number(stopLossPrice) : null
        };

        setActivePosition(newPos);
        setNoticeMsg(`【已按规则开仓】方向: ${type === 'LONG' ? '做多' : '做空'}，价格: $${formatU(price, 1)}。已锁定！系统将在 ${autoCloseMinutes} 分钟(${holdBars}根K线)后自动平仓结算。`);
        setTimeout(() => setNoticeMsg(''), 5000);
      };

      // 清空回测数据
      const resetBacktest = () => {
        if (confirm('确定要清空当前所有回测交易记录并重置吗？')) {
          setTrades([]);
          setActivePosition(null);
          localStorage.removeItem('btc_oracle_manual_backtest_trades');
        }
      };

      // 导出 CSV 交易明细
      const exportCSV = () => {
        if (trades.length === 0) {
          alert('暂无交易记录可供导出');
          return;
        }

        const headers = [
          '交易序号',
          '方向',
          '开仓时间(北京)',
          '平仓时间(北京)',
          '开仓指数价',
          '平仓指数价',
          '本金(USDT)',
          '盈亏(USDT)',
          '收益率(%)',
          '持仓K线数',
          '自动平仓规则与原因'
        ];

        const rows = trades.map((t, idx) => [
          trades.length - idx,
          t.type === 'LONG' ? '做多' : '做空',
          formatBeijingTime(t.entryTime),
          formatBeijingTime(t.exitTime),
          t.entryPrice,
          t.exitPrice,
          t.amount,
          t.profitLoss,
          t.returnRate + '%',
          t.barsHeld,
          t.reason
        ]);

        const csvContent = '\uFEFF' + [headers, ...rows].map(e => e.join(',')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `BTC_Index_Auto_Backtest_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      // -------------------------------------------------------------
      // 数据统计计算 (Metrics & Statistics)
      // -------------------------------------------------------------
      const stats = useMemo(() => {
        const totalTrades = trades.length;
        if (totalTrades === 0) {
          return {
            totalTrades: 0,
            winTrades: 0,
            lossTrades: 0,
            winRate: 0,
            totalProfitLoss: 0,
            roi: 0,
            currentBalance: initialCapital,
            profitFactor: 0,
            avgTradePnL: 0,
            avgWin: 0,
            avgLoss: 0,
            maxWin: 0,
            maxLoss: 0,
            maxConsecutiveWins: 0,
            maxConsecutiveLosses: 0,
            maxDrawdown: 0,
            maxDrawdownPct: 0,
            longTrades: 0,
            longWinRate: 0,
            shortTrades: 0,
            shortWinRate: 0,
            equityHistory: [{ time: Date.now(), balance: initialCapital }]
          };
        }

        let winTrades = 0;
        let lossTrades = 0;
        let grossProfit = 0;
        let grossLoss = 0;
        let totalPnL = 0;
        let maxWin = 0;
        let maxLoss = 0;

        let longTrades = 0;
        let longWins = 0;
        let shortTrades = 0;
        let shortWins = 0;

        let curConsecWins = 0;
        let maxConsecWins = 0;
        let curConsecLosses = 0;
        let maxConsecLosses = 0;

        const chronTrades = [...trades].reverse();
        let runningBalance = initialCapital;
        let peakBalance = initialCapital;
        let maxDrawdown = 0;
        let maxDrawdownPct = 0;

        const equityHistory = [
          { time: (chronTrades[0]?.entryTime || Date.now()) - 300000, balance: initialCapital }
        ];

        chronTrades.forEach((t) => {
          totalPnL += t.profitLoss;
          runningBalance += t.profitLoss;
          equityHistory.push({ time: t.exitTime, balance: runningBalance });

          if (runningBalance > peakBalance) {
            peakBalance = runningBalance;
          }
          const dd = peakBalance - runningBalance;
          const ddPct = peakBalance > 0 ? (dd / peakBalance) * 100 : 0;
          if (dd > maxDrawdown) maxDrawdown = dd;
          if (ddPct > maxDrawdownPct) maxDrawdownPct = ddPct;

          if (t.profitLoss > 0) {
            winTrades++;
            grossProfit += t.profitLoss;
            if (t.profitLoss > maxWin) maxWin = t.profitLoss;

            curConsecWins++;
            curConsecLosses = 0;
            if (curConsecWins > maxConsecWins) maxConsecWins = curConsecWins;
          } else {
            lossTrades++;
            grossLoss += Math.abs(t.profitLoss);
            if (t.profitLoss < maxLoss) maxLoss = t.profitLoss;

            curConsecLosses++;
            curConsecWins = 0;
            if (curConsecLosses > maxConsecLosses) maxConsecLosses = curConsecLosses;
          }

          if (t.type === 'LONG') {
            longTrades++;
            if (t.profitLoss > 0) longWins++;
          } else {
            shortTrades++;
            if (t.profitLoss > 0) shortWins++;
          }
        });

        const winRate = (winTrades / totalTrades) * 100;
        const roi = (totalPnL / initialCapital) * 100;
        const profitFactor = grossLoss > 0 ? grossProfit / grossLoss : (grossProfit > 0 ? 99.9 : 0);
        const avgTradePnL = totalPnL / totalTrades;
        const avgWin = winTrades > 0 ? grossProfit / winTrades : 0;
        const avgLoss = lossTrades > 0 ? grossLoss / lossTrades : 0;

        return {
          totalTrades,
          winTrades,
          lossTrades,
          winRate: Math.round(winRate * 10) / 10,
          totalProfitLoss: Math.round(totalPnL * 100) / 100,
          roi: Math.round(roi * 10) / 10,
          currentBalance: Math.round(runningBalance * 100) / 100,
          profitFactor: Math.round(profitFactor * 100) / 100,
          avgTradePnL: Math.round(avgTradePnL * 100) / 100,
          avgWin: Math.round(avgWin * 100) / 100,
          avgLoss: Math.round(avgLoss * 100) / 100,
          maxWin: Math.round(maxWin * 100) / 100,
          maxLoss: Math.round(maxLoss * 100) / 100,
          maxConsecutiveWins: maxConsecWins,
          maxConsecutiveLosses: maxConsecLosses,
          maxDrawdown: Math.round(maxDrawdown * 100) / 100,
          maxDrawdownPct: Math.round(maxDrawdownPct * 10) / 10,
          longTrades,
          longWinRate: longTrades > 0 ? Math.round((longWins / longTrades) * 1000) / 10 : 0,
          shortTrades,
          shortWinRate: shortTrades > 0 ? Math.round((shortWins / shortTrades) * 1000) / 10 : 0,

          candleSeriesRef.current.setData(chartCandles);

          const calculateEMA = (period) => {
            if (chartCandles.length < period) return [];
            const k = 2 / (period + 1);
            let sum = 0;
            for (let i = 0; i < period; i++) sum += chartCandles[i].close;
            let prev = sum / period;
            const res = [{ time: chartCandles[period - 1].time, value: prev }];
            for (let i = period; i < chartCandles.length; i++) {
              prev = chartCandles[i].close * k + prev * (1 - k);
              res.push({ time: chartCandles[i].time, value: prev });
            }
            return res;
          };

          ema50SeriesRef.current.setData(calculateEMA(50));
          ema200SeriesRef.current.setData(calculateEMA(200));

                          </td>
                          <td className="p-2.5 text-right font-bold text-slate-200">
                            ${formatU(t.exitPrice, 1)}
                          </td>
                          <td className="p-2.5 text-right text-slate-300">${formatU(t.amount)}</td>
                          <td
                            className={`p-2.5 text-right font-bold num-tabular ${
                              isWin ? 'text-emerald-400' : 'text-rose-400'
                            }`}
                          >
                            {isWin ? '+' : ''}${formatU(t.profitLoss)}
                          </td>
                          <td
                            className={`p-2.5 text-right font-bold num-tabular ${
                              isWin ? 'text-emerald-400' : 'text-rose-400'
                            }`}
                          >
                            {isWin ? '+' : ''}{t.returnRate}%
                          </td>
                          <td className="p-2.5 text-center text-slate-400">{t.barsHeld} 根</td>
                          <td className="p-2.5 text-amber-300/90 text-[11px] font-mono flex items-center gap-1">
                            <i className="fa-solid fa-robot text-cyan-400 text-[10px]"></i>
                            <span>{t.reason}</span>
                          </td>
                          <td className="p-2.5 text-center">
                            <div className="flex items-center justify-center gap-2">
                              <button
                                onClick={() => focusOnTrade(t)}
                                className="text-cyan-400 hover:text-cyan-300"
                                title="在图表上聚焦定位此交易"
                              >
                                <i className="fa-solid fa-magnifying-glass"></i>
                              </button>
                              <button
                                onClick={() => deleteTrade(t.id)}
                                className="text-slate-600 hover:text-rose-400"
                                title="删除该笔交易"
                              >
                                <i className="fa-solid fa-trash"></i>
                              </button>
                            </div>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </section>
        </div>
      );
    };

    ReactDOM.render(<BacktestApp />, document.getElementById('root'));
  </script>
</body>
</html>
