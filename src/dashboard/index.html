            timeVisible: true,
            secondsVisible: false,
            borderColor: '#1e293b',
            rightOffset: 12, // 默认当前最新K线距离右侧价格轴保持 12 根K线的舒适间距（约100px）
            barSpacing: 9,   // 适中的K线柱宽度
            minBarSpacing: 3,
            shiftVisibleRangeOnNewBar: true, // 新K线生成时自动推移，恒定保持该右侧边距
            lockVisibleTimeRangeOnResize: true,
            tickMarkFormatter: (t) => {
              const d = new Date((t + 8 * 3600) * 1000);
              const iso = d.toISOString();
              const hm = iso.slice(11, 16);
              return hm === '00:00' ? iso.slice(5, 10).replace('-', '/') : hm;
            }
          },
          rightPriceScale: {
            borderColor: '#1e293b',
            autoScale: true
          }
        });

        const candleSeries = chart.addCandlestickSeries({
          upColor: '#10b981',
          downColor: '#f43f5e',
          borderVisible: false,
          wickUpColor: '#10b981',
          wickDownColor: '#f43f5e',
          priceLineVisible: true,
          lastValueVisible: true
        });

        const ema50Series = chart.addLineSeries({
          color: '#f59e0b',
          lineWidth: 2,
          priceLineVisible: false,
          lastValueVisible: false,
          title: ''
        });

        const ema200Series = chart.addLineSeries({
          color: '#a855f7',
          lineWidth: 2,
          priceLineVisible: false,
          lastValueVisible: false,
          title: ''
        });

        // 2. 监听时间轴拖动锁定检测
        chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
          if (!range) return;
          if (candlesRef.current && candlesRef.current.length > 0) {
            const totalBars = candlesRef.current.length;
            isUserScrolledAwayRef.current = (range.to < totalBars - 1);
          }
        });

        // 3. 十字准星移动悬停数据提取
        chart.subscribeCrosshairMove(param => {
          if (!param || !param.time || !param.seriesData) {
            setHoverData(null);
            return;
          }
          const c = param.seriesData.get(candleSeries);
          const e50 = param.seriesData.get(ema50Series);
          const e200 = param.seriesData.get(ema200Series);
          setHoverData({
            time: param.time,
            open: c ? c.open : null,
            high: c ? c.high : null,
            low: c ? c.low : null,
            close: c ? c.close : null,
            ema50: e50 ? e50.value : null,
            ema200: e200 ? e200.value : null
          });
        });

        chartRef.current = chart;
        candleSeriesRef.current = candleSeries;
        ema50SeriesRef.current = ema50Series;
        ema200SeriesRef.current = ema200Series;

        // 响应窗口尺寸变化
        const handleResize = () => {
          if (chart && mainContainerRef.current) {
            chart.applyOptions({ width: mainContainerRef.current.clientWidth });
          }
          fixScrollToRight();
        };
        window.addEventListener('resize', handleResize);

        // 立即拉取K线数据
        fetchKlines();

        return () => {
          disposed = true;
          window.removeEventListener('resize', handleResize);
          chart.remove();
        };
      }, []);

      // 5分钟K线实时倒计时定时器
      useEffect(() => {
        const updateCountdown = () => {
          const now = Date.now();
          const candleIntervalMs = 5 * 60 * 1000;
          const remainingMs = candleIntervalMs - (now % candleIntervalMs);
          const remainingSec = Math.floor(remainingMs / 1000);
          const m = String(Math.floor(remainingSec / 60)).padStart(2, '0');
          const s = String(remainingSec % 60).padStart(2, '0');
          setCountdown(`${m}:${s}`);

          // 当新一根5分钟K线生成时（倒计时299秒或0秒瞬时），自动重新请求最新收盘数据
          if (remainingSec === 299 || remainingSec === 0) {
            fetchKlines(dataSourceRef.current);
          }
        };

        updateCountdown();
        const countdownTimer = setInterval(updateCountdown, 1000);
        // 定期15秒自动拉取最新价格柱状刷新
        const pollTimer = setInterval(() => fetchKlines(dataSourceRef.current), 15000);

        return () => {
          clearInterval(countdownTimer);
          clearInterval(pollTimer);
        };
      }, []);

      // 价格跳动闪烁动效
      useEffect(() => {
        if (currentPrice != null && prevPriceRef.current != null) {
          if (currentPrice > prevPriceRef.current) {
            setPriceFlash('up');
          } else if (currentPrice < prevPriceRef.current) {
            setPriceFlash('down');
          }
          const timer = setTimeout(() => setPriceFlash(''), 600);
          return () => clearTimeout(timer);
        }
        prevPriceRef.current = currentPrice;
      }, [currentPrice]);

      // 1. 直连币安官方 WebSocket 事件合约标的指数实时流
      useEffect(() => {
        let ws = null;
        let isUnmounted = false;
        let reconnectTimer = null;

        const connectBinanceWs = () => {
          if (isUnmounted) return;
          try {
            ws = new WebSocket('wss://fstream.binance.com/ws/btcusdt@indexPrice');

            ws.onmessage = (event) => {
              try {
                const msg = JSON.parse(event.data);
                const rawPrice = msg.p || msg.c;
                if (!rawPrice) return;
                const p = parseFloat(rawPrice);
                updateLatestCandle(p);
              } catch (err) {}
            };

            ws.onerror = () => {
              if (ws) ws.close();
            };

            ws.onclose = () => {
              if (!isUnmounted) {
                reconnectTimer = setTimeout(connectBinanceWs, 4000);
              }
            };
          } catch (e) {
            if (!isUnmounted) {
              reconnectTimer = setTimeout(connectBinanceWs, 5000);
            }
          }
        };

        connectBinanceWs();

        return () => {
          isUnmounted = true;
          if (reconnectTimer) clearTimeout(reconnectTimer);
          if (ws) ws.close();
        };
      }, []);

      // 2. 监听服务端 Socket.IO 实时价格更新（双通道保障：priceUpdate 与 indexPriceUpdate）
      useEffect(() => {
        if (!socket) return;

        const handlePrice = (data) => {
          if (!data || !data.price) return;
          if (data.estimatedSettlePrice) setEstimatedSettle(parseFloat(data.estimatedSettlePrice));
          if (data.markPrice) setMarkPrice(parseFloat(data.markPrice));
          updateLatestCandle(data.price);
        };

        socket.on('priceUpdate', handlePrice);
        socket.on('indexPriceUpdate', handlePrice);

        return () => {
          socket.off('priceUpdate', handlePrice);
          socket.off('indexPriceUpdate', handlePrice);
        };
      }, [socket]);

      // 3. 事件合约指数 2秒 高频保底轮询（无论用户网络/代理环境如何，都绝对持续跳动不卡顿）
      useEffect(() => {
        const pollIndexTick = async () => {
          try {
            const res = await fetch('/api/index-price');
            if (res.ok) {
              const data = await res.json();
              if (data.estimatedSettlePrice) setEstimatedSettle(parseFloat(data.estimatedSettlePrice));
              if (data.markPrice) setMarkPrice(parseFloat(data.markPrice));
              if (data.indexPrice) {
                updateLatestCandle(data.indexPrice);
              }
            }
          } catch (e) {}
        };

        const timer = setInterval(pollIndexTick, 2000);
        return () => clearInterval(timer);
      }, []);

      // 显示数据：优先取十字准星悬停数据，无悬停时显示最新数据
      const displayPrice = hoverData?.close ?? currentPrice;
      const displayOpen = hoverData?.open;
      const displayHigh = hoverData?.high;
      const displayLow = hoverData?.low;
      const displayEma50 = hoverData?.ema50 ?? latestEma50;
      const displayEma200 = hoverData?.ema200 ?? latestEma200;

      return (
        <div className="p-4 rounded-xl bg-[#080d14] border border-cyan-500/35 shadow-2xl shadow-black/80 font-mono relative overflow-hidden mb-6">
          <div className="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-amber-500 via-cyan-400 to-purple-500 opacity-90"></div>

          {/* 顶栏信息与指标看板 */}
          <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3 pb-3 border-b border-slate-800">
            <div>
              <div className="flex flex-wrap items-center gap-2 text-xs font-mono mb-1">
                <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse shadow-sm shadow-cyan-400"></span>
                <span className="text-cyan-300 font-bold">
                  🎯 币安事件合约 :: BTCUSDT 标的指数实时流
                </span>
                <span className="text-slate-600 text-[10px]">|</span>
                <span className="text-slate-400 text-[11px]">
                  Coinbase/Kraken/OKX/Binance等全球主流所现货综合加权 (防插针防操盘)
                </span>
              </div>
              <div className="flex flex-wrap items-center gap-3">
                <div className="flex items-center gap-2">
                  <span className="text-cyan-400 font-bold">&gt;</span>
                  <h2 className="text-lg md:text-xl font-bold tracking-wider text-slate-100 uppercase m-0 flex items-center">
                    BTC 5分钟事件合约标的指数实时走势
                  </h2>
                </div>

                <div className="flex items-center gap-2">
                  <span className={`text-xl md:text-2xl font-black tracking-wider transition-colors duration-200 ${
                    priceFlash === 'up' ? 'text-emerald-400 drop-shadow-[0_0_8px_rgba(16,185,129,0.5)]' :
                    priceFlash === 'down' ? 'text-rose-400 drop-shadow-[0_0_8px_rgba(244,63,94,0.5)]' :
                    'text-slate-100'
                  }`}>
                    ${formatNumber(displayPrice, 2)}
                  </span>
                  <span className={`text-[10px] px-2 py-0.5 rounded font-bold border ${
                    trendStatus.includes('UPTREND')
                      ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
                      : trendStatus.includes('DOWNTREND')
                      ? 'bg-rose-500/20 text-rose-300 border-rose-500/40'
                      : 'bg-slate-800 text-slate-300 border-slate-700'
                  }`}>
                    {trendStatus}
                  </span>
                </div>
              </div>
            </div>

            {/* 右侧：事件合约接入确认徽章、5分钟K线倒计时与刷新 */}
            <div className="flex flex-wrap items-center gap-2.5">
              {/* 事件合约接入确认徽章 */}
              <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-950/40 border border-emerald-500/40 shadow-inner text-emerald-300 text-xs font-bold font-mono">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shadow-sm shadow-emerald-400"></span>
                <span>🎯 币安事件合约全量接入</span>
              </div>

              {/* 5M K线倒计时 */}
              <div className="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-cyan-950/40 border border-cyan-500/40 shadow-inner">
                <div className="flex flex-col">
                  <span className="text-[9px] text-cyan-400 uppercase tracking-widest font-bold flex items-center gap-1">
                    <span className="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span>
                    5M 结单倒计时
                  </span>
                  <span className="text-lg md:text-xl font-black tracking-widest text-cyan-200">
                    {countdown}
                  </span>
                </div>
              </div>

              <button
                onClick={() => {
                  isUserScrolledAwayRef.current = false;
                  fetchKlines();
                  setTimeout(() => fixScrollToRight(true), 60);
                }}
                className="px-2.5 py-2 rounded bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-cyan-300 border border-slate-700 text-xs transition-colors flex items-center gap-1.5"
                title="手动刷新K线"
              >
                <span>↻</span>
                <span className="hidden sm:inline">刷新</span>
              </button>
            </div>
          </div>

          {/* 指标数据状态栏 (OHLC + EMA50 + EMA200 + 事件合约结算说明) */}
          <div className="flex flex-wrap items-center gap-x-4 gap-y-1.5 py-2 text-xs border-b border-slate-800/60 bg-[#05080c]/60 -mx-4 px-4">
            {displayOpen != null && (
              <div className="flex items-center gap-1 text-[11px] text-slate-400">
                <span>O: <span className="text-slate-200 font-semibold">{formatNumber(displayOpen)}</span></span>
                <span>H: <span className="text-slate-200 font-semibold">{formatNumber(displayHigh)}</span></span>
                <span>L: <span className="text-slate-200 font-semibold">{formatNumber(displayLow)}</span></span>
                <span>C: <span className="text-slate-200 font-semibold">{formatNumber(displayPrice)}</span></span>
              </div>
            )}

            <div className="flex items-center gap-1.5 text-[11px]">
              <span className="w-2 h-2 rounded-full bg-amber-400"></span>
              <span className="text-amber-400 font-bold">EMA50:</span>
              <span className="text-amber-200 font-mono font-bold">${formatNumber(displayEma50, 2)}</span>
            </div>

            <div className="flex items-center gap-1.5 text-[11px]">
              <span className="w-2 h-2 rounded-full bg-purple-400"></span>
              <span className="text-purple-400 font-bold">EMA200:</span>
              <span className="text-purple-200 font-mono font-bold">${formatNumber(displayEma200, 2)}</span>
            </div>

            <div className="flex flex-wrap items-center gap-2 text-[11px] text-cyan-300/90 bg-cyan-950/30 px-2 py-0.5 rounded border border-cyan-500/20">
              <span className="text-cyan-400 font-bold">🏛️ 事件合约标的:</span>
              <span>综合加权指数 (防插针)</span>
              {estimatedSettle != null && (
                <span className="text-amber-300 font-bold ml-1">
                  | 预估结算价: ${formatNumber(estimatedSettle, 2)}
                </span>
              )}
              {markPrice != null && (
                <span className="text-slate-400 ml-1">
                  | 标记价: ${formatNumber(markPrice, 2)}
                </span>
              )}
            </div>
          </div>

          {/* 图表主区域 */}
          <div className="relative mt-2">
            {loading && (
              <div className="absolute inset-0 bg-[#05080c]/80 flex items-center justify-center z-10">
                <div className="text-cyan-400 font-mono text-sm flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                  正在加载5分钟K线图表与指标...
                </div>
              </div>
            )}

            {error && !loading && (
              <div className="p-3 my-2 rounded bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs">
                ⚠️ {error}
              </div>
            )}

            {/* 主K线 + EMA50/200 走势图表 */}
            <div ref={mainContainerRef} className="w-full" style={{ minHeight: '420px' }}></div>
          </div>
        </div>
      );
    };

    const TradeChartModal = ({ trade, onClose }) => {
      const formatCurrency = (amount) => {
        return new Intl.NumberFormat('zh-CN', {
          style: 'decimal',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(amount);
      };
      const containerRef = React.useRef(null);
      const [chartError, setChartError] = useState('');

      useEffect(() => {
        let chart = null;
        let disposed = false;
        const onResize = () => { if (chart && containerRef.current) chart.applyOptions({ width: containerRef.current.clientWidth }); };

        const init = async () => {
          try {
            if (typeof LightweightCharts === 'undefined') { setChartError('图表库加载失败，请检查网络后刷新'); return; }
            const entryMs = new Date(trade.timestamp).getTime();
            const exitMs = trade.closeTime ? new Date(trade.closeTime).getTime() : entryMs + 600000;
            const res = await fetch(`/api/klines?interval=5m&start=${entryMs - 220 * 300000}&end=${Math.min(exitMs + 7200000, Date.now() + 600000)}&limit=300`);
            const data = await res.json();
            if (disposed || !containerRef.current) return;
            const candles = (data.klines || []).map(k => ({
              time: Math.floor(k.openTime / 1000),
              open: +k.open, high: +k.high, low: +k.low, close: +k.close
            }));
            if (!candles.length) { setChartError('暂无K线数据'); return; }
            const ema = (period) => {
              const closes = candles.map(c => c.close);
              if (closes.length < period) return [];
              const k = 2 / (period + 1);
              let sum = 0;
              for (let i = 0; i < period; i++) sum += closes[i];
              let prev = sum / period;
              const out = [{ time: candles[period - 1].time, value: prev }];
              for (let i = period; i < closes.length; i++) {
                prev = closes[i] * k + prev * (1 - k);
                out.push({ time: candles[i].time, value: prev });
              }
              return out;
            };
            const ema50Data = ema(50);
            const ema200Data = ema(200);
            const entryTime = Math.floor(new Date(trade.timestamp).getTime() / 1000);
            const exitTime = trade.closeTime ? Math.floor(new Date(trade.closeTime).getTime() / 1000) : null;
            const findBar = (t) => {
              const hit = candles.find(c => c.time <= t && t < c.time + 300);
              return hit ? hit.time : null;
            };
            const entryBar = findBar(entryTime);
            const exitBar = exitTime ? findBar(exitTime) : null;
            const priceLines = [{
              price: Number(trade.price),
              color: trade.tradeType === 'LONG' ? '#10b981' : '#f43f5e',
              lineWidth: 2,
              lineStyle: LightweightCharts.LineStyle.Solid,
              axisLabelVisible: true,
              title: (trade.tradeType === 'LONG' ? '开多 ' : '开空 ') + Number(trade.price).toFixed(0)
            }];
            if (exitTime && trade.closePrice) {
              priceLines.push({
                price: Number(trade.closePrice),
                color: (trade.profitLoss || 0) >= 0 ? '#10b981' : '#f43f5e',
                lineWidth: 2,
                lineStyle: LightweightCharts.LineStyle.Dashed,
                axisLabelVisible: true,
                title: '平 ' + Number(trade.closePrice).toFixed(0) + (trade.profitLoss != null ? ` ${trade.profitLoss >= 0 ? '+' : ''}${formatAmountU(trade.profitLoss)}` : '')
              });
            }
            chart = LightweightCharts.createChart(containerRef.current, {
              width: containerRef.current.clientWidth,
              height: 400,
              layout: { background: { type: 'solid', color: '#05080c' }, textColor: '#94a3b8' },
              grid: { vertLines: { visible: false }, horzLines: { visible: false } },
              localization: {
                timeFormatter: (t) => {
                  const d = new Date((t + 8 * 3600) * 1000);
                  return d.toISOString().slice(5, 16).replace('T', ' ');
                }
              },
              timeScale: {
                timeVisible: true,
                secondsVisible: false,
                tickMarkFormatter: (t) => {
                  const d = new Date((t + 8 * 3600) * 1000);
                  const iso = d.toISOString();
                  const hm = iso.slice(11, 16);
                  return hm === '00:00' ? iso.slice(5, 10).replace('-', '/') : hm;
                }
              }
            });
            const series = chart.addCandlestickSeries({
              upColor: '#10b981', downColor: '#f43f5e', borderVisible: false,
              wickUpColor: '#10b981', wickDownColor: '#f43f5e',
              priceLineVisible: false
            });
            series.setData(candles);
            const ema50Series = chart.addLineSeries({ color: '#f59e0b', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
            ema50Series.setData(ema50Data);
            const ema200Series = chart.addLineSeries({ color: '#a855f7', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
            ema200Series.setData(ema200Data);
            priceLines.forEach(pl => series.createPriceLine(pl));
            if (exitTime && trade.closePrice) {
              const conn = chart.addLineSeries({
                color: (trade.profitLoss || 0) >= 0 ? 'rgba(16,185,129,0.45)' : 'rgba(244,63,94,0.45)',
                lineWidth: 1,
                lineStyle: LightweightCharts.LineStyle.Dotted,
                priceLineVisible: false,
                lastValueVisible: false,
                crosshairMarkerVisible: false
              });
              conn.setData([{ time: entryTime, value: Number(trade.price) }, { time: exitTime, value: Number(trade.closePrice) }]);
            }
            const barSec = 300;
            const hasExit = !!(exitTime && trade.closePrice);
            const t1 = entryBar != null ? entryBar : entryTime;
            const t2 = hasExit ? (exitBar != null ? exitBar : exitTime) : null;
            const mid = t2 != null ? (t1 + t2) / 2 : t1;
            const half = t2 != null ? Math.max((t2 - t1) / 2, 8 * barSec) + 4 * barSec : 12 * barSec;
            const viewFrom = Math.max(candles[0].time, Math.round(mid - half));
            const viewTo = Math.min(candles[candles.length - 1].time + barSec - 1, Math.round(mid + half));
            requestAnimationFrame(() => { if (!disposed && chart) chart.timeScale().setVisibleRange({ from: viewFrom, to: viewTo }); });
            series.setMarkers([
              {
                time: entryBar != null ? entryBar : entryTime,
                position: trade.tradeType === 'LONG' ? 'belowBar' : 'aboveBar',
                color: trade.tradeType === 'LONG' ? '#10b981' : '#f43f5e',
                shape: trade.tradeType === 'LONG' ? 'arrowUp' : 'arrowDown',
                text: '开'
              },
              ...(hasExit ? [{
                time: exitBar != null ? exitBar : exitTime,
                position: trade.tradeType === 'LONG' ? 'aboveBar' : 'belowBar',
                color: (trade.profitLoss || 0) >= 0 ? '#10b981' : '#f43f5e',
                shape: 'circle',
                text: '平'
              }] : [])
            ]);
            window.addEventListener('resize', onResize);
          } catch (err) {
            if (!disposed) setChartError('K线数据加载失败: ' + (err.message || err));
          }
        };
        init();
        return () => {
          disposed = true;
          window.removeEventListener('resize', onResize);
          if (chart) { chart.remove(); chart = null; }
        };
      }, [trade]);

      const pnl = trade.profitLoss;
      return (
        <div onClick={onClose} className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 font-terminal">
          <div onClick={(e) => e.stopPropagation()} className="bg-[#080d14] border border-cyan-500/40 rounded-xl w-full max-w-4xl max-h-[90vh] overflow-y-auto p-5 shadow-2xl shadow-black relative font-mono text-slate-100">
            <div className="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-cyan-500 via-emerald-400 to-cyan-500 opacity-90"></div>
            <button
              onClick={onClose}
              className="absolute top-3 right-4 px-2 py-0.5 rounded bg-slate-800/80 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 border border-slate-700 text-xs font-bold transition-all"
            >
              [ ✕ ESC ]
            </button>
            <div className="flex items-center gap-2 mb-3">
              <span className="text-cyan-400 font-bold">&gt;</span>
              <h3 className="text-base font-bold text-slate-100 uppercase tracking-wider m-0 flex items-center gap-2">
                <span>TRADE_POSTMORTEM_ANALYSIS</span>
                <span className="text-xs text-slate-400 font-normal">[单笔交易K线形态复盘]</span>
                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${trade.tradeType === 'LONG' ? 'text-emerald-400 bg-emerald-500/10 border border-emerald-500/20' : 'text-rose-400 bg-rose-500/10 border border-rose-500/20'}`}>
                  {trade.tradeType === 'LONG' ? '▲ 做多 BUY' : '▼ 做空 SELL'}
                </span>
              </h3>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3 text-xs">
              <div className="p-2 rounded bg-[#05080c] border border-slate-800">
                <span className="text-slate-400 text-[10px] uppercase block">开仓价 / 时间</span>
                <span className="font-bold text-slate-100">{formatCurrency(trade.price)}</span>
                <span className="text-[10px] text-slate-400 block mt-0.5">{new Date(trade.timestamp).toLocaleString('zh-CN')}</span>
              </div>
              <div className="p-2 rounded bg-[#05080c] border border-slate-800">
                <span className="text-slate-400 text-[10px] uppercase block">平仓价 / 时间</span>
                <span className="font-bold text-slate-100">{trade.closePrice ? formatCurrency(trade.closePrice) : '持仓中'}</span>
                <span className="text-[10px] text-slate-400 block mt-0.5">{trade.closeTime ? new Date(trade.closeTime).toLocaleString('zh-CN') : '--'}</span>
              </div>
              <div className="p-2 rounded bg-[#05080c] border border-slate-800">
                <span className="text-slate-400 text-[10px] uppercase block">实盘结算盈亏</span>
                <span className={`font-bold text-base ${pnl != null && pnl >= 0 ? 'text-emerald-400 terminal-glow-green' : 'text-rose-400'}`}>
                  {pnl != null ? `${pnl > 0 ? '+' : ''}${formatAmountU(pnl)}` : '--'}
                </span>
              </div>
              <div className="p-2 rounded bg-[#05080c] border border-slate-800">
                <span className="text-slate-400 text-[10px] uppercase block">持仓周期</span>
                <span className="font-bold text-cyan-300">{trade.holdDuration ? trade.holdDuration + ' 分钟' : '--'}</span>
              </div>
            </div>
            {chartError ? (
              <div className="text-rose-400 text-xs p-6 text-center font-mono border border-rose-500/20 rounded bg-rose-500/5">
                [!] {chartError}
              </div>
            ) : (
              <div className="relative rounded-lg overflow-hidden border border-slate-800 bg-[#05080c]">
                <div ref={containerRef} style={{ width: '100%', height: '400px' }}></div>
                <div className="absolute top-2 left-2.5 z-10 pointer-events-none flex gap-3 flex-wrap text-[11px] font-mono text-slate-400 bg-[#080d14]/80 p-1.5 px-2.5 rounded border border-slate-800">
                  <span>▲ 开仓（<span className="text-emerald-400 font-bold">绿=多</span> / <span className="text-rose-400 font-bold">红=空</span>）</span>
                  <span>● 平仓（<span className="text-emerald-400 font-bold">绿=盈</span> / <span className="text-rose-400 font-bold">红=亏</span>）</span>
                  <span className="text-amber-400 font-bold">— EMA50</span>
                  <span className="text-purple-400 font-bold">— EMA200</span>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    const TradesQuery = ({ trades: propTrades, onChartView, dateRange, initialKeyword, initialFilters }) => {
      const [trades, setTrades] = useState([]);
      const [allTrades, setAllTrades] = useState(propTrades || []); // 存储所有交易数据
      const [loading, setLoading] = useState(false);
      const [currentPage, setCurrentPage] = useState(1);
      const pageSize = 50;
      const [sortConfig, setSortConfig] = useState({ field: null, direction: null });

      // 构建初始过滤条件对象
      const buildInitialFilters = () => ({
        reasoningKeyword: initialFilters?.reasoningKeyword || initialKeyword || '',
        signal: initialFilters?.signal || '',
        strategy: initialFilters?.strategy || '',
        confidenceMin: initialFilters?.confidenceMin || '',
        confidenceMax: initialFilters?.confidenceMax || '',
        startDate: initialFilters?.startDate || dateRange?.startDate || '',
        endDate: initialFilters?.endDate || dateRange?.endDate || '',
        tradeType: initialFilters?.tradeType || '',
        result: initialFilters?.result || ''
      });

      const [filters, setFilters] = useState(buildInitialFilters);

      // 同步父级传入的全部交易数据
      useEffect(() => {
        if (propTrades && propTrades.length > 0) {
          setAllTrades(propTrades);
        }
      }, [propTrades]);

      const fetchAllTrades = async () => {
        try {
          const response = await fetch('/api/all-trades');
          if (response.ok) {
            const tradesData = await response.json();
            setAllTrades(tradesData);
            return tradesData;
          }
        } catch (error) {
          console.error('获取交易记录失败:', error);
        }
        return null;
      };

      const fetchTrades = async (overrideFilters) => {
        const f = overrideFilters || filters;
        setLoading(true);
        try {
          let sourceTrades = allTrades;
          if (!sourceTrades || sourceTrades.length === 0) {
            if (propTrades && propTrades.length > 0) {
              sourceTrades = propTrades;
              setAllTrades(propTrades);
            } else {
              const fetched = await fetchAllTrades();
              if (fetched) sourceTrades = fetched;
            }
          }
          if (!sourceTrades) sourceTrades = [];

          let filteredTrades = sourceTrades.filter(trade => {
            if (f.reasoningKeyword) {
              const keyword = f.reasoningKeyword.toLowerCase();
              const hasMatchingReasoning = trade.reasoning && trade.reasoning.some(reason =>
                reason.toLowerCase().includes(keyword)
              );
              if (!hasMatchingReasoning) return false;
            }

            if (f.signal) {
              if (f.signal === 'BUY' && trade.signal !== 'BUY') return false;
              if (f.signal === 'SELL' && trade.signal !== 'SELL') return false;
            }

            if (f.strategy) {
              const hasStrategy = trade.reasoning && trade.reasoning.some(reason =>
                reason.includes(f.strategy) || reason.startsWith(f.strategy)
              );
              if (!hasStrategy) return false;
            }

            if (f.confidenceMin) {
              const minConfidence = parseFloat(f.confidenceMin);
              if (trade.confidence < minConfidence) return false;
            }

            if (f.confidenceMax) {
              const maxConfidence = parseFloat(f.confidenceMax);
              if (trade.confidence > maxConfidence) return false;
            }

            if (f.startDate) {
              const tradeDate = new Date(trade.timestamp);
              const [sy, sm, sd] = f.startDate.split('-').map(Number);
              const startDate = new Date(sy, sm - 1, sd);
              if (tradeDate < startDate) return false;
            }

            if (f.endDate) {
              const tradeDate = new Date(trade.timestamp);
              const [ey, em, ed] = f.endDate.split('-').map(Number);
              const endDate = new Date(ey, em - 1, ed, 23, 59, 59, 999);
              if (tradeDate > endDate) return false;
            }

            if (f.tradeType && trade.tradeType !== f.tradeType) {
              return false;
            }

            if (f.result) {
              if (f.result === 'correct' && trade.isCorrect !== true) return false;
              if (f.result === 'incorrect' && trade.isCorrect !== false) return false;
              if (f.result === 'pending' && trade.isCorrect !== undefined) return false;
            }

            return true;
          });

          filteredTrades.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
          setTrades(filteredTrades);
          setCurrentPage(1);
        } catch (error) {
          console.error('筛选交易记录失败:', error);
        } finally {
          setLoading(false);
        }
      };

      const handleFilterChange = (key, value) => {
        setFilters(prev => ({ ...prev, [key]: value }));
      };

      const clearDateFilter = () => {
        const next = { ...filters, startDate: '', endDate: '' };
        setFilters(next);
        fetchTrades(next);
      };

      useEffect(() => {
        const nextFilters = buildInitialFilters();
        setFilters(nextFilters);
        fetchTrades(nextFilters);
      }, [initialFilters, initialKeyword, dateRange]);

      const resetFilters = () => {
        const empty = {
          reasoningKeyword: '',
          signal: '',
          strategy: '',
          confidenceMin: '',
          confidenceMax: '',
          startDate: '',
          endDate: '',
          tradeType: '',
          result: ''
        };
        setFilters(empty);
        setCurrentPage(1);
        fetchTrades(empty);
      };

      const formatCurrency = (amount) => {
        return new Intl.NumberFormat('zh-CN', {
          style: 'decimal',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(amount);
      };

      // 分页计算 (每页50条)
      const totalPages = Math.ceil(trades.length / pageSize) || 1;
      const validCurrentPage = Math.min(Math.max(1, currentPage), totalPages);
      const startIndex = (validCurrentPage - 1) * pageSize;
      const endIndex = startIndex + pageSize;
      const rawPageTrades = trades.slice(startIndex, endIndex);

      const handleSort = (field) => {
        setSortConfig(prev => {
          if (prev.field !== field) {
            return { field, direction: 'desc' };
          }
          if (prev.direction === 'desc') {
            return { field, direction: 'asc' };
          }
          return { field: null, direction: null };
        });
      };

      // 针对当前页进行价差和盈亏排序
      const paginatedTrades = React.useMemo(() => {
        const items = [...rawPageTrades];
        if (!sortConfig.field || !sortConfig.direction) {
          return items;
        }

        return items.sort((a, b) => {
          let valA = 0;
          let valB = 0;
          if (sortConfig.field === 'spread') {
            valA = a.closePrice != null ? (a.closePrice - a.price) : 0;
            valB = b.closePrice != null ? (b.closePrice - b.price) : 0;
          } else if (sortConfig.field === 'profitLoss') {
            valA = a.profitLoss != null ? a.profitLoss : 0;
            valB = b.profitLoss != null ? b.profitLoss : 0;
          }

          return sortConfig.direction === 'asc' ? valA - valB : valB - valA;
        });
      }, [rawPageTrades, sortConfig]);

      const getPageNumbers = () => {
        const pages = [];
        const maxButtons = 5;
        let start = Math.max(1, validCurrentPage - 2);
        let end = Math.min(totalPages, start + maxButtons - 1);
        if (end - start + 1 < maxButtons) {
          start = Math.max(1, end - maxButtons + 1);
        }
        for (let i = start; i <= end; i++) {
          pages.push(i);
        }
        return pages;
      };

      return (
        <div className="space-y-6 pb-12 animate-fade-in text-slate-100 font-terminal">
          {/* Terminal 筛选控制面板 */}
          <div className="p-4 rounded-xl bg-[#080d14] border border-emerald-500/30 shadow-2xl shadow-black/80 font-terminal relative overflow-hidden">
            <div className="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-emerald-500 via-cyan-400 to-emerald-500 opacity-80"></div>
            
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-3 border-b border-slate-800">
              <div className="flex items-center gap-2">
                <span className="text-emerald-400 font-bold text-lg font-mono">&gt;</span>
                <h4 className="text-base font-bold text-slate-100 uppercase tracking-wider font-mono m-0">
                  QUERY_FILTER_MATRIX <span className="text-xs text-emerald-400/80 font-normal">[订单多维检索控制台]</span>
                </h4>
              </div>
              <div className="text-[11px] text-slate-400 font-mono">
                ENGINE: <span className="text-cyan-400 font-bold">CLIENT_FAST_INDEXER</span>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-12 gap-3 mb-4 font-mono">
              {/* 入场原因关键词 */}
              <div className="md:col-span-3">
                <label className="block text-[11px] text-slate-400 uppercase tracking-wider mb-1.5">入场原因关键词</label>
                <input
                  type="text"
                  value={filters.reasoningKeyword}
                  onChange={(e) => handleFilterChange('reasoningKeyword', e.target.value)}
                  placeholder="反包 / 6连跌 / EMA50..."
                  className="form-control w-full px-3 py-1.5 text-xs text-slate-200"
                />
              </div>

              {/* 策略 */}
              <div className="md:col-span-2">
                <label className="block text-[11px] text-slate-400 uppercase tracking-wider mb-1.5">策略体系</label>
                <select
                  value={filters.strategy}
                  onChange={(e) => handleFilterChange('strategy', e.target.value)}
                  className="form-control form-select w-full px-3 py-1.5 text-xs text-slate-200"
                >
                  <option value="">全部策略</option>
                  <option value="趋势策略">趋势策略</option>
                  <option value="反转策略">反转策略</option>
                </select>
              </div>

              {/* 时间范围 */}
              <div className="md:col-span-3">
                <label className="block text-[11px] text-slate-400 uppercase tracking-wider mb-1.5">时间周期范围</label>
                <div className="flex items-center gap-1.5">
                  <input
                    type="date"
                    value={filters.startDate}
                    onChange={(e) => handleFilterChange('startDate', e.target.value)}
                    className="form-control form-date flex-1 px-2.5 py-1.5 text-xs"
                  />
                  <span className="text-slate-500 text-xs">至</span>
                  <input
                    type="date"
                    value={filters.endDate}
                    onChange={(e) => handleFilterChange('endDate', e.target.value)}
                    className="form-control form-date flex-1 px-2.5 py-1.5 text-xs"
                  />
                  {(filters.startDate || filters.endDate) && (
                    <button
                      onClick={clearDateFilter}
                      title="清空时间范围"
                      className="px-1.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 border border-slate-700 text-xs font-bold"
                    >
                      ×
                    </button>
                  )}
                </div>
              </div>

              {/* 交易方向 */}
              <div className="md:col-span-2">
                <label className="block text-[11px] text-slate-400 uppercase tracking-wider mb-1.5">方向</label>
                <select
                  value={filters.tradeType}
                  onChange={(e) => handleFilterChange('tradeType', e.target.value)}
                  className="form-control form-select w-full px-3 py-1.5 text-xs text-slate-200"
                >
                  <option value="">全部方向</option>
                  <option value="LONG">▲ 做多 LONG</option>
                  <option value="SHORT">▼ 做空 SHORT</option>
                </select>
              </div>

              {/* 预测结果 */}
              <div className="md:col-span-2">
                <label className="block text-[11px] text-slate-400 uppercase tracking-wider mb-1.5">预测结果</label>
                <select
                  value={filters.result}
                  onChange={(e) => handleFilterChange('result', e.target.value)}
                  className="form-control form-select w-full px-3 py-1.5 text-xs text-slate-200"
                >
                  <option value="">全部结果</option>
                  <option value="correct">盈利 (正确)</option>
                  <option value="incorrect">亏损 (错误)</option>
                  <option value="pending">持仓中 (待结)</option>
                </select>
              </div>
            </div>

            {/* 操作按钮 */}
            <div className="flex gap-2 justify-end font-mono">
              <button
                onClick={(e) => {
                  e.preventDefault();
                  resetFilters();
                }}
                className="px-3.5 py-1.5 bg-[#05080c] hover:bg-slate-800/80 border border-slate-700 rounded text-slate-300 text-xs font-bold tracking-wider transition-all"
              >
                [ 重置 RESET ]
              </button>

              <button
                onClick={(e) => {
                  e.preventDefault();
                  fetchTrades();
                }}
                disabled={loading}
                className="px-4 py-1.5 bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400 rounded text-emerald-300 text-xs font-bold tracking-wider transition-all shadow-sm shadow-emerald-500/20 disabled:opacity-50 flex items-center gap-2"
              >
                {loading ? (
                  <>
                    <div className="w-3 h-3 border-2 border-emerald-300/30 border-t-emerald-300 rounded-full animate-spin"></div>
                    [ 查询中... ]
                  </>
                ) : '[ 执行查询 QUERY ]'}
              </button>
            </div>
          </div>

          {/* 查询统计结果信息条 */}
          <div className="p-2.5 px-3 rounded-lg bg-[#05080c] border border-slate-800 text-xs font-mono text-slate-400 flex flex-wrap items-center justify-between gap-2">
            <div className="flex flex-wrap items-center gap-2">
              <span className="text-emerald-400 font-bold">SYS.QUERY ::</span>
              <span>MATCHED <span className="text-slate-100 font-bold">{trades.length}</span> RECORDS</span>
              <span className="text-slate-600">|</span>
              <span className="text-cyan-400">PAGE <span className="text-slate-100 font-bold">{validCurrentPage}</span>/{totalPages} (50/PAGE)</span>
              {(() => {
                const activeFilters = [];
                if (filters.reasoningKeyword) activeFilters.push(`KEYWORD: "${filters.reasoningKeyword}"`);
                if (filters.strategy) activeFilters.push(`STRATEGY: ${filters.strategy}`);
                if (filters.signal) activeFilters.push(`SIGNAL: ${filters.signal}`);
                if (filters.confidenceMin) activeFilters.push(`CONF≥${filters.confidenceMin}%`);
                if (filters.confidenceMax) activeFilters.push(`CONF≤${filters.confidenceMax}%`);
                if (filters.startDate) activeFilters.push(`FROM: ${filters.startDate}`);
                if (filters.endDate) activeFilters.push(`TO: ${filters.endDate}`);
                if (filters.tradeType) activeFilters.push(`DIR: ${filters.tradeType}`);
                if (filters.result) activeFilters.push(`RES: ${filters.result}`);
                if (!activeFilters.length) return null;
                return (
                  <>
                    <span className="text-slate-600">|</span>
                    <span className="text-cyan-400">{activeFilters.join(' | ')}</span>
                  </>
                );
              })()}
              {sortConfig.field && (
                <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 text-[10px] font-mono">
                  <span>当前页排序: {sortConfig.field === 'spread' ? '价差' : '盈亏'} ({sortConfig.direction === 'asc' ? '升序 ▲' : '降序 ▼'})</span>
                  <button
                    onClick={() => setSortConfig({ field: null, direction: null })}
                    className="text-cyan-400 hover:text-cyan-100 font-bold ml-0.5"
                    title="恢复当前页默认顺序"
                  >
                    ×
                  </button>
                </span>
              )}
            </div>

            {trades.length > 0 && (
              <div className="text-[11px] text-slate-500 font-mono">
                当前显示第 {startIndex + 1} - {Math.min(endIndex, trades.length)} 条
              </div>
            )}
          </div>

          {/* 交易记录表格 */}
          <div className="p-4 rounded-xl bg-[#080d14] border border-emerald-500/25 shadow-2xl shadow-black/80 font-mono">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs border-collapse font-mono" style={{ minWidth: '800px' }}>
                <thead>
                  <tr className="border-b border-slate-800 text-slate-400 uppercase tracking-wider text-[11px] bg-[#05080c]/60">
                    <th className="py-2.5 px-3">开仓时间</th>
                    <th className="py-2.5 px-3">开仓价</th>
                    <th className="py-2.5 px-3">开仓金额</th>
                    <th className="py-2.5 px-3">方向</th>
                    <th className="py-2.5 px-3">入场原因</th>
                    <th className="py-2.5 px-3">平仓价</th>
                    <th
                      onClick={() => handleSort('spread')}
                      className="py-2.5 px-3 cursor-pointer select-none hover:text-cyan-300 transition-colors group"
                      title="点击按当前页价差排序 (降序/升序/恢复默认)"
                    >
                      <div className="inline-flex items-center gap-1">
                        <span>价差</span>
                        <span className={`text-[10px] font-mono transition-colors ${sortConfig.field === 'spread' ? 'text-cyan-400 font-bold' : 'text-slate-600 group-hover:text-slate-400'}`}>
                          {sortConfig.field === 'spread' ? (sortConfig.direction === 'asc' ? '▲' : '▼') : '↕'}
                        </span>
                      </div>
                    </th>
                    <th className="py-2.5 px-3">平仓时间</th>
                    <th
                      onClick={() => handleSort('profitLoss')}
                      className="py-2.5 px-3 text-right cursor-pointer select-none hover:text-emerald-300 transition-colors group"
                      title="点击按当前页盈亏排序 (降序/升序/恢复默认)"
                    >
                      <div className="inline-flex items-center justify-end gap-1 w-full">
                        <span>盈亏</span>
                        <span className={`text-[10px] font-mono transition-colors ${sortConfig.field === 'profitLoss' ? 'text-emerald-400 font-bold' : 'text-slate-600 group-hover:text-slate-400'}`}>
                          {sortConfig.field === 'profitLoss' ? (sortConfig.direction === 'asc' ? '▲' : '▼') : '↕'}
                        </span>
                      </div>
                    </th>
                    <th className="py-2.5 px-3 text-center">动作</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60">
                  {paginatedTrades.map((trade) => {
                    const isProfit = trade.profitLoss != null && trade.profitLoss >= 0;
                    return (
                      <tr
                        key={trade._id}
                        className="hover:bg-slate-800/30 transition-colors"
                      >
                        <td className="py-2.5 px-3 text-slate-300 whitespace-nowrap">
                          {new Date(trade.timestamp).toLocaleString('zh-CN')}
                        </td>
                        <td className="py-2.5 px-3 text-slate-100 font-bold whitespace-nowrap">
                          {formatCurrency(trade.price)}
                        </td>
                        <td className="py-2.5 px-3 text-slate-300 whitespace-nowrap">
                          {trade.investmentAmount != null ? formatAmountU(trade.investmentAmount) : '-'}
                        </td>
                        <td className="py-2.5 px-3 whitespace-nowrap">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                            trade.tradeType === 'LONG'
                              ? 'text-emerald-400 bg-emerald-500/10 border border-emerald-500/20'
                              : 'text-rose-400 bg-rose-500/10 border border-rose-500/20'
                          }`}>
                            {trade.tradeType === 'LONG' ? '▲ 多 BUY' : '▼ 空 SELL'}
                          </span>
                        </td>
                        <td className="py-2.5 px-3 max-w-xs">
                          <div className="text-[11px] text-slate-300 leading-snug">
                            {trade.reasoning ? trade.reasoning.slice(0, 2).map((reason, index) => (
                              <div key={index} className="truncate">• {reason}</div>
                            )) : '-'}
                          </div>
                        </td>
                        <td className="py-2.5 px-3 text-slate-200 whitespace-nowrap">
                          {trade.closePrice ? formatCurrency(trade.closePrice) : <span className="text-amber-400 text-[10px]">[持仓中]</span>}
                        </td>
                        <td className="py-2.5 px-3 text-slate-300 whitespace-nowrap">
                          {trade.closePrice ?
                            `${trade.closePrice > trade.price ? '+' : ''}${formatCurrency(trade.closePrice - trade.price)}`
                            : '-'}
                        </td>
                        <td className="py-2.5 px-3 text-slate-400 text-[11px] whitespace-nowrap">
                          {trade.closeTime ? new Date(trade.closeTime).toLocaleTimeString() : '-'}
                        </td>
                        <td className="py-2.5 px-3 text-right font-bold whitespace-nowrap">
                          {trade.profitLoss !== undefined ? (
                            <span className={isProfit ? 'text-emerald-400 terminal-glow-green' : 'text-rose-400'}>
                              {trade.profitLoss > 0 ? '+' : ''}{formatAmountU(trade.profitLoss)}
                            </span>
                          ) : (
                            <span className="text-slate-500">-</span>
                          )}
                        </td>
                        <td className="py-2.5 px-3 text-center whitespace-nowrap">
                          <button
                            onClick={() => onChartView(trade)}
                            className="px-2.5 py-1 rounded bg-cyan-500/10 hover:bg-cyan-500/25 text-cyan-400 hover:text-cyan-300 border border-cyan-500/40 text-[11px] font-bold tracking-wider transition-all"
                          >
                            [ K线复盘 ]
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                  {trades.length === 0 && !loading && (
                    <tr>
                      <td colSpan="10" className="text-center py-10 text-slate-500 font-mono">
                        [!] NO_MATCHING_RECORDS_FOUND
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>

            {/* 分页控制栏 (每页50条) */}
            {trades.length > 0 && (
              <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-4 mt-4 border-t border-slate-800 text-xs font-mono">
                <div className="text-slate-400">
                  显示第 <span className="text-slate-100 font-bold">{startIndex + 1}</span> - <span className="text-slate-100 font-bold">{Math.min(endIndex, trades.length)}</span> 条，
                  共 <span className="text-cyan-400 font-bold">{trades.length}</span> 条数据
                  <span className="text-slate-500 ml-1.5">[每页 50 条 ｜ 第 {validCurrentPage} / {totalPages} 页]</span>
                </div>

                <div className="flex flex-wrap items-center gap-1.5">
                  <button
                    onClick={() => setCurrentPage(1)}
                    disabled={validCurrentPage === 1}
                    className="px-2.5 py-1 rounded bg-[#05080c] hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-[#05080c] border border-slate-700 text-slate-300 text-xs transition-colors"
                  >
                    &laquo; 首页
                  </button>
                  <button
                    onClick={() => setCurrentPage(prev => Math.max(1, prev - 1))}
                    disabled={validCurrentPage === 1}
                    className="px-2.5 py-1 rounded bg-[#05080c] hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-[#05080c] border border-slate-700 text-slate-300 text-xs transition-colors"
                  >
                    &lsaquo; 上一页
                  </button>

                  {getPageNumbers().map(p => (
                    <button
                      key={p}
                      onClick={() => setCurrentPage(p)}
                      className={`min-w-[30px] h-7 px-2 rounded text-xs font-bold transition-all ${
                        validCurrentPage === p
                          ? 'bg-emerald-500/25 text-emerald-300 border border-emerald-400 shadow-sm shadow-emerald-500/30'
                          : 'bg-[#05080c] hover:bg-slate-800 border border-slate-700 text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      {p}
                    </button>
                  ))}

                  <button
                    onClick={() => setCurrentPage(prev => Math.min(totalPages, prev + 1))}
                    disabled={validCurrentPage === totalPages}
                    className="px-2.5 py-1 rounded bg-[#05080c] hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-[#05080c] border border-slate-700 text-slate-300 text-xs transition-colors"
                  >
                    下一页 &rsaquo;
                  </button>
                  <button
                    onClick={() => setCurrentPage(totalPages)}
                    disabled={validCurrentPage === totalPages}
                    className="px-2.5 py-1 rounded bg-[#05080c] hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-[#05080c] border border-slate-700 text-slate-300 text-xs transition-colors"
                  >
                    末页 &raquo;
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.render(<Dashboard />, document.getElementById('root'));
  </script>
</body>

</html>
